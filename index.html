  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --neon-pink: #FF2A6D;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }

    /* ✅ HEADER — SMOOTH HIDE */
    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
      will-change: transform, opacity;
    }

    header.hidden {
      transform: translateY(-100%);
      opacity: 0;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .logo-container:hover {
      transform: scale(1.03);
    }

    .cringe-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-green));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(212, 0, 255, 0.5);
      position: relative;
      overflow: hidden;
    }

    .cringe-logo::before {
      content: "💀";
      font-size: 24px;
      animation: pulseLogo 2s infinite alternate;
    }

    @keyframes pulseLogo {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
    }

    .logo-title::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--neon-green);
      transition: width 0.3s ease;
    }

    .logo-container:hover .logo-title::after {
      width: 100%;
    }

    /* ✅ UI BAR — SMOOTH COLLAPSE */
    .ui-bar {
      display: flex;
      flex-direction: column;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      z-index: 99;
      transition: height 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
      overflow: hidden;
      height: auto;
      will-change: height, opacity;
    }

    .ui-bar.hidden {
      height: 0 !important;
      opacity: 0;
    }

    .tab-bar {
      display: flex;
      justify-content: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(212, 0, 255, 0.1);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab-btn.active {
      color: var(--neon-green);
    }

    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--neon-green);
    }

    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid rgba(212, 0, 255, 0.1);
    }

    .control-btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    /* ✅ FEED — FULL SCREEN EXPANSION */
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: max(100px, env(safe-area-inset-bottom));
      transition: padding-top 0.4s cubic-bezier(0.33, 1, 0.68, 1);
      will-change: padding-top;
    }

    #feed.fullscreen {
      padding-top: 0;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .nsfw-badge {
      background: var(--neon-pink);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    .reaction-badge {
      background: var(--neon-green);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
      padding-top: 36px;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .reactions {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0 20px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(212, 0, 255, 0.1);
    }

    .reaction-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reaction-btn {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
    }

    .reaction-btn:active {
      transform: scale(1.3);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }

    .reaction-count {
      font-size: 14px;
      color: var(--neon-green);
      font-weight: bold;
      min-width: 20px;
      text-align: center;
      background: rgba(57, 255, 20, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .reaction-count.animated {
      animation: bounce 0.3s;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .ad-container {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .ad-container::before {
      content: "Sponsored by Cringe Lords";
      color: var(--neon-green);
      font-size: 12px;
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
    }

    .skeleton-card {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      height: 400px;
      animation: pulseSkeleton 1.5s infinite ease-in-out;
    }

    @keyframes pulseSkeleton {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    #installPrompt {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      z-index: 1000;
      border-top: 1px solid var(--neon-purple);
      display: none;
    }

    .prompt-btn {
      background: var(--neon-purple);
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 8px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ✅ CHAT PANEL — REPLACES LEADERBOARD */
    #chatPanel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100dvh;
      background: rgba(13, 13, 26, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      z-index: 200;
      transition: right 0.3s ease;
      border-left: 1px solid var(--neon-purple);
      display: flex;
      flex-direction: column;
    }

    #chatPanel.open {
      right: 0;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      margin-bottom: 10px;
    }

    .chat-title {
      font-size: 20px;
      color: var(--neon-green);
    }

    .close-chat {
      background: none;
      border: none;
      color: var(--neon-green);
      font-size: 24px;
      cursor: pointer;
    }

    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-message {
      background: rgba(57, 255, 20, 0.1);
      border-radius: 10px;
      padding: 8px 12px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .chat-message.self {
      align-self: flex-end;
      background: rgba(212, 0, 255, 0.1);
    }

    .chat-message .username {
      font-weight: bold;
      color: var(--neon-purple);
      font-size: 12px;
      display: block;
    }

    .chat-message .content {
      margin-top: 4px;
      font-size: 14px;
    }

    #chatInput {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }

    #chatInput input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--neon-green);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    #chatInput button {
      background: var(--neon-green);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ✅ LOGIN MODAL */
    #loginModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }

    .login-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 2px solid var(--neon-purple);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .login-content h2 {
      color: var(--neon-purple);
      margin-bottom: 15px;
      text-align: center;
    }

    .login-input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--neon-green);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
    }

    .login-btns {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .login-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn.login {
      background: var(--neon-green);
      color: var(--bg);
    }

    .login-btn.signup {
      background: var(--neon-purple);
      color: var(--bg);
    }

    .login-switch {
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      color: var(--neon-green);
      cursor: pointer;
    }

    .close-login {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--neon-green);
      font-size: 24px;
      cursor: pointer;
    }

    #logoutBtn {
      display: none;
      background: var(--neon-pink);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    #userStatus {
      display: none;
      color: var(--neon-green);
      font-size: 12px;
      margin-right: 10px;
    }

    #nsfwModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      border: 2px solid var(--neon-pink);
    }

    .modal-content h2 {
      color: var(--neon-pink);
      margin-bottom: 20px;
    }

    .modal-btn {
      background: var(--neon-pink);
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer-notice {
      text-align: center;
      margin: 30px 0;
      font-size: 12px;
      color: #8a8aa0;
    }

    .footer-notice a {
      color: #8a8aa0;
      text-decoration: none;
    }

    /* Meme Generator Modal */
    #memeGenerator {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }

    .generator-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      border: 2px solid var(--neon-purple);
    }

    .generator-content h2 {
      color: var(--neon-purple);
      margin-bottom: 15px;
    }

    .generator-inputs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="text"] {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--neon-green);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    .generator-btns {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .generator-btn {
      flex: 1;
      padding: 12px;

  <script>
    // ===== CORE ENGINE v2.6 — BLACK BOX GONE + LOGIN FIXED + CLOSE BUTTON ADDED =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;

    let isNSFW = localStorage.getItem('cringeNSFW') === 'true';

    let db = null;
    let auth = null;

    const NSFW_SOURCES = [
      'https://meme-api.com/gimme/ComedyCemetery',
      'https://meme-api.com/gimme/terriblefacebookmemes',
      'https://meme-api.com/gimme/okbuddyretard',
      'https://meme-api.com/gimme/2meirl4meirl',
      'https://meme-api.com/gimme/antiwork',
      'https://meme-api.com/gimme/iamverysmart'

      'https://meme-api.com/gimme/wholesomememes',

    ];

    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };

    // 🔥 FIREBASE INIT
    window.addEventListener('load', () => {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();

            document.getElementById('userStatus').style.display = 'block';
            document.getElementById('userName').textContent = user.email.split('@')[0];
            document.getElementById('loginBtn').style.display = 'none';

        });
      } else {
        console.error("Firebase failed to load");
      }
    });

    // 🔥 STORE MEME ON FIRST REACTION
    const ensureMemeInDB = async (meme) => {
      if (!db) return;
      try {
        const docRef = db.collection('memes').doc(meme.id);
        const doc = await docRef.get();
        if (!doc.exists) {
          await docRef.set({
            title: meme.title,
            url: meme.url,
            isNSFW: meme.isNSFW,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }
      } catch (e) {
        console.warn("Meme storage failed:", e);
      }
    };

    // 🔥 REAL-TIME REACTIONS
    const getReactions = async (memeId) => {
      if (!db) return { total: 0, counts: {} };
      try {
        const doc = await db.collection('reactions').doc(memeId).get();
        if (doc.exists) {
          return doc.data();
        }
        return { total: 0, counts: {} };
      } catch (e) {
        console.warn("Reaction fetch failed:", e);
        return { total: 0, counts: {} };
      }
    };

    const addReaction = async (memeId, emoji, memeData) => {
      if (!db) return;
      try {
        // ✅ STORE MEME IF NOT EXISTS
        await ensureMemeInDB(memeData);
        
        const docRef = db.collection('reactions').doc(memeId);
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(docRef);
          const data = doc.exists ? doc.data() : { total: 0, counts: {} };
          data.counts[emoji] = (data.counts[emoji] || 0) + 1;
          data.total += 1;
          transaction.set(docRef, data);
        });
      } catch (e) {
        console.warn("Reaction update failed:", e);
      }
    };

    // 🔥 RENDER MEME
    const renderMeme = async (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.dataset.id = meme.id;
      
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      
      if (meme.isNSFW) {
        const nsfwBadge = document.createElement('div');
        nsfwBadge.className = 'nsfw-badge';
        nsfwBadge.textContent = 'MATURE';
        badgeContainer.appendChild(nsfwBadge);
      }
      
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(meme.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      
      const reactionsDiv = document.createElement('div');
      reactionsDiv.className = 'reactions';
      
      const emojis = ['💀', '😂', '🤡', '🥴'];
      const reactionData = await getReactions(meme.id);
      
      emojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'reaction-item';
        
        const btn = document.createElement('div');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = async () => {
          await addReaction(meme.id, emoji, meme); // ✅ PASS MEME DATA
          const countEl = item.querySelector('.reaction-count');
          const newCount = (reactionData.counts[emoji] || 0) + 1;
          if (countEl) {
            countEl.textContent = newCount;
            countEl.classList.add('animated');
            setTimeout(() => countEl.classList.remove('animated'), 300);
          } else {
            const countDisplay = document.createElement('div');
            countDisplay.className = 'reaction-count';
            countDisplay.textContent = newCount;
            item.appendChild(countDisplay);
          }
          updateLeaderboard();
        };
        
        const countDisplay = document.createElement('div');
        countDisplay.className = 'reaction-count';
        countDisplay.textContent = reactionData.counts[emoji] || 0;
        
        item.appendChild(btn);
        item.appendChild(countDisplay);
        reactionsDiv.appendChild(item);

      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>

      card.appendChild(reactionsDiv);

    // 🔥 AD RENDER
    const renderAd = () => {
      if (isNSFW) return;
      
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});

        console.warn("AdSense failed to load:", e.message);
      }
    };

    // 🔥 LOAD FEED
    const loadFeed = async (clear = false) => {
      if (isLoading) return;
      isLoading = true;
      
      if (clear) {
        feed.innerHTML = '';
        loadCount = 0;
      }
      
      if (loadCount === 0) {
        feed.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const skeleton = document.createElement('div');
          skeleton.className = 'skeleton-card';
          feed.appendChild(skeleton);
        }
      }
      
      if (loadCount === 0 && currentTab === 'hot') {
        const userMemes = await fetchUserMemes(2);
        for (const meme of userMemes) {
          if (!seenUrls.has(meme.url)) {
            seenUrls.add(meme.url);
            await renderMeme(meme);
            loadCount++;
          }
        }
      }
      
      const meme = await fetchMeme();
      if (meme) {
        await renderMeme(meme);
        loadCount++;
        if (!isNSFW && loadCount > 0) {
          const nextAdAt = [5, 6, 7][Math.floor(Math.random() * 3)];
          if (loadCount % nextAdAt === 0) {
            setTimeout(renderAd, 100);
          }
        }
      }
      
      if (loadCount > 0) {
        document.querySelectorAll('.skeleton-card').forEach(el => el.remove());
      }
      
      isLoading = false;
    };

    // 🔥 FETCH USER MEMES
    const fetchUserMemes = async (limit = 3) => {
      if (!db) return [];
      try {
        const q = db.collection('memes')
          .where('isUserGenerated', '==', true)
          .orderBy('createdAt', 'desc')
          .limit(limit);
        const snapshot = await q.get();
        return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      } catch (e) {
        console.warn("User memes fetch failed:", e);
        return [];
      }
    };

    // 🔥 FETCH MEME
    const fetchMeme = async () => {
      try {
        const sources = isNSFW ? NSFW_SOURCES : SFW_SOURCES;
        const shuffled = [...sources].sort(() => 0.5 - Math.random());
        for (let i = 0; i < shuffled.length; i++) {
          const url = `${shuffled[i]}?_=${Date.now()}`;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(url, { cache: 'no-store', mode: 'cors', signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) continue;
            const data = await res.json();
            if (!data?.url || seenUrls.has(data.url)) continue;
            seenUrls.add(data.url);
            return { 
              url: data.url, 
              title: data.title || (isNSFW ? 'Mature Cringe' : 'Cringe'),
              ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
              isNSFW: isNSFW,
              id: data.url.split('/').pop(),
              isUserGenerated: false
            };
          } catch (e) {
            continue;
          }
        }
        return null;
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    // 🔥 CREATE MEME
    const createMeme = async (top, bottom, imageUrl) => {
      if (!db) {
        alert("Service unavailable. Try again later.");
        return;
      }
      try {
        const memeId = 'user_' + Date.now();
        const memeData = {
          id: memeId,
          url: imageUrl,
          title: `${top || ''} ${bottom || ''}`.trim() || 'User Cringe',
          ups: 0,
          isNSFW: isNSFW,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          isUserGenerated: true
        };
        await db.collection('memes').doc(memeId).set(memeData);
        document.getElementById('memeGenerator').style.display = 'none';
        document.getElementById('topText').value = '';
        document.getElementById('bottomText').value = '';
        document.getElementById('imageUrl').value = '';
        loadFeed(true);
      } catch (e) {
        alert("Failed to create meme. Check image URL.");
        console.error(e);
      }
    };

    // 🔥 TAB SWITCHING
    const switchTab = (tab) => {
      if (currentTab === tab) return;
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };

    // 🔥 CRINGE ROULETTE
    const cringeRoulette = async () => {
      const rouletteBtn = document.getElementById('rouletteBtn');
      rouletteBtn.textContent = '🎰';
      rouletteBtn.disabled = true;
      
      let tempMemes = [];
      for (let i = 0; i < 3; i++) {
        const meme = await fetchMeme();
        if (meme) tempMemes.push(meme);
      }
      
      let i = 0;
      const interval = setInterval(() => {
        if (i < 5) {
          feed.innerHTML = '';
          if (tempMemes.length > 0) {
            renderMeme(tempMemes[i % tempMemes.length]);
          }
          i++;
        } else {
          clearInterval(interval);
          rouletteBtn.textContent = '🎯';
          rouletteBtn.disabled = false;
          loadCount++;
          if (!isNSFW && loadCount % 7 === 0) setTimeout(renderAd, 100);
        }
      }, 200);

    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;

      } else {
        document.body.style.background = 'var(--bg)';

      localStorage.setItem('cringeGlow', isGlowMode);

      if (!db || !currentUser) return;
      const chatMessages = document.getElementById('chatMessages');

      try {
        const q = db.collection('chat').orderBy('timestamp', 'desc').limit(50);
        const snapshot = await q.get();
        chatMessages.innerHTML = '';
        snapshot.docs.reverse().forEach(doc => {
          const msg = doc.data();
          const msgDiv = document.createElement('div');
          msgDiv.className = msg.uid === currentUser.uid ? 'chat-message self' : 'chat-message';
          msgDiv.innerHTML = `
            <span class="username">${msg.username}</span>
            <span class="content">${escapeHtml(msg.text)}</span>
          `;
          chatMessages.appendChild(msgDiv);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (e) {
        chatMessages.innerHTML = '<div style="color:var(--neon-pink);">Error loading chat</div>';
      }

      if (!db || !currentUser) {
        document.getElementById('loginModal').style.display = 'flex';
        return;

      const input = document.getElementById('chatMessage');
      const text = input.value.trim();

        await db.collection('chat').add({
          uid: currentUser.uid,
          username: currentUser.email.split('@')[0],

          timestamp: firebase.firestore.FieldValue.serverTimestamp()

      if (!email || !password) {

      try {

      } catch (e) {
        alert("Login failed: " + e.message);
      }
    };

    const signup = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!email || !password) {
        alert("Please enter email and password.");
        return;
      }
      try {
        await auth.createUserWithEmailAndPassword(email, password);
        document.getElementById('loginModal').style.display = 'none';
      } catch (e) {
        alert("Sign up failed: " + e.message);
      }
    };

    // 🔥 LOGOUT
    const logout = async () => {
      try {
        await auth.signOut();
        document.getElementById('chatMessages').innerHTML = '';
      } catch (e) {
        console.warn("Logout failed:", e);
      }

    // 🔥 ULTRA-SMOOTH SCROLL HIDING — YOUTUBE-LEVEL FLUIDITY
    const initScrollHiding = () => {
      const header = document.querySelector('header');
      const uiBar = document.getElementById('uiBar');
      let ticking = false;
      let isHidden = false;
      let lastDirection = 0; // 1 = down, -1 = up

      const updateBars = () => {
        const currentScrollTop = feed.scrollTop;
        const scrollDelta = currentScrollTop - lastScrollTop;
        const direction = scrollDelta > 0 ? 1 : -1;
        
        // Only trigger on meaningful scroll (>10px)
        if (Math.abs(scrollDelta) > 10) {
          const shouldHide = direction === 1 && currentScrollTop > 100;
          
          if (shouldHide && !isHidden) {
            header.classList.add('hidden');
            uiBar.classList.add('hidden');
            feed.classList.add('fullscreen');
            isHidden = true;
          } else if (direction === -1 && isHidden) {
            header.classList.remove('hidden');
            uiBar.classList.remove('hidden');
            feed.classList.remove('fullscreen');
            isHidden = false;
          }
        }
        
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        lastDirection = direction;
        ticking = false;
      };

      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateBars);
          ticking = true;
        }
      });
    };

    // 🔥 BUTTON LISTENERS
    const attachButtonListeners = () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);

        if (!url) {
          alert("Image URL is required!");
          return;
        }
        createMeme(top, bottom, url);
      };
    };

    // 🔥 NSFW TOGGLE
    const enableNSFW = () => {
      isNSFW = true;
      localStorage.setItem('cringeNSFW', 'true');
      document.getElementById('nsfwBtn').textContent = '✅';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };

    const disableNSFW = () => {
      isNSFW = false;
      localStorage.setItem('cringeNSFW', 'false');
      document.getElementById('nsfwBtn').textContent = '🔞';
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };

    // 🔥 INIT
    const initApp = () => {
      feed = document.getElementById('feed');
      
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
        document.getElementById('glowBtn').textContent = '🕶️';
      }

      document.getElementById('nsfwBtn').textContent = isNSFW ? '✅' : '🔞';

      attachButtonListeners();
      initScrollHiding();

      if (!localStorage.getItem('installPromptSeen')) {
        setTimeout(() => {
          document.getElementById('installPrompt').style.display = 'block';
        }, 10000);
      }

      loadFeed();

      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadFeed();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
