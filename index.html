<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <!-- AdSense Global Script - YOUR REAL ID -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9372118866074955" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .meme-card:hover {
      transform: translateY(-2px);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .ad-container {
      background: var(--ad-bg);
      border-radius: 16px;
      margin: 20px 10px;
      padding: 16px;
      text-align: center;
      border: 1px dashed var(--neon-purple);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .ad-container::before {
      content: "Sponsored Cringe";
      color: var(--neon-green);
      font-size: 14px;
      opacity: 0.7;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 0 8px;
      border-radius: 4px;
    }

    .footer-notice {
      text-align: center;
      margin: 30px 0;
      font-size: 12px;
      color: #8a8aa0;
    }

    .footer-notice a {
      color: #8a8aa0;
      text-decoration: none;
    }

    .footer-notice a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    <div id="feed">
      <!-- Memes and ads load here -->
    </div>
  </div>

  <div class="footer-notice">
    <a href="/privacy.html">Privacy Policy</a>
  </div>

  <script>
    // ===== CORE ENGINE - FIXED FOR ADSENSE + SCROLL =====
    const feed = document.getElementById('feed');
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300;

    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    const fetchMeme = async () => {
      try {
        // 🔥 FIXED: REMOVED LEADING SPACE IN URL (was " https://...")
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now()}`, {
          cache: 'no-store',
          mode: 'cors'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { url: data.url, title: data.title || 'Cringe' };
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" onerror="this.parentElement.style.display='none'">
      `;
      feed.appendChild(card);
    };

    // 💥 FIXED AD RENDERING: NO SCRIPT TAG IN INNERHTML
    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      // Safely push to AdSense AFTER DOM insertion
      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("Ad load failed:", e);
      }
    };

    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;

        if (loadCount % 5 === 0) {
          // Render ad AFTER meme is in DOM
          setTimeout(renderAd, 100);
        }
      }

      isLoading = false;
    };

    // 🔄 FIXED SCROLL HANDLER: NO CONFLICT WITH ADS
    let scrollTimer;
    const handleScroll = () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const { scrollTop, scrollHeight, clientHeight } = feed;
        if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
          loadNext();
        }
      }, 100);
    };

    feed.addEventListener('scroll', handleScroll, { passive: true });

    // Load initial memes
    const loadInitial = () => {
      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 200);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadInitial);
    } else {
      loadInitial();
    }
  </script>
</body>
</html>
