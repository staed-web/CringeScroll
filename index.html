      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:10000';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const count = opts.particleCount || 50;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          angle: Math.random() * Math.PI * 2,
          speed: 2 + Math.random() * 3,
          size: 5 + Math.random() * 5,
          color: ['#D400FF', '#39FF14', '#FF2A6D'][Math.floor(Math.random() * 3)]
        });
      }
      const draw = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          p.x += Math.cos(p.angle) * p.speed;
          p.y += Math.sin(p.angle) * p.speed + 0.1;
          p.speed *= 0.98;
          if (p.speed > 0.1) alive = true;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (alive) requestAnimationFrame(draw);
        else document.body.removeChild(canvas);
      };
      requestAnimationFrame(draw);
    };

      if (!isSoundOn) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;

          gain.gain.value = 0.1;
          osc.type = 'sine';
        } else if (type === 'laugh') {
          osc.frequency.value = 300 + Math.random() * 200;
          gain.gain.value = 0.05;
          osc.type = 'square';
        }
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        setTimeout(() => ctx.close(), 300);
      } catch (e) {
        console.warn("Sound failed:", e);
      }
    };

    const fetchMeme = async () => {
      try {
        const mood = MOOD_SOURCES[currentMood] || MOOD_SOURCES.default;
        const sources = isNSFW ? mood.nsfw : mood.sfw;
        if (sources.length === 0) {
          const fallback = MOOD_SOURCES.default;
          return await _fetchFromSources(isNSFW ? fallback.nsfw : fallback.sfw);
        }
        return await _fetchFromSources(sources);
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    const _fetchFromSources = async (sources) => {
      const shuffled = [...sources].sort(() => 0.5 - Math.random());
      for (let url of shuffled) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 5000);
          const res = await fetch(`${url}?_=${Date.now()}`, {
            cache: 'no-store',
            mode: 'cors',
            signal: controller.signal
          });
          clearTimeout(timeout);
          if (!res.ok) continue;
          const data = await res.json();
          if (!data?.url || seenUrls.has(data.url)) continue;
          seenUrls.add(data.url);
          return { 
            url: data.url, 
            title: data.title || (isNSFW ? 'Mature Cringe' : 'Cringe'),
            ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
            isNSFW: isNSFW,
            id: data.url.split('/').pop() || Date.now().toString()
          };
        } catch (e) {
          continue;
        }
      }
      // Final fallback
      try {
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now()}`, {
          cache: 'no-store',
          mode: 'cors'
        });
        const data = await res.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { 
          url: data.url, 
          title: data.title || 'Cringe',
          ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
          isNSFW: false,
          id: data.url.split('/').pop() || Date.now().toString()
        };
      } catch (e) {
        return null;
      }
    };

    const updateLeaderboard = () => {
      const leaderboardList = document.getElementById('leaderboardList');
      leaderboardList.innerHTML = '';
      
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;
      const recentMemes = topMemes.filter(m => {
        const reactions = reactionCounts[m.id];
        return reactions && reactions.timestamp && (now - reactions.timestamp < oneDay);
      });

      const sorted = [...recentMemes].sort((a, b) => {
        const aTotal = (reactionCounts[a.id]?.total || 0);
        const bTotal = (reactionCounts[b.id]?.total || 0);
        return bTotal - aTotal;
      }).slice(0, 3);
      
      sorted.forEach((meme, index) => {
        const item = document.createElement('div');
        item.className = 'leaderboard-item';
        item.innerHTML = `
          <div class="leaderboard-rank">#${index + 1}</div>
          <div>${escapeHtml(meme.title)}</div>
          <div style="font-size:12px;color:var(--neon-green);margin-top:6px;">
            Reactions: ${reactionCounts[meme.id]?.total || 0}
          </div>
        `;
        leaderboardList.appendChild(item);
      });
    };

    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.dataset.id = meme.id;
      
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      
      if (meme.isNSFW) {
        const nsfwBadge = document.createElement('div');
        nsfwBadge.className = 'nsfw-badge';
        nsfwBadge.textContent = 'MATURE';
        badgeContainer.appendChild(nsfwBadge);
      }
      
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(meme.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      
      const reactionsDiv = document.createElement('div');
      reactionsDiv.className = 'reactions';
      
      const emojis = ['💀', '😂', '🤡', '🥴'];
      emojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'reaction-item';
        
        const btn = document.createElement('div');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = () => {
          playSound('boop');
          const counts = reactionCounts[meme.id] || { total: 0, timestamp: Date.now() };
          counts[emoji] = (counts[emoji] || 0) + 1;
          counts.total = (counts.total || 0) + 1;
          counts.timestamp = Date.now();
          reactionCounts[meme.id] = counts;
          localStorage.setItem('cringeReactions', JSON.stringify(reactionCounts));
          
          const countEl = item.querySelector('.reaction-count');
          if (countEl) {
            countEl.textContent = counts[emoji];
            countEl.classList.add('animated');
            setTimeout(() => countEl.classList.remove('animated'), 300);
          } else {
            const countDisplay = document.createElement('div');
            countDisplay.className = 'reaction-count';
            countDisplay.textContent = counts[emoji];
            item.appendChild(countDisplay);
          }
          
          if (!topMemes.find(m => m.id === meme.id)) {
            topMemes.push(meme);
            localStorage.setItem('cringeTopMemes', JSON.stringify(topMemes));
          }
          updateLeaderboard();

          if (counts.total >= 100) {
            confetti({ particleCount: 50 });
          }
        };
        
        const countDisplay = document.createElement('div');
        countDisplay.className = 'reaction-count';
        countDisplay.textContent = reactionCounts[meme.id]?.[emoji] || 0;
        
        item.appendChild(btn);
        item.appendChild(countDisplay);
        reactionsDiv.appendChild(item);
      });
      
      const shareBtn = document.createElement('button');
      shareBtn.className = 'share-btn';
      shareBtn.innerHTML = '📤';
      shareBtn.onclick = () => {
        const newUrl = `${window.location.origin}${window.location.pathname}#meme=${meme.id}`;
        history.replaceState(null, '', newUrl);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(newUrl).then(() => {
            shareBtn.textContent = '✓';
            setTimeout(() => shareBtn.innerHTML = '📤', 1000);
          }).catch(() => {});
        }
      };
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'meme-title';
      titleDiv.innerHTML = escapeHtml(meme.title);
      titleDiv.appendChild(shareBtn);
      
      const img = document.createElement('img');
      img.className = 'meme-image';
      img.src = meme.url;
      img.loading = 'lazy';
      img.alt = 'meme';
      img.onerror = () => {
        card.style.display = 'none';
        // Try loading next meme
        setTimeout(loadNext, 100);
      };
      
      // DOUBLE TAP TO ZOOM
      let lastTap = 0;
      img.addEventListener('click', () => {
        const currentTime = Date.now();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
          document.getElementById('zoomImage').src = meme.url;
          document.getElementById('zoomModal').style.display = 'flex';
        }
        lastTap = currentTime;
      });
      
      card.appendChild(titleDiv);
      card.appendChild(img);
      card.insertBefore(badgeContainer, card.firstChild);
      card.appendChild(reactionsDiv);
      feed.appendChild(card);
    };

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };

    const renderAd = () => {
      if (isNSFW) return;
      
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("Ad load failed:", e);
      }
    };

    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      if (loadCount === 0) {
        feed.innerHTML = '';
      }

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;
        if (!isNSFW && loadCount % 7 === 0) {
          setTimeout(renderAd, 100);
        }
      }
      isLoading = false;
    };

    const cringeRoulette = async () => {
      const rouletteBtn = document.getElementById('rouletteBtn');
      rouletteBtn.textContent = '🎰';
      rouletteBtn.disabled = true;
      
      let tempMemes = [];
      for (let i = 0; i < 3; i++) {
        const meme = await fetchMeme();
        if (meme) tempMemes.push(meme);
      }
      
      let i = 0;
      const interval = setInterval(() => {
        if (i < 5) {
          feed.innerHTML = '';
          if (tempMemes.length > 0) {
            renderMeme(tempMemes[i % tempMemes.length]);
          }
          i++;
        } else {
          clearInterval(interval);
          rouletteBtn.textContent = '🎯';
          rouletteBtn.disabled = false;
          loadCount++;
          if (!isNSFW && loadCount % 7 === 0) setTimeout(renderAd, 100);
        }
      }, 200);
    };

    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;
      if (isGlowMode) {
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
      } else {
        document.body.style.background = 'var(--bg)';
        document.body.style.animation = 'none';
      }
      document.getElementById('glowBtn').textContent = isGlowMode ? '🕶️' : '✨';
      localStorage.setItem('cringeGlow', isGlowMode);
    };

    const toggleSound = () => {
      isSoundOn = !isSoundOn;
      localStorage.setItem('cringeSound', isSoundOn ? 'true' : 'false');
      document.getElementById('soundBtn').textContent = isSoundOn ? '🔊' : '🔇';
    };

    const cycleMood = () => {
      const moods = ['default', 'wholesome', 'rage', 'surreal'];
      const currentIndex = moods.indexOf(currentMood);
      currentMood = moods[(currentIndex + 1) % moods.length];
      localStorage.setItem('cringeMood', currentMood);
      
      let emoji = '🎭';
      if (currentMood === 'wholesome') emoji = '❤️';
      else if (currentMood === 'rage') emoji = '😡';
      else if (currentMood === 'surreal') emoji = '🌀';
      
      document.getElementById('moodBtn').textContent = emoji;
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    const initScrollHiding = () => {
      const controlBar = document.getElementById('controlBar');
      let ticking = false;

      const updateControlBar = () => {
        const currentScrollTop = feed.scrollTop;
        if (currentScrollTop > lastScrollTop && currentScrollTop > 100) {
          controlBar.style.transform = 'translateY(-100%)';
          document.querySelector('header').style.transform = 'translateY(-100%)';
        } else if (currentScrollTop < lastScrollTop) {
          controlBar.style.transform = 'translateY(0)';
          document.querySelector('header').style.transform = 'translateY(0)';
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        ticking = false;
      };

      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateControlBar);
          ticking = true;
        }
      });
    };

    const attachButtonListeners = () => {
      document.getElementById('rouletteBtn').onclick = cringeRoulette;
      document.getElementById('glowBtn').onclick = toggleGlowMode;
      document.getElementById('soundBtn').onclick = toggleSound;
      document.getElementById('moodBtn').onclick = cycleMood;
      document.getElementById('leaderboardBtn').onclick = () => {
        document.getElementById('leaderboard').classList.add('open');
      };
      document.getElementById('closeLeaderboard').onclick = () => {
        document.getElementById('leaderboard').classList.remove('open');
      };
      document.getElementById('nsfwConfirm').onclick = enableNSFW;
      document.getElementById('nsfwCancel').onclick = () => {
        document.getElementById('nsfwModal').style.display = 'none';
      };
      document.getElementById('logoLink').onclick = () => {
        window.location.href = window.location.origin + window.location.pathname;
      };
      document.getElementById('installBtn').onclick = () => {
        alert("Tap 'Share' → 'Add to Home Screen' for fullscreen mode!");
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
      document.getElementById('dismissBtn').onclick = () => {
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
      document.getElementById('zoomModal').onclick = () => {
        document.getElementById('zoomModal').style.display = 'none';
      };
    };

    const enableNSFW = () => {
      isNSFW = true;
      localStorage.setItem('cringeNSFW', 'true');
      document.getElementById('nsfwBtn').textContent = '✅';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading mature cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    const disableNSFW = () => {
      isNSFW = false;
      localStorage.setItem('cringeNSFW', 'false');
      document.getElementById('nsfwBtn').textContent = '🔞';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    // EASTER EGGS
    let cringeTyped = '';
    document.addEventListener('keydown', (e) => {
      if (e.key.length === 1) {
        cringeTyped += e.key.toLowerCase();
        if (cringeTyped.endsWith('cringe')) {
          document.body.style.animation = 'glitch 0.5s infinite';
          setTimeout(() => document.body.style.animation = '', 2000);
          cringeTyped = '';
        }
        if (cringeTyped.length > 10) cringeTyped = cringeTyped.slice(-6);
      }
    });

    let rouletteHoldTimer = null;
    const rouletteBtn = document.getElementById('rouletteBtn');
    rouletteBtn.addEventListener('mousedown', () => {
      rouletteHoldTimer = setTimeout(() => {
        alert('✨ Ultra Roulette Unlocked! (Just kidding... or am I?)');
      }, 3000);
    });
    rouletteBtn.addEventListener('mouseup', () => {
      clearTimeout(rouletteHoldTimer);
    });
    rouletteBtn.addEventListener('mouseleave', () => {
      clearTimeout(rouletteHoldTimer);
    });

    // STREAK COUNTER
    const updateStreak = () => {
      const today = new Date().toDateString();
      const lastVisit = localStorage.getItem('cringeLastVisit');
      let streak = parseInt(localStorage.getItem('cringeStreak') || '0');
      
      if (lastVisit === today) {
        // already visited
      } else if (lastVisit === new Date(Date.now() - 86400000).toDateString()) {
        streak++;
      } else {
        streak = 1;
      }
      
      localStorage.setItem('cringeStreak', streak.toString());
      localStorage.setItem('cringeLastVisit', today);
      
      if (streak > 1) {
        document.getElementById('streakBadge').textContent = `🔥 ${streak}-Day Streak!`;
        document.getElementById('streakBadge').style.display = 'block';
      }
    };

    const initApp = () => {
      feed = document.getElementById('feed');
      
      // Check hash for direct meme link (future-proof)
      // (Not implemented fully, but won't break)
      
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
        document.getElementById('glowBtn').textContent = '🕶️';
      }

      document.getElementById('soundBtn').textContent = isSoundOn ? '🔊' : '🔇';

      let emoji = '🎭';
      if (currentMood === 'wholesome') emoji = '❤️';
      else if (currentMood === 'rage') emoji = '😡';
      else if (currentMood === 'surreal') emoji = '🌀';
      document.getElementById('moodBtn').textContent = emoji;

      document.getElementById('nsfwBtn').textContent = isNSFW ? '✅' : '🔞';

      attachButtonListeners();
      initScrollHiding();
      updateLeaderboard();
      updateStreak();

      if (!localStorage.getItem('installPromptSeen')) {
        setTimeout(() => {
          document.getElementById('installPrompt').style.display = 'block';
        }, 10000);
      }

      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 150);
      }

      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadNext();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
