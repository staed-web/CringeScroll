<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9372118866074955" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --neon-pink: #FF2A6D;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
      transition: transform 0.3s ease;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* CONTROL BAR - AUTO HIDE/SHOW */
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      transition: transform 0.3s ease;
      z-index: 99;
    }

    .control-btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    /* FIXED: BADGES DON'T OVERLAP TEXT */
    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .nsfw-badge {
      background: var(--neon-pink);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .reaction-badge {
      background: var(--neon-green);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
      /* Add padding-top to avoid badge overlap */
      padding-top: 36px; /* Matches badge container height */
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
    }

    /* NSFW CONFIRM MODAL */
    #nsfwModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      max-width: 90%;
      border: 2px solid var(--neon-pink);
    }

    .modal-content h2 {
      color: var(--neon-pink);
      margin-bottom: 20px;
    }

    .modal-btn {
      background: var(--neon-pink);
      color: white;
      border: none;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .footer-notice {
      text-align: center;
      margin: 30px 0;
      font-size: 12px;
      color: #8a8aa0;
    }

    .footer-notice a {
      color: #8a8aa0;
      text-decoration: none;
    }

    .footer-notice a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    
    <div class="control-bar" id="controlBar">
      <button class="control-btn" id="refreshBtn" title="Fresh Cringe">🔄</button>
      <button class="control-btn" id="glowBtn" title="Toggle Glow">✨</button>
      <button class="control-btn" id="nsfwBtn" title="NSFW Mode">🔞</button>
      <button class="control-btn" id="shareBtn" title="Share Cringe">📤</button>
    </div>
    
    <div id="feed">
      <div class="loading-spinner">Loading cringe...</div>
    </div>
  </div>

  <!-- NSFW CONFIRMATION MODAL -->
  <div id="nsfwModal">
    <div class="modal-content">
      <h2>🔞 NSFW Content Warning</h2>
      <p>This mode contains adult-oriented memes.<br>Are you 18+ and sure you want to proceed?</p>
      <button class="modal-btn" id="nsfwConfirm">Yes, Enter NSFW</button>
      <button class="modal-btn" id="nsfwCancel" style="background:#555;">Cancel</button>
    </div>
  </div>

  <div class="footer-notice">
    <a href="/privacy.html">Privacy Policy</a>
  </div>

  <script>
    // ===== CORE ENGINE - FIXED FOR LAYOUT COLLISIONS =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300;
    let isGlowMode = false;
    let isNSFW = false;
    let lastScrollTop = 0;

    // SOURCES
    const NSFW_SOURCES = [
      'https://meme-api.com/gimme/NSFW',
      'https://meme-api.com/gimme/NSFW_GIF',
      'https://meme-api.com/gimme/RealGirls',
      'https://meme-api.com/gimme/ComedyCemetery',
      'https://meme-api.com/gimme/NSFW_Memes'
    ];

    const SFW_SOURCES = [
      'https://meme-api.com/gimme/memes',
      'https://meme-api.com/gimme/dankmemes',
      'https://meme-api.com/gimme/me_irl',
      'https://meme-api.com/gimme/wholesomememes',
      'https://meme-api.com/gimme/funny'
    ];

    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    const fetchMeme = async () => {
      try {
        const sources = isNSFW ? NSFW_SOURCES : SFW_SOURCES;
        const shuffled = [...sources].sort(() => 0.5 - Math.random());
        
        for (let i = 0; i < shuffled.length; i++) {
          const url = `${shuffled[i]}?_=${Date.now()}`;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(url, {
              cache: 'no-store',
              mode: 'cors',
              signal: controller.signal
            });
            clearTimeout(timeout);
            
            if (!res.ok) continue;
            const data = await res.json();
            if (!data?.url || seenUrls.has(data.url)) continue;
            
            seenUrls.add(data.url);
            return { 
              url: data.url, 
              title: data.title || (isNSFW ? 'NSFW Cringe' : 'Cringe'),
              ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
              isNSFW: isNSFW
            };
          } catch (e) {
            continue;
          }
        }
        
        // Fallback
        const fallback = await fetch('https://meme-api.com/gimme?_=' + Date.now(), {
          cache: 'no-store',
          mode: 'cors'
        });
        const data = await fallback.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { 
          url: data.url, 
          title: data.title || 'Cringe',
          ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
          isNSFW: false
        };
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      
      // Create badge container
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      
      let badgeHtml = '';
      if (meme.isNSFW) {
        const nsfwBadge = document.createElement('div');
        nsfwBadge.className = 'nsfw-badge';
        nsfwBadge.textContent = 'NSFW';
        badgeContainer.appendChild(nsfwBadge);
      }
      
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(meme.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" onerror="this.parentElement.style.display='none'">
      `;
      
      // Insert badge container at top of card
      card.insertBefore(badgeContainer, card.firstChild);
      feed.appendChild(card);
    };

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };

    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("Ad load failed:", e);
      }
    };

    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      if (loadCount === 0) {
        feed.innerHTML = '';
      }

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;
        if (loadCount % 5 === 0) {
          setTimeout(renderAd, 100);
        }
      }
      isLoading = false;
    };

    // 🔥 GLOW BUTTON - FULLY FIXED
    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;
      document.body.style.boxShadow = isGlowMode ? 
        `0 0 30px var(--neon-purple), 0 0 60px var(--neon-green)` : 'none';
      document.getElementById('glowBtn').textContent = isGlowMode ? '🕶️' : '✨';
      localStorage.setItem('cringeGlow', isGlowMode);
    };

    // 🔥 AUTO HIDE/SHOW CONTROL BAR
    const initScrollHiding = () => {
      const controlBar = document.getElementById('controlBar');
      let ticking = false;

      const updateControlBar = () => {
        const currentScrollTop = feed.scrollTop;
        if (currentScrollTop > lastScrollTop && currentScrollTop > 100) {
          controlBar.style.transform = 'translateY(-100%)';
          document.querySelector('header').style.transform = 'translateY(-100%)';
        } else if (currentScrollTop < lastScrollTop) {
          controlBar.style.transform = 'translateY(0)';
          document.querySelector('header').style.transform = 'translateY(0)';
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        ticking = false;
      };

      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateControlBar);
          ticking = true;
        }
      });
    };

    // BUTTONS
    const attachButtonListeners = () => {
      document.getElementById('refreshBtn').onclick = () => loadNext();
      document.getElementById('glowBtn').onclick = toggleGlowMode;
      document.getElementById('shareBtn').onclick = () => {
        const url = window.location.href;
        if (navigator.share) {
          navigator.share({ title: 'CringeScroll', text: 'Endless cringe memes 👀', url });
        } else {
          navigator.clipboard.writeText(url).then(() => {
            const btn = document.getElementById('shareBtn');
            const original = btn.textContent;
            btn.textContent = '✓';
            setTimeout(() => btn.textContent = original, 1000);
          }).catch(() => alert('Link copied!'));
        }
      };
      document.getElementById('nsfwBtn').onclick = () => {
        if (isNSFW) {
          disableNSFW();
        } else {
          document.getElementById('nsfwModal').style.display = 'flex';
        }
      };
      document.getElementById('nsfwConfirm').onclick = enableNSFW;
      document.getElementById('nsfwCancel').onclick = () => {
        document.getElementById('nsfwModal').style.display = 'none';
      };
    };

    const enableNSFW = () => {
      isNSFW = true;
      document.getElementById('nsfwBtn').textContent = '✅';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading NSFW cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    const disableNSFW = () => {
      isNSFW = false;
      document.getElementById('nsfwBtn').textContent = '🔞';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    // INIT
    const initApp = () => {
      feed = document.getElementById('feed');
      
      // Restore glow state
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.boxShadow = '0 0 30px var(--neon-purple), 0 0 60px var(--neon-green)';
        document.getElementById('glowBtn').textContent = '🕶️';
      }

      attachButtonListeners();
      initScrollHiding();

      // Load initial memes
      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 150);
      }

      // Attach infinite scroll
      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadNext();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
