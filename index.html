<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <title>CringeScroll</title>
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: #121220;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f0f0ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    header {
      padding: 14px;
      background: rgba(10,10,20,0.95);
      text-align: center;
      border-bottom: 1px solid var(--neon-purple);
    }
    header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 10px 80px;
    }
    .meme-card {
      background: var(--card-bg);
      margin: 14px 8px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(212,0,255,0.1);
    }
    .meme-title {
      padding: 16px 18px 10px;
      font-size: 18px;
      color: var(--neon-green);
      font-weight: 700;
      word-break: break-word;
    }
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }
    #sentinel {
      height: 20px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <header><h1>CRINGESCROLL</h1></header>
    <div id="feed">
      <!-- Initial memes will load here -->
      <div id="sentinel"></div> <!-- MUST exist before JS runs -->
    </div>
  </div>

  <script>
    // ===== CORE STATE =====
    const feed = document.getElementById('feed');
    const sentinel = document.getElementById('sentinel');
    const seenUrls = new Set();
    let isLoading = false;

    // ===== LOAD SINGLE MEME =====
    async function loadMeme() {
      if (isLoading) return;
      isLoading = true;

      try {
        // Force fresh fetch
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now()}`, { 
          cache: 'no-store' 
        });
        const data = await res.json();

        // Skip duplicates
        if (seenUrls.has(data.url)) {
          isLoading = false;
          loadMeme(); // retry
          return;
        }
        seenUrls.add(data.url);

        // Create card
        const card = document.createElement('div');
        card.className = 'meme-card';
        card.innerHTML = `
          <div class="meme-title">${escapeHtml(data.title || 'Cringe')}</div>
          <img class="meme-image" src="${data.url}" loading="lazy" alt="meme">
        `;
        
        // Insert BEFORE sentinel
        feed.insertBefore(card, sentinel);
      } catch (e) {
        console.error("Load failed", e);
      } finally {
        isLoading = false;
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));
    }

    // ===== INFINITE SCROLL (FIXED) =====
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading) {
        loadMeme();
      }
    }, {
      root: feed,
      rootMargin: '200px' // trigger early
    });

    // Observe the sentinel (which exists in HTML)
    observer.observe(sentinel);

    // Load initial batch AFTER DOM ready
    setTimeout(() => {
      for (let i = 0; i < 6; i++) loadMeme();
    }, 100);
  </script>
</body>
</html>
