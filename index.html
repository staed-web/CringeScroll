<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <meta name="description" content="Endless cringe. Infinite laughs. Zero regrets." />
  <title>CringeScroll</title>
  <link rel="manifest" href="#inline-manifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23D400FF%22>💀</text></svg>">
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: #121220;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f0f0ff;
      --muted: #8a8aa0;
      --scrollbar: rgba(212, 0, 255, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    /* Fullscreen immersive feed */
    #app {
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header - minimal, sticky */
    header {
      padding: 12px 16px;
      background: rgba(10, 10, 20, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--neon-purple);
      z-index: 100;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }

    /* Main scrolling feed */
    #feed {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 80px;
    }

    /* Meme card - full-width, immersive */
    .meme-card {
      width: 100%;
      background: var(--card-bg);
      margin-bottom: 24px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(212, 0, 255, 0.15);
      animation: cardIn 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .meme-title {
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--neon-green);
      line-height: 1.4;
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      object-fit: contain;
    }

    /* Ad container */
    .ad-container {
      width: 100%;
      background: rgba(18, 18, 32, 0.7);
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      border: 1px dashed var(--neon-purple);
    }

    /* Loading spinner */
    .loader {
      text-align: center;
      padding: 24px;
      color: var(--neon-green);
      font-size: 16px;
    }

    /* Scrollbar styling */
    #feed::-webkit-scrollbar {
      width: 8px;
    }
    #feed::-webkit-scrollbar-track {
      background: transparent;
    }
    #feed::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 4px;
    }

    /* Install prompt */
    #installPrompt {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      text-align: center;
      display: none;
      z-index: 1000;
      border-top: 1px solid var(--neon-purple);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    /* Responsive */
    @media (min-width: 768px) {
      .meme-card {
        max-width: 700px;
        margin: 0 auto 24px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CRINGESCROLL</h1>
    </header>
    <div id="feed"></div>
    <div id="installPrompt">💡 Install CringeScroll for full-screen, ad-optimized scrolling!</div>
  </div>

  <script>
    // ===== PWA MANIFEST =====
    const manifest = {
      name: "CringeScroll",
      short_name: "CringeScroll",
      start_url: "/",
      display: "standalone",
      background_color: "#0a0a14",
      theme_color: "#0a0a14",
      description: "Endless cringe memes. Infinite scroll. Zero brain cells.",
      icons: [{
        src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23D400FF'>💀</text></svg>",
        sizes: "192x192",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);

    // ===== SERVICE WORKER (for offline + install) =====
    if ('serviceWorker' in navigator) {
      const swScript = `
        self.addEventListener('fetch', () => {});
        self.addEventListener('install', () => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
      `;
      const swBlob = new Blob([swScript], {type: 'application/javascript'});
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(console.warn);
    }

    // ===== CORE APP LOGIC =====
    const feed = document.getElementById('feed');
    const installPrompt = document.getElementById('installPrompt');
    let memeCount = 0;
    let isLoading = false;
    let deferredPrompt;

    // Detect installability
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installPrompt.style.display = 'block';
    });

    installPrompt.addEventListener('click', () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => deferredPrompt = null);
        installPrompt.style.display = 'none';
      }
    });

    // Sanitize HTML
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '<',
        '>': '>',
        '"': '&quot;',
        "'": '&#039;'
      }[m]));
    }

    // Load one meme
    async function loadMeme() {
      if (isLoading) return;
      isLoading = true;

      try {
        const res = await fetch('https://meme-api.com/gimme', { cache: 'no-cache' });
        if (!res.ok) throw new Error('API down');
        const data = await res.json();

        memeCount++;

        // Create card
        const card = document.createElement('div');
        card.className = 'meme-card';
        card.innerHTML = `
          <div class="meme-title">${escapeHtml(data.title || 'Untitled Cringe')}</div>
          <img class="meme-image" 
               src="${data.url}" 
               loading="lazy"
               decoding="async"
               alt="Cringe meme"
               onerror="this.parentElement.style.display='none'">
        `;
        feed.appendChild(card);

        // Every 5th meme → Ad
        if (memeCount % 5 === 0) {
          const ad = document.createElement('div');
          ad.className = 'ad-container';
          ad.innerHTML = `
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"><\/script>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="fluid"
                 data-ad-layout-key="-fb+5w+4e-db+86"
                 data-ad-client="ca-pub-3940256099942544"
                 data-ad-slot="6300978111"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
          `;
          feed.appendChild(ad);
        }

      } catch (err) {
        console.error('Meme load failed:', err);
        // Silent fail — don't break scroll
      } finally {
        isLoading = false;
      }
    }

    // Infinite scroll trigger
    let scrollTimer;
    feed.addEventListener('scroll', () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const { scrollTop, scrollHeight, clientHeight } = feed;
        if (scrollHeight - scrollTop <= clientHeight + 300) {
          loadMeme();
        }
      }, 100);
    });

    // Preload first 8 memes
    for (let i = 0; i < 8; i++) loadMeme();

    // Auto-focus feed for smooth scroll
    setTimeout(() => feed.focus(), 500);
  </script>
</body>
</html>
