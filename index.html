<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      opacity: 0;
      animation: fadeIn 0.3s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    #buffer-zone {
      height: 50px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    <div id="feed">
      <!-- Memes will populate here -->
      <div id="buffer-zone"></div>
    </div>
  </div>

  <script>
    // ===== CORE ENGINE =====
    const feed = document.getElementById('feed');
    const bufferZone = document.getElementById('buffer-zone');
    const seenUrls = new Set();
    let isLoadingBatch = false;
    let memeCount = 0;
    const BUFFER_THRESHOLD = 3; // Start loading when only 3 memes left in buffer

    // Escape HTML
    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    // Fetch one unique meme
    const fetchMeme = async (retry = 0) => {
      if (retry > 2) return null;
      try {
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now() + retry}`, {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data?.url || seenUrls.has(data.url)) return fetchMeme(retry + 1);
        seenUrls.add(data.url);
        return { url: data.url, title: data.title || 'Cringe' };
      } catch (e) {
        return fetchMeme(retry + 1);
      }
    };

    // Render meme
    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" 
             onerror="this.parentElement.style.display='none'">
      `;
      feed.insertBefore(card, bufferZone);
      memeCount++;
    };

    // Load a batch of memes (3 at a time)
    const loadBatch = async () => {
      if (isLoadingBatch) return;
      isLoadingBatch = true;

      const batch = [];
      for (let i = 0; i < 3; i++) {
        const meme = await fetchMeme();
        if (meme) batch.push(meme);
      }

      // Render all at once for smoothness
      batch.forEach(renderMeme);
      isLoadingBatch = false;
    };

    // ===== PROACTIVE LOADING ENGINE =====
    let lastScrollTop = 0;
    let direction = 'down';

    feed.addEventListener('scroll', () => {
      const scrollTop = feed.scrollTop;
      const scrollHeight = feed.scrollHeight;
      const clientHeight = feed.clientHeight;
      
      // Detect scroll direction
      direction = scrollTop > lastScrollTop ? 'down' : 'up';
      lastScrollTop = scrollTop;

      // Only preload when scrolling down
      if (direction !== 'down') return;

      // Calculate how many memes are below viewport
      const visibleBottom = scrollTop + clientHeight;
      const cards = feed.querySelectorAll('.meme-card');
      let cardsBelow = 0;

      for (let i = cards.length - 1; i >= 0; i--) {
        const cardTop = cards[i].offsetTop;
        if (cardTop > visibleBottom) cardsBelow++;
        else break;
      }

      // If fewer than BUFFER_THRESHOLD memes below, load more
      if (cardsBelow < BUFFER_THRESHOLD && !isLoadingBatch) {
        loadBatch();
      }
    });

    // Initial load
    const init = () => {
      // Load first 8 memes immediately
      const loadInitial = async () => {
        for (let i = 0; i < 8; i++) {
          const meme = await fetchMeme();
          if (meme) renderMeme(meme);
        }
        // Then load first batch proactively
        loadBatch();
      };
      loadInitial();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
