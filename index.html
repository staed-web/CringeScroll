<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <link rel="manifest" href="#inline-manifest" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9372118866074955" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --neon-pink: #FF2A6D;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
      transition: transform 0.3s ease;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      transition: transform 0.3s ease;
      z-index: 99;
    }

    .control-btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: max(100px, env(safe-area-inset-bottom));
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .nsfw-badge {
      background: var(--neon-pink);
      color: white;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    .reaction-badge {
      background: var(--neon-green);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
      padding-top: 36px;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* NEW: REACTIONS */
    .reactions {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 12px 0 20px;
      background: rgba(0,0,0,0.2);
    }

    .reaction-btn {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .reaction-btn:active {
      transform: scale(1.3);
    }

    .reaction-count {
      font-size: 12px;
      color: var(--neon-green);
      margin-top: 4px;
    }

    /* NEW: AD CONTAINER (NATIVE STYLE) */
    .ad-container {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .ad-container::before {
      content: "Sponsored by Cringe Lords";
      color: var(--neon-green);
      font-size: 12px;
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
    }

    /* INSTALL PROMPT */
    #installPrompt {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      z-index: 1000;
      border-top: 1px solid var(--neon-purple);
      display: none;
    }

    .prompt-btn {
      background: var(--neon-purple);
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 8px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* LEADERBOARD SIDEBAR */
    #leaderboard {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100dvh;
      background: rgba(13, 13, 26, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      z-index: 200;
      transition: right 0.3s ease;
      border-left: 1px solid var(--neon-purple);
    }

    #leaderboard.open {
      right: 0;
    }

    .leaderboard-title {
      text-align: center;
      font-size: 20px;
      margin-bottom: 20px;
      color: var(--neon-green);
    }

    .leaderboard-item {
      background: var(--card-bg);
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .leaderboard-rank {
      float: right;
      background: var(--neon-purple);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }

    .close-leaderboard {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--neon-green);
      font-size: 24px;
      cursor: pointer;
    }

    .footer-notice {
      text-align: center;
      margin: 30px 0;
      font-size: 12px;
      color: #8a8aa0;
    }

    .footer-notice a {
      color: #8a8aa0;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    
    <div class="control-bar" id="controlBar">
      <button class="control-btn" id="rouletteBtn" title="Cringe Roulette">🎯</button>
      <button class="control-btn" id="glowBtn" title="Toggle Glow">✨</button>
      <button class="control-btn" id="nsfwBtn" title="NSFW Mode">🔞</button>
      <button class="control-btn" id="leaderboardBtn" title="Top Cringe">🏆</button>
    </div>
    
    <div id="feed">
      <div class="loading-spinner">Loading cringe...</div>
    </div>
  </div>

  <!-- LEADERBOARD SIDEBAR -->
  <div id="leaderboard">
    <button class="close-leaderboard" id="closeLeaderboard">✕</button>
    <div class="leaderboard-title">🔥 Cringe of the Day</div>
    <div id="leaderboardList">
      <!-- Top memes will load here -->
    </div>
  </div>

  <!-- INSTALL PROMPT -->
  <div id="installPrompt">
    <p>💡 Install for fullscreen cringe & no black bars!</p>
    <button class="prompt-btn" id="installBtn">Install</button>
    <button class="prompt-btn" id="dismissBtn">No thanks</button>
  </div>

  <div class="footer-notice">
    <a href="/privacy.html">Privacy Policy</a>
  </div>

  <script>
    // ===== CORE ENGINE WITH ALL FEATURES =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300;
    let isGlowMode = false;
    let isNSFW = false;
    let lastScrollTop = 0;
    let reactionCounts = JSON.parse(localStorage.getItem('cringeReactions')) || {};
    let topMemes = JSON.parse(localStorage.getItem('cringeTopMemes')) || [];

    // SOURCES
    const NSFW_SOURCES = [
      'https://meme-api.com/gimme/NSFW',
      'https://meme-api.com/gimme/NSFW_GIF',
      'https://meme-api.com/gimme/RealGirls',
      'https://meme-api.com/gimme/ComedyCemetery',
      'https://meme-api.com/gimme/NSFW_Memes'
    ];

    const SFW_SOURCES = [
      'https://meme-api.com/gimme/memes',
      'https://meme-api.com/gimme/dankmemes',
      'https://meme-api.com/gimme/me_irl',
      'https://meme-api.com/gimme/wholesomememes',
      'https://meme-api.com/gimme/funny'
    ];

    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    const fetchMeme = async () => {
      try {
        const sources = isNSFW ? NSFW_SOURCES : SFW_SOURCES;
        const shuffled = [...sources].sort(() => 0.5 - Math.random());
        
        for (let i = 0; i < shuffled.length; i++) {
          const url = `${shuffled[i]}?_=${Date.now()}`;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(url, {
              cache: 'no-store',
              mode: 'cors',
              signal: controller.signal
            });
            clearTimeout(timeout);
            
            if (!res.ok) continue;
            const data = await res.json();
            if (!data?.url || seenUrls.has(data.url)) continue;
            
            seenUrls.add(data.url);
            return { 
              url: data.url, 
              title: data.title || (isNSFW ? 'NSFW Cringe' : 'Cringe'),
              ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
              isNSFW: isNSFW,
              id: data.url.split('/').pop()
            };
          } catch (e) {
            continue;
          }
        }
        
        const fallback = await fetch('https://meme-api.com/gimme?_=' + Date.now(), {
          cache: 'no-store',
          mode: 'cors'
        });
        const data = await fallback.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { 
          url: data.url, 
          title: data.title || 'Cringe',
          ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
          isNSFW: false,
          id: data.url.split('/').pop()
        };
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    const updateLeaderboard = () => {
      const leaderboardList = document.getElementById('leaderboardList');
      leaderboardList.innerHTML = '';
      
      // Sort top memes by total reactions
      const sorted = [...topMemes].sort((a, b) => {
        const aTotal = (reactionCounts[a.id]?.total || 0);
        const bTotal = (reactionCounts[b.id]?.total || 0);
        return bTotal - aTotal;
      }).slice(0, 3);
      
      sorted.forEach((meme, index) => {
        const item = document.createElement('div');
        item.className = 'leaderboard-item';
        item.innerHTML = `
          <div class="leaderboard-rank">#${index + 1}</div>
          <div>${escapeHtml(meme.title)}</div>
          <div style="font-size:12px;color:var(--neon-green);margin-top:6px;">
            Reactions: ${reactionCounts[meme.id]?.total || 0}
          </div>
        `;
        leaderboardList.appendChild(item);
      });
    };

    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.dataset.id = meme.id;
      
      // Badge container
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      
      if (meme.isNSFW) {
        const nsfwBadge = document.createElement('div');
        nsfwBadge.className = 'nsfw-badge';
        nsfwBadge.textContent = 'NSFW';
        badgeContainer.appendChild(nsfwBadge);
      }
      
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(meme.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      
      // Reactions
      const reactionsDiv = document.createElement('div');
      reactionsDiv.className = 'reactions';
      const emojis = ['💀', '😂', '🤡', '🥴'];
      emojis.forEach(emoji => {
        const btn = document.createElement('div');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = () => {
          const counts = reactionCounts[meme.id] || { total: 0 };
          counts[emoji] = (counts[emoji] || 0) + 1;
          counts.total = (counts.total || 0) + 1;
          reactionCounts[meme.id] = counts;
          localStorage.setItem('cringeReactions', JSON.stringify(reactionCounts));
          
          // Update UI
          const countEl = btn.nextElementSibling;
          if (countEl) {
            countEl.textContent = counts[emoji];
          } else {
            const countDisplay = document.createElement('div');
            countDisplay.className = 'reaction-count';
            countDisplay.textContent = counts[emoji];
            btn.parentNode.appendChild(countDisplay);
          }
          
          // Add to top memes
          if (!topMemes.find(m => m.id === meme.id)) {
            topMemes.push(meme);
            localStorage.setItem('cringeTopMemes', JSON.stringify(topMemes));
          }
          updateLeaderboard();
        };
        reactionsDiv.appendChild(btn);
      });
      
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" onerror="this.parentElement.style.display='none'">
      `;
      
      card.insertBefore(badgeContainer, card.firstChild);
      card.appendChild(reactionsDiv);
      feed.appendChild(card);
    };

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };

    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', 'YOUR_REAL_AD_SLOT_ID'); // ⚠️ REPLACE THIS

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("Ad load failed:", e);
      }
    };

    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      if (loadCount === 0) {
        feed.innerHTML = '';
      }

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;
        if (loadCount % 7 === 0) { // Reduced ad frequency
          setTimeout(renderAd, 100);
        }
      }
      isLoading = false;
    };

    // 🔥 CRINGE ROULETTE
    const cringeRoulette = async () => {
      const rouletteBtn = document.getElementById('rouletteBtn');
      rouletteBtn.textContent = '🎰';
      rouletteBtn.disabled = true;
      
      let tempMemes = [];
      for (let i = 0; i < 3; i++) {
        const meme = await fetchMeme();
        if (meme) tempMemes.push(meme);
      }
      
      // Rapidly show memes
      let i = 0;
      const interval = setInterval(() => {
        if (i < 5) {
          feed.innerHTML = '';
          renderMeme(tempMemes[i % tempMemes.length]);
          i++;
        } else {
          clearInterval(interval);
          rouletteBtn.textContent = '🎯';
          rouletteBtn.disabled = false;
          // Keep last meme
          loadCount++;
          if (loadCount % 7 === 0) setTimeout(renderAd, 100);
        }
      }, 200);
    };

    // 🔥 GLOW MODE
    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;
      if (isGlowMode) {
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
      } else {
        document.body.style.background = 'var(--bg)';
        document.body.style.animation = 'none';
      }
      document.getElementById('glowBtn').textContent = isGlowMode ? '🕶️' : '✨';
      localStorage.setItem('cringeGlow', isGlowMode);
    };

    // 🔥 AUTO HIDE/SHOW CONTROL BAR
    const initScrollHiding = () => {
      const controlBar = document.getElementById('controlBar');
      let ticking = false;

      const updateControlBar = () => {
        const currentScrollTop = feed.scrollTop;
        if (currentScrollTop > lastScrollTop && currentScrollTop > 100) {
          controlBar.style.transform = 'translateY(-100%)';
          document.querySelector('header').style.transform = 'translateY(-100%)';
        } else if (currentScrollTop < lastScrollTop) {
          controlBar.style.transform = 'translateY(0)';
          document.querySelector('header').style.transform = 'translateY(0)';
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        ticking = false;
      };

      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateControlBar);
          ticking = true;
        }
      });
    };

    // BUTTONS
    const attachButtonListeners = () => {
      document.getElementById('rouletteBtn').onclick = cringeRoulette;
      document.getElementById('glowBtn').onclick = toggleGlowMode;
      document.getElementById('nsfwBtn').onclick = () => {
        if (isNSFW) {
          disableNSFW();
        } else {
          document.getElementById('nsfwModal').style.display = 'flex';
        }
      };
      document.getElementById('leaderboardBtn').onclick = () => {
        document.getElementById('leaderboard').classList.add('open');
      };
      document.getElementById('closeLeaderboard').onclick = () => {
        document.getElementById('leaderboard').classList.remove('open');
      };
      
      // Install prompt
      document.getElementById('installBtn').onclick = () => {
        alert("Tap 'Share' → 'Add to Home Screen' for fullscreen mode!");
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
      document.getElementById('dismissBtn').onclick = () => {
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
    };

    const enableNSFW = () => {
      isNSFW = true;
      document.getElementById('nsfwBtn').textContent = '✅';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading NSFW cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    const disableNSFW = () => {
      isNSFW = false;
      document.getElementById('nsfwBtn').textContent = '🔞';
      document.getElementById('nsfwModal').style.display = 'none';
      seenUrls.clear();
      loadCount = 0;
      feed.innerHTML = '<div class="loading-spinner">Loading cringe...</div>';
      for (let i = 0; i < 6; i++) setTimeout(loadNext, i * 150);
    };

    // INIT
    const initApp = () => {
      feed = document.getElementById('feed');
      
      // Restore glow state
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
        document.getElementById('glowBtn').textContent = '🕶️';
      }

      attachButtonListeners();
      initScrollHiding();
      updateLeaderboard();

      // Show install prompt
      if (!localStorage.getItem('installPromptSeen')) {
        setTimeout(() => {
          document.getElementById('installPrompt').style.display = 'block';
        }, 10000);
      }

      // Load initial memes
      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 150);
      }

      // Attach infinite scroll
      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadNext();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };

    // PWA INSTALL PROMPT
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
