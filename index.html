  <style>
    :root {
      --bg-primary: #0f0f1b;
      --bg-secondary: #1a1a2e;
      --bg-card: #161625;
      --text-primary: #ffffff;
      --text-secondary: #b8b8d1;
      --accent-purple: #9d4edd;
      --accent-pink: #ff65a3;
      --accent-blue: #5e60ce;
      --accent-teal: #48bfe3;
      --border-radius: 16px;
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.35);
      --transition-fast: transform 0.2s, opacity 0.2s;
      --transition-normal: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      transition: background-color var(--transition-normal);
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: hidden;
    }
    
    /* Header with logo on left */
    header {
      padding: 16px 20px;
      background: rgba(15, 15, 27, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(157, 78, 221, 0.2);
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
      will-change: transform, opacity;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
    }
    
    .logo-container:hover {
      transform: scale(1.05);
    }
    
    .cringe-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
    }
    
    .cringe-logo:hover {
      transform: rotateY(15deg) rotateX(5deg);
    }
    
    .cringe-logo::before {
      content: "💀";
      font-size: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }
    
    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      text-shadow: 0 2px 10px rgba(157, 78, 221, 0.3);
    }
    
    .hamburger-menu {
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .hamburger-menu:hover {
      background: rgba(157, 78, 221, 0.2);
      transform: scale(1.1);
    }
    
    .hamburger-menu svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-purple);
      transition: stroke 0.3s;
    }
    
    .hamburger-menu:hover svg {
      stroke: white;
    }
    
    .tab-container {
      display: flex;
      gap: 8px;
      padding: 0 16px;
      margin: 16px 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .tab-container::-webkit-scrollbar {
      display: none;
    }
    
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-secondary);
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s;
      position: relative;
      flex-shrink: 0;
    }
    
    .tab-btn.active {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      color: white;
      box-shadow: 0 4px 20px rgba(157, 78, 221, 0.4);
    }
    
    .tab-btn:hover:not(.active) {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    
    .tab-btn::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%) scaleX(0);
      width: 80%;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: transform 0.3s ease;
    }
    
    .tab-btn.active::after {
      transform: translateX(-50%) scaleX(1);
    }
    
    .control-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      background: rgba(15, 15, 27, 0.8);
      border-top: 1px solid rgba(157, 78, 221, 0.15);
      position: sticky;
      bottom: 0;
      z-index: 99;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .control-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      position: relative;
      overflow: hidden;
    }
    
    .control-btn:hover {
      background: rgba(157, 78, 221, 0.2);
      color: white;
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 15px rgba(157, 78, 221, 0.3);
    }
    
    .control-btn:active {
      transform: translateY(1px) scale(0.98);
    }
    
    .control-btn.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      color: white;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
    }
    
    .control-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s ease;
      z-index: 0;
    }
    
    .control-btn:hover::before {
      transform: scale(1);
    }
    
    .control-label {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 500;
    }
    
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 12px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: 80px;
      padding-top: 8px;
      transition: padding-top 0.4s cubic-bezier(0.33, 1, 0.68, 1);
      will-change: padding-top;
    }
    
    .meme-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      overflow: hidden;
      margin: 16px 0;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(157, 78, 221, 0.1);
      transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.3s ease;
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
    }
    
    .meme-card:hover {
      transform: translateY(-5px) translateZ(0);
      box-shadow: var(--shadow-lg);
      z-index: 10;
    }
    
    .meme-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(157, 78, 221, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 1;
    }
    
    .meme-card:hover::before {
      opacity: 1;
    }
    
    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 20;
      transform: translateZ(10px);
    }
    
    .reaction-badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: white;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .meme-title {
      padding: 16px 20px 12px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      color: white;
      word-break: break-word;
    }
    
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 70vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s ease;
    }
    
    .meme-image.loaded {
      opacity: 1;
    }
    
    .reactions {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      padding: 16px 0 12px;
      background: rgba(0,0,0,0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .reaction-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    
    .reaction-btn {
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
    }
    
    .reaction-btn:hover {
      transform: scale(1.2);
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
    }
    
    .reaction-btn:active {
      transform: scale(0.9);
    }
    
    .reaction-count {
      font-size: 14px;
      color: var(--accent-teal);
      font-weight: 600;
      min-width: 24px;
      text-align: center;
      background: rgba(94, 96, 206, 0.15);
      padding: 2px 6px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    
    .reaction-count.animated {
      animation: pulseReaction 0.4s ease;
    }
    
    @keyframes pulseReaction {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 12px 0 20px;
    }
    
    .action-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      max-width: 120px;
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }
    
    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    
    .action-btn:active {
      transform: translateY(1px);
    }
    
    .tip-btn {
      background: linear-gradient(90deg, #ff65a3, #ff8fab);
    }
    
    .claim-btn {
      background: linear-gradient(90deg, #7f3fff, #9d4edd);
    }
    
    .save-btn {
      background: linear-gradient(90deg, #48bfe3, #5e60ce);
    }
    
    .remix-btn {
      background: linear-gradient(90deg, #560bad, #a500ff);
    }
    
    .user-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent-purple);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      z-index: 20;
      transform: translateZ(10px);
    }
    
    .claimed-by {
      font-size: 13px;
      color: var(--accent-teal);
      margin-top: 6px;
      display: block;
      text-align: center;
      font-weight: 500;
    }
    
    .ad-container {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      margin: 16px 0;
      padding: 16px;
      text-align: center;
      border: 1px solid rgba(157, 78, 221, 0.1);
      box-shadow: var(--shadow-md);
    }
    
    .ad-container::before {
      content: "Sponsored";
      color: var(--accent-pink);
      font-size: 12px;
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(255, 101, 163, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
      color: var(--accent-purple);
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(157, 78, 221, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-purple);
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-weight: 500;
      color: var(--text-secondary);
    }
    
    .skeleton-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      margin: 16px 0;
      height: 300px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-md);
    }
    
    .skeleton-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      100% { left: 100%; }
    }
    
    .error-container {
      text-align: center;
      padding: 40px 20px;
      color: #ff6b6b;
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: #ff65a3;
    }
    
    .error-message {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    
    .error-retry {
      background: linear-gradient(90deg, #ff65a3, #ff8fab);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 16px;
    }
    
    .error-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 101, 163, 0.4);
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    .empty-icon {
      font-size: 64px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    
    .empty-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: white;
    }
    
    .empty-message {
      font-size: 16px;
      margin-bottom: 24px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }
    
    .empty-action {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink));

        if (meme.claimedBy) {
          const claimedEl = document.createElement('span');
          claimedEl.className = 'claimed-by';
          claimedEl.textContent = `Spotted by @${meme.claimedBy}`;
          card.appendChild(claimedEl);
        }
        if (meme.isCrowned) {
          const crown = document.createElement('div');
          crown.className = 'crown-badge';
          crown.textContent = '👑';
          card.appendChild(crown);
        }
        const optimalWidth = Math.min(screen.width * window.devicePixelRatio, 1200);
        let imageUrl = meme.url;
        card.innerHTML = `
          <div class="meme-title">${escapeHtml(meme.title)}</div>
          <img 
            class="meme-image" 
            src="${createPlaceholder(300, 300)}" 
            data-src="${imageUrl}"
            loading="${index === 0 ? 'eager' : 'lazy'}"
            fetchpriority="${index === 0 ? 'high' : 'auto'}"
            alt="meme"
          >
        `;
        card.insertBefore(badgeContainer, card.firstChild);
        card.appendChild(reactionsDiv);
        card.appendChild(actionDiv);
        if (meme.claimedBy) {
          const claimedEl = document.createElement('span');
          claimedEl.className = 'claimed-by';
          claimedEl.textContent = `Spotted by @${meme.claimedBy}`;
          card.querySelector('.meme-title').after(claimedEl);
        }
        feed.appendChild(card);
        const img = card.querySelector('img');
        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
              img.src = img.dataset.src;
              img.onload = () => img.classList.add('loaded');
              observer.disconnect();
            }
          });
          observer.observe(img);
        } else {
          img.src = img.dataset.src;
          img.onload = () => img.classList.add('loaded');
        }
        return true;
      } catch (error) {
        console.error("Meme rendering failed:", error);
        return false;
      }
    };
    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');
      adContainer.appendChild(ins);
      feed.appendChild(adContainer);
      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("AdSense failed to load:", e.message);
      }
    };
    const loadFeed = async (clear = false) => {
      if (isLoading) return;
      isLoading = true;
      if (clear) {
        feed.innerHTML = '';
        loadCount = 0;
        seenUrls.clear();
      }
      if (loadCount === 0) {
        feed.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const skeleton = document.createElement('div');
          skeleton.className = 'skeleton-card';
          feed.appendChild(skeleton);
        }
      }
      let meme = null;
      // Load user memes on first load of "My Memes" tab
      if (loadCount === 0 && currentTab === 'mymemes') {
        const userMemes = await fetchUserMemes(5);
        for (const meme of userMemes) {
          if (!seenUrls.has(meme.url)) {
            seenUrls.add(meme.url);
            renderMeme(meme, loadCount);
            loadCount++;
          }
        }
        if (userMemes.length === 0) {
          feed.innerHTML = `
            <div style="text-align: center; padding: 40px; color: var(--neon-cyan);">
              <div style="font-size: 24px; margin-bottom: 10px;">🎨</div>
              <div>No memes yet. Create your first one!</div>
              <button class="primary-btn" id="createFirstMemeBtn" style="margin-top: 20px;">Create Meme</button>
            </div>
          `;
          document.getElementById('createFirstMemeBtn').onclick = () => {
            if (!currentUser) {
              showAuthModal();
              return;
            }
            document.getElementById('memeEditor').style.display = 'flex';
            initFabricEditor();
          };
          isLoading = false;
          return;
        }
      } else {
        // Load appropriate memes based on tab
        if (currentTab === 'mymemes') {
          meme = await fetchNextUserMeme();
        } else if (currentTab === 'hotnow') {
          meme = await fetchHotMeme();
        } else {
          meme = await fetchMeme();
        }
      }
      if (meme) {
        if (!seenUrls.has(meme.url)) {
          seenUrls.add(meme.url);
          renderMeme(meme, loadCount);
          loadCount++;
          // Insert ads at appropriate intervals
          if (loadCount > 0) {
            const nextAdAt = [5, 6, 7][Math.floor(Math.random() * 3)];
            if (loadCount % nextAdAt === 0) {
              setTimeout(renderAd, 100);
            }
          }
        }
      }
      // Remove skeleton loaders after first content loads
      if (loadCount > 0) {
        document.querySelectorAll('.skeleton-card').forEach(el => el.remove());
      }
      isLoading = false;
    };
    const fetchUserMemes = async (limit = 5) => {
      if (!db || !currentUser) return [];
      try {
        const q = db.collection('memes')
          .where('userId', '==', currentUser.uid)
          .where('isUserGenerated', '==', true)
          .orderBy('createdAt', 'desc')
          .limit(limit);
        const snapshot = await q.get();
        return snapshot.docs.map(doc => {
          const data = doc.data();
          return {
            ...data,
            id: doc.id,
            ups: data.ups || 0,
            isUserGenerated: true,
            userId: currentUser.uid
          };
        });
      } catch (e) {
        console.warn("User memes fetch failed:", e);
        return [];
      }
    };
    const fetchNextUserMeme = async () => {
      if (!db || !currentUser) return null;
      try {
        // Get the next meme after the last loaded one
        let query = db.collection('memes')
          .where('userId', '==', currentUser.uid)
          .where('isUserGenerated', '==', true)
          .orderBy('createdAt', 'desc')
          .limit(1);
        // If we have loaded some already, start after the last one
        if (loadCount > 0) {
          const lastMemeId = Array.from(seenUrls)[loadCount - 1];
          const lastMemeDoc = await db.collection('memes').doc(lastMemeId).get();
          if (lastMemeDoc.exists) {
            query = query.startAfter(lastMemeDoc);
          }
        }
        const snapshot = await query.get();
        if (!snapshot.empty) {
          const doc = snapshot.docs[0];
          const data = doc.data();
          return {
            ...data,
            id: doc.id,
            ups: data.ups || 0,
            isUserGenerated: true,
            userId: currentUser.uid
          };
        }
        return null;
      } catch (e) {
        console.warn("Next user meme fetch failed:", e);
        return null;
      }
    };
    const fetchMeme = async () => {
      try {
        const shuffled = [...MEME_SOURCES].sort(() => 0.5 - Math.random());
        for (let i = 0; i < shuffled.length; i++) {
          const url = `${shuffled[i]}?_=${Date.now()}`;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 10000);
            const res = await fetch(url, { cache: 'no-store', mode: 'cors', signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) continue;
            const data = await res.json();
            if (!data?.url || seenUrls.has(data.url)) continue;
            return { 
              url: data.url, 
              title: data.title || 'Cringe',
              ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
              id: data.url.split('/').pop() || Date.now().toString(),
              isUserGenerated: false,
              claimedBy: null,
              createdAt: Date.now()
            };
          } catch (e) {
            continue;
          }
        }
        return null;
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };
    const createMeme = async (top, bottom, imageUrl, isAnonymous = false) => {
      if (!currentUser) {
        showAuthModal();
        return;
      }
      try {
        const memeId = 'user_' + Date.now();
        const username = isAnonymous ? `anon_${Math.random().toString(36).substr(2,6)}` : currentUser.username;
        const memeData = {
          id: memeId,
          url: imageUrl,
          title: `${top || ''} ${bottom || ''}`.trim() || 'User Cringe',
          ups: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          isUserGenerated: true,
          createdBy: username,
          isAnonymous: isAnonymous,
          collections: [],
          userId: currentUser.uid
        };
        await db.collection('memes').doc(memeId).set(memeData);
        if (!isAnonymous) {
          const coinUpdated = await updateCringeCoin(10);
          await updateStreak();
          if (coinUpdated) {
            const questKey = `quest_post_${new Date().toDateString()}`;
            if (!localStorage.getItem(questKey)) {
              localStorage.setItem(questKey, 'completed');
              await updateCringeCoin(10);
              showNotification("Daily post quest completed! +10 CringeCoin");
            }
            showNotification("Meme posted successfully! +10 CringeCoin");
          }
        }
        // Refresh feed if on "My Memes" tab
        if (currentTab === 'mymemes') {
          loadFeed(true);
        }
        return true;
      } catch (e) {
        console.error("Meme creation failed:", e);
        showNotification("Failed to create meme. Check image URL.", true);
        return false;
      }
    };
    const switchTab = (tab) => {
      if (currentTab === tab) return;
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };
    const cringeRoulette = async () => {
      const rouletteBtn = document.getElementById('rouletteBtn');
      rouletteBtn.textContent = '🎯';
      rouletteBtn.disabled = true;
      try {
        let tempMemes = [];
        for (let i = 0; i < 3; i++) {
          const meme = await fetchMeme();
          if (meme) tempMemes.push(meme);
        }
        if (tempMemes.length === 0) {
          showNotification("No memes found for roulette", true);
          rouletteBtn.textContent = '🎯';
          rouletteBtn.disabled = false;
          return;
        }
        let i = 0;
        const interval = setInterval(() => {
          if (i < 5) {
            feed.innerHTML = '';
            if (tempMemes.length > 0) {
              renderMeme(tempMemes[i % tempMemes.length], 0);
            }
            i++;
          } else {
            clearInterval(interval);
            rouletteBtn.textContent = '🎯';
            rouletteBtn.disabled = false;
            loadCount++;
            if (loadCount % 7 === 0) setTimeout(renderAd, 100);
          }
        }, 200);
      } catch (error) {
        console.error("Roulette failed:", error);
        showNotification("Roulette failed", true);
        rouletteBtn.textContent = '🎯';
        rouletteBtn.disabled = false;
      }
    };
    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;
      if (isGlowMode) {
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
      } else {
        document.body.style.background = 'var(--bg)';
        document.body.style.animation = 'none';
      }
      document.getElementById('glowBtn').textContent = isGlowMode ? '🕶️' : '✨';
      localStorage.setItem('cringeGlow', isGlowMode);
    };
    const attachButtonListeners = () => {
      // Tab switching
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });
      // Control buttons
      // Logo click
      document.getElementById('logoLink').onclick = () => {
        switchTab('hot');
      };
      // Hamburger menu
      document.getElementById('hamburgerBtn').onclick = showSidePanel;
    };
    function showSidePanel() {
      const sidePanel = document.createElement('div');
      sidePanel.id = 'sidePanel';
      sidePanel.className = 'side-panel';
      sidePanel.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">Menu</div>
          <button class="close-panel" id="closePanel">✕</button>
        </div>
        <div class="panel-content">
          <div class="user-info">
            <div class="user-avatar">${currentUser ? currentUser.email.charAt(0).toUpperCase() : 'G'}</div>
            <div class="user-name">${currentUser ? 'User' : 'Guest'}</div>
            <div class="user-stats">
              <div class="stat-item">
                <div class="stat-value">${cringeCoin}</div>
                <div class="stat-label">Coins</div>
              </div>
              <div class="stat-item">
                <div class="stat-value">${streak}</div>
                <div class="stat-label">Streak</div>
              </div>
            </div>
          </div>
          
          <div class="menu-section">
            <div class="section-title">Navigation</div>

              <div class="menu-icon">🏠</div>
              <span>Feed</span>
            </div>
            <div class="menu-item" data-action="explore">

            </div>
            <div class="menu-item" data-action="create">

              <span>Create Meme</span>
            </div>
            <div class="menu-item" data-action="collections">

              <span>My Collections</span>
            </div>
            <div class="menu-item" data-action="leaderboard">

              <span>Leaderboard</span>
            </div>
          </div>
          
          <div class="divider"></div>
          
          <div class="menu-section">
            <div class="section-title">Account</div>
            ${currentUser ? `
              <div class="menu-item" data-action="profile">

                <span>My Profile</span>
              </div>
              <div class="menu-item" data-action="logout">

            ` : `
              <div class="menu-item" data-action="login">
                <div class="menu-icon">🔐</div>
                <span>Log In / Sign Up</span>
              </div>
            `}
            <div class="menu-item" data-action="settings">
              <div class="menu-icon">⚙️</div>
              <span>Settings</span>
            </div>
            <div class="menu-item" data-action="customize">
              <div class="menu-icon">🎨</div>
              <span>Customize UI</span>
            </div>
          </div>
          
          <div class="divider"></div>
          
          <div class="menu-section">
            <div class="section-title">More</div>
            <div class="menu-item" data-action="about">
              <div class="menu-icon">ℹ️</div>
              <span>About</span>
            </div>
            <div class="menu-item" data-action="help">
              <div class="menu-icon">❓</div>
              <span>Help & Feedback</span>
            </div>
          </div>
        </div>
      `;
      
      document.body.appendChild(sidePanel);
      
      // Add close functionality
      document.getElementById('closePanel').addEventListener('click', () => {
        sidePanel.remove();
      });
      
      // Add menu item functionality
      document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const action = item.dataset.action;
          handleMenuAction(action);
          sidePanel.remove();
        });
      });
    }
    
    function handleMenuAction(action) {
      switch(action) {
        case 'feed':
          switchTab('hot');
          break;
        case 'create':
          if (currentUser) {
            document.getElementById('memeEditor').style.display = 'flex';
            initFabricEditor();
          } else {
            showAuthModal();
          }
          break;
        case 'collections':
          showCollections();
          break;
        case 'leaderboard':
          showLeaderboard();
          break;
        case 'profile':
          showProfile();
          break;
        case 'login':
          showAuthModal();
          break;
        case 'logout':
          auth.signOut().then(() => {
            showNotification('Logged out successfully');
          }).catch(error => {
            console.error('Logout error:', error);
            showNotification('Logout failed. Please try again.', true);
          });
          break;
        case 'settings':
          showSettings();
          break;
        case 'customize':
          showCustomizeUI();
          break;
        case 'about':
          showAbout();
          break;
        case 'help':
          showHelp();
          break;
        default:
          console.log('Action not implemented:', action);
      }
    }
    
    function showAuthModal() {
      const modal = document.createElement('div');
      modal.id = 'authModal';
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <div class="modal-title">Log In / Sign Up</div>
            <button class="close-modal" id="closeAuth">✕</button>
          </div>
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Log In</button>
            <button class="auth-tab" data-tab="signup">Sign Up</button>
          </div>
          <div class="auth-content" id="loginContent">
            <div class="form-group">
              <label class="form-label" for="loginEmail">Email</label>
              <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            </div>
            <button class="modal-btn" id="loginBtn">Log In</button>
          </div>
          <div class="auth-content" id="signupContent" style="display: none;">
            <div class="form-group">
              <label class="form-label" for="signupEmail">Email</label>
              <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="signupUsername">Username</label>
              <input type="text" id="signupUsername" class="form-input" placeholder="your_username" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="signupPassword">Password</label>
              <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required minlength="6">
            </div>
            <button class="modal-btn" id="signupBtn">Sign Up</button>
          </div>
          <div class="modal-footer">
            <div>By continuing, you agree to our <a href="#" class="terms-link">Terms of Service</a></div>
          </div>
        </div>
      `;
      
      document.body.appendChild(modal);
      
      // Tab switching
      document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          
          document.getElementById('loginContent').style.display = tab.dataset.tab === 'login' ? 'block' : 'none';
          document.getElementById('signupContent').style.display = tab.dataset.tab === 'signup' ? 'block' : 'none';
        });
      });
      
      // Close modal
      document.getElementById('closeAuth').addEventListener('click', () => {
        modal.remove();
      });
      
      // Login functionality
      document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        
        if (!email || !password) {
          showNotification('Please fill in all fields', true);
          return;
        }
        
        auth.signInWithEmailAndPassword(email, password)
          .then(userCredential => {
            modal.remove();
            showNotification('Logged in successfully!');
          })
          .catch(error => {
            console.error('Login error:', error);
            showNotification('Login failed: ' + error.message, true);
          });
      });
      
      // Signup functionality
      document.getElementById('signupBtn').addEventListener('click', () => {
        const email = document.getElementById('signupEmail').value;
        const username = document.getElementById('signupUsername').value;
        const password = document.getElementById('signupPassword').value;
        
        if (!email || !username || !password) {
          showNotification('Please fill in all fields', true);
          return;
        }
        
        if (password.length < 6) {
          showNotification('Password must be at least 6 characters', true);
          return;
        }
        
        auth.createUserWithEmailAndPassword(email, password)
          .then(userCredential => {
            // Create user document
            return db.collection('users').doc(userCredential.user.uid).set({
              email: email,
              username: username,
              cringeCoin: 0,
              streak: 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
              collections: {}
            });
          })
          .then(() => {
            modal.remove();
            showNotification('Account created successfully!');
          })
          .catch(error => {
            console.error('Signup error:', error);
            showNotification('Signup failed: ' + error.message, true);
          });
      });
      
      // Show modal
      setTimeout(() => {
        modal.classList.add('show');
      }, 100);
    }
    
    const initScrollHiding = () => {
      const header = document.querySelector('header');
      const uiBar = document.getElementById('uiBar');
      let ticking = false;
      let isHidden = false;
      let lastDirection = 0;
      const updateBars = () => {
        const currentScrollTop = feed.scrollTop;
        const scrollDelta = currentScrollTop - lastScrollTop;
        const direction = scrollDelta > 0 ? 1 : -1;
        if (Math.abs(scrollDelta) > 10) {
          const shouldHide = direction === 1 && currentScrollTop > 100;
          if (shouldHide && !isHidden) {
            header.classList.add('hidden');
            uiBar.classList.add('hidden');
            feed.classList.add('fullscreen');
            isHidden = true;
          } else if (direction === -1 && isHidden) {
            header.classList.remove('hidden');
            uiBar.classList.remove('hidden');
            feed.classList.remove('fullscreen');
            isHidden = false;
          }
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        lastDirection = direction;
        ticking = false;
      };
      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateBars);
          ticking = true;
        }
      });
    };
    const initApp = async () => {
      feed = document.getElementById('feed');
      // Restore saved glow mode
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
        document.getElementById('glowBtn').textContent = '🕶️';
      }
      attachButtonListeners();
      initScrollHiding();
      // Load initial feed
      await loadFeed();
      // Set up infinite scroll
      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadFeed();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
      // Check daily crown
      await checkDailyCrown();
    };
