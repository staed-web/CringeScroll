  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --neon-pink: #FF2A6D;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
      transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
      will-change: transform, opacity;
    }
    header.hidden {
      transform: translateY(-100%);
      opacity: 0;
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .logo-container:hover {
      transform: scale(1.03);
    }
    .cringe-logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-green));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(212, 0, 255, 0.5);
      position: relative;
      overflow: hidden;
    }
    .cringe-logo::before {
      content: "💀";
      font-size: 24px;
      animation: pulseLogo 2s infinite alternate;
    }
    @keyframes pulseLogo {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
    }
    .logo-title::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--neon-green);
      transition: width 0.3s ease;
    }
    .logo-container:hover .logo-title::after {
      width: 100%;
    }
    .ui-bar {
      display: flex;
      flex-direction: column;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      z-index: 99;
      transition: height 0.4s cubic-bezier(0.33, 1, 0.68, 1), opacity 0.4s ease;
      overflow: hidden;
      height: auto;
      will-change: height, opacity;
    }
    .ui-bar.hidden {
      height: 0 !important;
      opacity: 0;
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(212, 0, 255, 0.1);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }
    .tab-btn.active {
      color: var(--neon-green);
    }
    .tab-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--neon-green);
    }
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid rgba(212, 0, 255, 0.1);
    }
    .control-btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: max(100px, env(safe-area-inset-bottom));
      transition: padding-top 0.4s cubic-bezier(0.33, 1, 0.68, 1);
      will-change: padding-top;
    }
    #feed.fullscreen {
      padding-top: 0;
    }
    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }
    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .reaction-badge {
      background: var(--neon-green);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }
    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
      padding-top: 36px;
    }
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s ease;
    }
    .meme-image.loaded {
      opacity: 1;
    }
    .reactions {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0 20px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(212, 0, 255, 0.1);
    }
    .reaction-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reaction-btn {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
    }
    .reaction-btn:active {
      transform: scale(1.3);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }
    .reaction-count {
      font-size: 14px;
      color: var(--neon-green);
      font-weight: bold;
      min-width: 20px;
      text-align: center;
      background: rgba(57, 255, 20, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .reaction-count.animated {
      animation: bounce 0.3s;
    }
    @keyframes bounce {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    /* NEW: TIP BUTTON */
    .tip-btn {
      background: var(--neon-pink);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 8px;
    }
    .tip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* NEW: CLAIM BUTTON */
    .claim-btn {
      background: var(--neon-purple);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 8px;
    }
    .claimed-by {
      font-size: 12px;
      color: var(--neon-green);
      margin-top: 6px;
      display: block;
    }
    .ad-container {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      padding: 16px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      position: relative;
    }
    .ad-container::before {
      content: "Sponsored by Cringe Lords";
      color: var(--neon-green);
      font-size: 12px;
      position: absolute;
      top: 8px;
      right: 12px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
    }
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      height: 400px;
      animation: pulseSkeleton 1.5s infinite ease-in-out;
    }
    @keyframes pulseSkeleton {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    #installPrompt {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      z-index: 1000;
      border-top: 1px solid var(--neon-purple);
      display: none;
    }
    .prompt-btn {
      background: var(--neon-purple);
      color: white;
      border: none;
      padding: 8px 16px;
      margin: 0 8px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #leaderboardPanel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100dvh;
      background: rgba(13, 13, 26, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      z-index: 200;
      transition: right 0.3s ease;
      border-left: 1px solid var(--neon-purple);
      display: flex;
      flex-direction: column;
    }
    #leaderboardPanel.open {
      right: 0;
    }
    .leaderboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      margin-bottom: 10px;
    }
    .leaderboard-title {
      font-size: 20px;
      color: var(--neon-green);
    }
    .close-leaderboard {
      background: none;
      border: none;
      color: var(--neon-green);
      font-size: 24px;
      cursor: pointer;
    }
    .user-stats {
      display: flex;
      justify-content: space-between;
      background: rgba(57, 255, 20, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--neon-green);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text);
    }
    .streak-badge {
      background: var(--neon-pink);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      margin-top: 4px;
    }
    #leaderboardList {
      flex: 1;
      overflow-y: auto;
    }
    .leaderboard-item {
      background: var(--card-bg);
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .leaderboard-rank {
      background: var(--neon-purple);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    /* CROWN BADGE */
    .crown-badge {
      position: absolute;
      top: -8px;
      left: -8px;
      background: gold;
      color: black;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 50%;
      font-size: 12px;
      z-index: 20;
      box-shadow: 0 0 8px gold;
    }
    #chatPanel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100dvh;
      background: rgba(13, 13, 26, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      z-index: 200;
      transition: right 0.3s ease;
      border-left: 1px solid var(--neon-purple);
      display: flex;
      flex-direction: column;
    }
    #chatPanel.open {
      right: 0;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
      margin-bottom: 10px;
    }
    .chat-title {
      font-size: 20px;
      color: var(--neon-green);
    }
    .close-chat {
      background: none;
      border: none;
      color: var(--neon-green);
      font-size: 24px;
      cursor: pointer;
    }
    .user-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--neon-green);
      margin-bottom: 10px;
    }
    .user-status .username {
      font-weight: bold;
      color: var(--neon-purple);
    }
    .logout-btn {
      background: var(--neon-pink);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-message {
      background: rgba(57, 255, 20, 0.1);
      border-radius: 10px;
      padding: 8px 12px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .chat-message.self {
      align-self: flex-end;
      background: rgba(212, 0, 255, 0.1);
    }
    .chat-message .username {
      font-weight: bold;
      color: var(--neon-purple);
      font-size: 12px;
      display: block;
    }
    .chat-message .content {
      margin-top: 4px;
      font-size: 14px;
    }
    #chatInput {
      display: flex;
      gap: 8px;
      padding: 10px 0;
    }
    #chatInput input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--neon-green);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
    }
    #chatInput button {
      background: var(--neon-green);
      color: var(--bg);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #usernameModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }
    .username-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 2px solid var(--neon-purple);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .username-content h2 {
      color: var(--neon-purple);
      margin-bottom: 15px;
      text-align: center;
    }
    .username-input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--neon-green);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 14px;
    }
    .username-btn {
      background: var(--neon-green);
      color: var(--bg);
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: bold;

    #memeGenerator {
      display: none;

    }
    .generator-content h2 {
      color: var(--neon-purple);
      margin-bottom: 15px;

    .generator-inputs {
      display: flex;

    input[type="text"] {

    /* AI CAPTION BUTTON */
    .ai-caption-btn {

  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo-container" id="logoLink">
        <div class="cringe-logo"></div>
        <div class="logo-title">CringeScroll</div>
      </div>
    </header>
    <div class="ui-bar" id="uiBar">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="hot">🔥 Hot</button>
        <button class="tab-btn" data-tab="fresh">💀 Fresh</button>
        <button class="tab-btn" data-tab="crowned">👑 Crowned</button>
      </div>
      <div class="control-bar">
        <button class="control-btn" id="rouletteBtn" title="Cringe Roulette">🎯</button>
        <button class="control-btn" id="glowBtn" title="Toggle Glow">✨</button>
        <button class="control-btn" id="chatBtn" title="Chat">💬</button>
        <button class="control-btn" id="createBtn" title="Create Meme">🖼️</button>
        <button class="control-btn" id="leaderboardBtn" title="Leaderboard">🏆</button>
      </div>
    </div>
    <div id="feed"></div>
  </div>
  <div id="leaderboardPanel">
    <div class="leaderboard-header">
      <div class="leaderboard-title">🏆 Cringe Lords</div>
      <button class="close-leaderboard" id="closeLeaderboard">✕</button>
    </div>
    <div class="user-stats" id="userStats" style="display:none;">
      <div class="stat-item">
        <div class="stat-value" id="coinCount">0</div>
        <div class="stat-label">CringeCoin</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="streakValue">0</div>
        <div class="stat-label">Streak</div>
        <div id="streakBadge" class="streak-badge" style="display:none;"></div>
      </div>
    </div>
    <div id="leaderboardList"></div>
  </div>
  <div id="chatPanel">
    <div class="chat-header">
      <div class="chat-title">💬 CringeChat</div>
      <button class="close-chat" id="closeChat">✕</button>
    </div>
    <div class="user-status" id="chatUserStatus" style="display:none;">
      <span>Chat as:</span>
      <span class="username" id="chatUserName">Guest</span>
      <button class="logout-btn" id="chatLogoutBtn">Logout</button>
    </div>
    <div id="chatMessages"></div>
    <div id="chatInput">
      <input type="text" id="chatMessage" placeholder="Type a message... /duel @user" maxlength="200">
      <button id="sendChat">Send</button>
    </div>
  </div>
  <div id="usernameModal">
    <div class="username-content">
      <h2>💬 Enter a Username</h2>
      <input type="text" id="usernameInput" class="username-input" placeholder="Your name (no spaces)" maxlength="15" required>
      <button class="username-btn" id="usernameSubmit">Join CringeScroll</button>
    </div>
  </div>
  <div id="memeGenerator">
    <div class="generator-content">
      <h2>🖼️ Create Your Cringe</h2>
      <div class="generator-inputs">
        <input type="text" id="topText" placeholder="Top text (optional)" maxlength="50">
        <input type="text" id="bottomText" placeholder="Bottom text (optional)" maxlength="50">
        <input type="text" id="imageUrl" placeholder="Image URL (PNG/JPG)" required>
        <div class="anonymous-toggle">
          <input type="checkbox" id="anonymousMode">
          <label for="anonymousMode">🕶️ Anonymous Mode (no rewards)</label>
        </div>
        <button class="ai-caption-btn" id="aiCaptionBtn">🤖 Generate Caption</button>
        <div class="ai-caption-result" id="aiCaptionResult" style="display:none;"></div>
      </div>
      <div class="generator-btns">
        <button class="generator-btn create" id="generateMeme">Create & Post</button>
        <button class="generator-btn cancel" id="cancelGenerator">Cancel</button>
      </div>
    </div>
  </div>
  <div id="installPrompt">
    <p>💡 Install for fullscreen cringe & no black bars!</p>
    <button class="prompt-btn" id="installBtn">Install</button>
    <button class="prompt-btn" id="dismissBtn">No thanks</button>
  </div>
  <div class="footer-notice">
    <a href="/privacy.html">Privacy Policy</a>
  </div>
  <script>
    // ===== CORE ENGINE v4.0 — ALL FEATURES =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300;
    let isGlowMode = false;
    let lastScrollTop = 0;
    let currentTab = 'hot';
    let db = null;
    let currentUsername = null;
    let cringeCoin = 0;
    let streak = 0;
    let dailyCrown = null;
    const MEME_SOURCES = [
      'https://meme-api.com/gimme/memes',
      'https://meme-api.com/gimme/dankmemes',
      'https://meme-api.com/gimme/me_irl',
      'https://meme-api.com/gimme/wholesomememes',
      'https://meme-api.com/gimme/funny',
      'https://meme-api.com/gimme/HistoryMemes',
      'https://meme-api.com/gimme/ProgrammerHumor',
      'https://meme-api.com/gimme/ComedyCemetery',
      'https://meme-api.com/gimme/terriblefacebookmemes',
      'https://meme-api.com/gimme/okbuddyretard',
      'https://meme-api.com/gimme/2meirl4meirl',
      'https://meme-api.com/gimme/antiwork',
      'https://meme-api.com/gimme/iamverysmart'
    ];
    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));
    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };
    const createPlaceholder = (width, height) => {
      const svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#161625"/>
        <text x="50%" y="50%" fill="#39FF14" font-size="10" text-anchor="middle" dominant-baseline="middle">Cringe...</text>
      </svg>`;
      return `data:image/svg+xml;base64,${btoa(svg)}`;
    };
    window.addEventListener('load', () => {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        const savedUsername = localStorage.getItem('cringeUsername');
        if (savedUsername) {
          currentUsername = savedUsername;
          loadUserProfile(savedUsername);
        }
        checkDailyCrown();
      } else {
        console.error("Firebase failed to load");
      }
    });
    const loadUserProfile = async (username) => {
      try {
        const userDoc = await db.collection('users').doc(username).get();
        if (userDoc.exists) {
          const data = userDoc.data();
          cringeCoin = data.cringeCoin || 0;
          streak = data.streak || 0;
          updateLeaderboardUI();
          updateChatUserStatus();
          unlockMilestoneRewards();
        } else {
          await db.collection('users').doc(username).set({
            cringeCoin: 0,
            streak: 0,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
          });
          cringeCoin = 0;
          streak = 0;
          updateLeaderboardUI();
          updateChatUserStatus();
        }
      } catch (e) {
        console.warn("User profile load failed:", e);
      }
    };
    const updateCringeCoin = async (amount) => {
      if (!currentUsername || amount <= 0) return;
      try {
        await db.collection('users').doc(currentUsername).update({
          cringeCoin: firebase.firestore.FieldValue.increment(amount)
        });
        cringeCoin += amount;
        updateLeaderboardUI();
      } catch (e) {
        console.warn("CringeCoin update failed:", e);
      }
    };
    const updateStreak = async () => {
      if (!currentUsername) return;
      const today = new Date().toDateString();
      const lastActive = localStorage.getItem('lastActive');
      let newStreak = streak;
      if (lastActive !== today) {
        if (lastActive === new Date(Date.now() - 86400000).toDateString()) {
          newStreak = streak + 1;
        } else {
          newStreak = 1;
        }
        localStorage.setItem('lastActive', today);
        streak = newStreak;
        try {
          await db.collection('users').doc(currentUsername).update({
            streak: streak,
            lastActive: firebase.firestore.FieldValue.serverTimestamp()
          });
          updateLeaderboardUI();
          unlockMilestoneRewards();
        } catch (e) {
          console.warn("Streak update failed:", e);
        }
      }
    };
    const unlockMilestoneRewards = () => {
      const milestones = [3,7,14,30];
      const unlocked = JSON.parse(localStorage.getItem('unlockedMilestones') || '[]');
      for (const day of milestones) {
        if (streak >= day && !unlocked.includes(day)) {
          unlocked.push(day);
          localStorage.setItem('unlockedMilestones', JSON.stringify(unlocked));
          // Visual reward only (no coin)
          if (day === 7) document.body.classList.add('shadow-mode');
        }
      }
    };
    const updateLeaderboardUI = () => {
      document.getElementById('coinCount').textContent = cringeCoin;
      document.getElementById('streakValue').textContent = streak;
      const badge = document.getElementById('streakBadge');
      if (streak > 0) {
        badge.textContent = `🔥${streak}D`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
      if (currentUsername) {
        document.getElementById('userStats').style.display = 'flex';
      }
    };
    const loadLeaderboard = async () => {
      if (!db) return;
      const leaderboardList = document.getElementById('leaderboardList');
      leaderboardList.innerHTML = '<div class="loading-spinner">Loading lords...</div>';
      try {
        const q = db.collection('users')
          .orderBy('cringeCoin', 'desc')
          .limit(10);
        const snapshot = await q.get();
        leaderboardList.innerHTML = '';
        snapshot.docs.forEach((doc, index) => {
          const user = doc.data();
          const item = document.createElement('div');
          item.className = 'leaderboard-item';
          let name = escapeHtml(doc.id);
          if (dailyCrown && dailyCrown === doc.id) {
            name = `👑 ${name}`;
          }
          item.innerHTML = `
            <span>${user.cringeCoin}</span>
            <span>${name}</span>
            <span class="leaderboard-rank">#${index + 1}</span>
          `;
          leaderboardList.appendChild(item);
        });
      } catch (e) {
        leaderboardList.innerHTML = '<div style="color:var(--neon-pink);">Error loading</div>';
      }
    };
    const checkDailyCrown = async () => {
      if (!db) return;
      const today = new Date().toISOString().split('T')[0];
      try {
        const crownDoc = await db.collection('dailyCrown').doc(today).get();
        if (crownDoc.exists) {
          dailyCrown = crownDoc.data().username;
        }
      } catch (e) {
        console.warn("Crown check failed:", e);
      }
    };
    const ensureMemeInDB = async (meme) => {
      if (!db) return;
      try {
        const docRef = db.collection('memes').doc(meme.id);
        const doc = await docRef.get();
        if (!doc.exists) {
          await docRef.set({
            title: meme.title,
            url: meme.url,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isUserGenerated: meme.isUserGenerated || false,
            claimedBy: null
          });
        }
      } catch (e) {
        console.warn("Meme storage failed:", e);
      }
    };
    const getReactions = async (memeId) => {
      if (!db) return { total: 0, counts: {} };
      try {
        const doc = await db.collection('reactions').doc(memeId).get();
        if (doc.exists) {
          return doc.data();
        }
        return { total: 0, counts: {} };
      } catch (e) {
        console.warn("Reaction fetch failed:", e);
        return { total: 0, counts: {} };
      }
    };
    const addReaction = async (memeId, emoji, memeData) => {
      if (!db) return;
      try {
        await ensureMemeInDB(memeData);
        const docRef = db.collection('reactions').doc(memeId);
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(docRef);
          const data = doc.exists ? doc.data() : { total: 0, counts: {} };
          data.counts[emoji] = (data.counts[emoji] || 0) + 1;
          data.total += 1;
          transaction.set(docRef, data);
        });
        if (currentUsername) {
          updateCringeCoin(1);
          updateStreak();
          if (emoji === '💀') {
            const questKey = `quest_react_${new Date().toDateString()}`;
            if (!localStorage.getItem(questKey)) {
              localStorage.setItem(questKey, 'completed');
              updateCringeCoin(5);
            }
          }
        }
      } catch (e) {
        console.warn("Reaction update failed:", e);
      }
    };
    // 🔥 NEW: TIP MEME
    const tipMeme = async (memeId, amount) => {
      if (!currentUsername || cringeCoin < amount) return;
      try {
        await db.collection('tips').add({
          from: currentUsername,
          to: memeId,
          amount: amount,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await db.collection('users').doc(currentUsername).update({
          cringeCoin: firebase.firestore.FieldValue.increment(-amount)
        });
        cringeCoin -= amount;
        updateLeaderboardUI();
        // Show floating animation
        const card = document.querySelector(`.meme-card[data-id="${memeId}"]`);
        if (card) {
          const float = document.createElement('div');
          float.textContent = `+${amount} 💀`;
          float.style.cssText = `
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--neon-green);
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 100;
            animation: floatUp 1s forwards;
          `;
          card.appendChild(float);
          setTimeout(() => float.remove(), 1000);
        }
      } catch (e) {
        console.warn("Tip failed:", e);
      }
    };
    // 🔥 NEW: CLAIM MEME
    const claimMeme = async (memeId) => {
      if (!currentUsername) return;
      try {
        const docRef = db.collection('memes').doc(memeId);
        const doc = await docRef.get();
        if (!doc.exists || doc.data().claimedBy) return;
        await docRef.update({ claimedBy: currentUsername });
        updateCringeCoin(3);
        // Update UI
        const card = document.querySelector(`.meme-card[data-id="${memeId}"]`);
        if (card) {
          const claimedEl = document.createElement('span');
          claimedEl.className = 'claimed-by';
          claimedEl.textContent = `Spotted by @${currentUsername}`;
          card.querySelector('.meme-title').after(claimedEl);
          card.querySelector('.claim-btn').disabled = true;
        }
      } catch (e) {
        console.warn("Claim failed:", e);
      }
    };
    const renderMeme = (meme, index) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.dataset.id = meme.id;
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(meme.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      if (meme.claimedBy) {
        const claimedEl = document.createElement('span');
        claimedEl.className = 'claimed-by';
        claimedEl.textContent = `Spotted by @${meme.claimedBy}`;
        card.appendChild(claimedEl);
      }
      const reactionsDiv = document.createElement('div');
      reactionsDiv.className = 'reactions';
      const emojis = ['💀', '😂', '🤡', '🥴'];
      emojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'reaction-item';
        const btn = document.createElement('div');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = async () => {
          await addReaction(meme.id, emoji, meme);
          const countEl = item.querySelector('.reaction-count');
          const reactionData = await getReactions(meme.id);
          const newCount = (reactionData.counts[emoji] || 0) + 1;
          if (countEl) {
            countEl.textContent = newCount;
            countEl.classList.add('animated');
            setTimeout(() => countEl.classList.remove('animated'), 300);
          } else {
            const countDisplay = document.createElement('div');
            countDisplay.className = 'reaction-count';
            countDisplay.textContent = newCount;
            item.appendChild(countDisplay);
          }
        };
        const countDisplay = document.createElement('div');
        countDisplay.className = 'reaction-count';
        countDisplay.textContent = 0;
        item.appendChild(btn);
        item.appendChild(countDisplay);
        reactionsDiv.appendChild(item);
      });
      // Tip button
      const tipBtn = document.createElement('button');
      tipBtn.className = 'tip-btn';
      tipBtn.textContent = '💀 Tip 5 CC';
      tipBtn.onclick = () => {
        if (cringeCoin >= 5) {
          tipMeme(meme.id, 5);
        } else {
          alert("Not enough CringeCoin!");
        }
      };
      reactionsDiv.appendChild(tipBtn);
      // Claim button (only if fresh and unclaimed)
      if (!meme.claimedBy && meme.ups < 100) {
        const claimBtn = document.createElement('button');
        claimBtn.className = 'claim-btn';
        claimBtn.textContent = '🔍 Claim';
        claimBtn.onclick = () => claimMeme(meme.id);
        reactionsDiv.appendChild(claimBtn);
      }
      // Crown badge
      if (meme.isCrowned) {
        const crown = document.createElement('div');
        crown.className = 'crown-badge';
        crown.textContent = '👑';
        card.appendChild(crown);
      }
      const optimalWidth = Math.min(screen.width * window.devicePixelRatio, 1200);
      let imageUrl = meme.url;
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img 
          class="meme-image" 
          src="${createPlaceholder(300, 300)}" 
          data-src="${imageUrl}"
          loading="${index === 0 ? 'eager' : 'lazy'}"
          fetchpriority="${index === 0 ? 'high' : 'auto'}"
          alt="meme"
        >
      `;
      card.insertBefore(badgeContainer, card.firstChild);
      card.appendChild(reactionsDiv);
      if (meme.claimedBy) {
        const claimedEl = document.createElement('span');
        claimedEl.className = 'claimed-by';
        claimedEl.textContent = `Spotted by @${meme.claimedBy}`;
        card.querySelector('.meme-title').after(claimedEl);
      }
      feed.appendChild(card);
      const img = card.querySelector('img');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            img.src = img.dataset.src;
            img.onload = () => img.classList.add('loaded');
            observer.disconnect();
          }
        });
        observer.observe(img);
      } else {
        img.src = img.dataset.src;
        img.onload = () => img.classList.add('loaded');
      }
    };
    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');
      adContainer.appendChild(ins);
      feed.appendChild(adContainer);
      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("AdSense failed to load:", e.message);
      }
    };
    const loadFeed = async (clear = false) => {
      if (isLoading) return;
      isLoading = true;
      if (clear) {
        feed.innerHTML = '';
        loadCount = 0;
      }
      if (loadCount === 0) {
        feed.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const skeleton = document.createElement('div');
          skeleton.className = 'skeleton-card';
          feed.appendChild(skeleton);
        }
      }
      if (loadCount === 0 && currentTab === 'hot') {
        const userMemes = await fetchUserMemes(2);
        for (const meme of userMemes) {
          if (!seenUrls.has(meme.url)) {
            seenUrls.add(meme.url);
            renderMeme(meme, loadCount);
            loadCount++;
          }
        }
      }
      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme, loadCount);
        loadCount++;
        if (loadCount > 0) {
          const nextAdAt = [5, 6, 7][Math.floor(Math.random() * 3)];
          if (loadCount % nextAdAt === 0) {
            setTimeout(renderAd, 100);
          }
        }
      }
      if (loadCount > 0) {
        document.querySelectorAll('.skeleton-card').forEach(el => el.remove());
      }
      isLoading = false;
    };
    const fetchUserMemes = async (limit = 3) => {
      if (!db) return [];
      try {
        const q = db.collection('memes')
          .where('isUserGenerated', '==', true)
          .orderBy('createdAt', 'desc')
          .limit(limit);
        const snapshot = await q.get();
        return snapshot.docs.map(doc => ({ ...doc.data(), id: doc.id }));
      } catch (e) {
        console.warn("User memes fetch failed:", e);
        return [];
      }
    };
    const fetchMeme = async () => {
      try {
        const shuffled = [...MEME_SOURCES].sort(() => 0.5 - Math.random());
        for (let i = 0; i < shuffled.length; i++) {
          const url = `${shuffled[i]}?_=${Date.now()}`;
          try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            const res = await fetch(url, { cache: 'no-store', mode: 'cors', signal: controller.signal });
            clearTimeout(timeout);
            if (!res.ok) continue;
            const data = await res.json();
            if (!data?.url || seenUrls.has(data.url)) continue;
            seenUrls.add(data.url);
            return { 
              url: data.url, 
              title: data.title || 'Cringe',
              ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
              id: data.url.split('/').pop(),
              isUserGenerated: false,
              claimedBy: null
            };
          } catch (e) {
            continue;
          }
        }
        return null;
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };
    const createMeme = async (top, bottom, imageUrl, isAnonymous = false) => {
      if (!db) {
        alert("Service unavailable. Try again later.");
        return;
      }
      if (!currentUsername && !isAnonymous) {
        document.getElementById('usernameModal').style.display = 'flex';
        return;
      }
      try {
        const memeId = 'user_' + Date.now();
        const username = isAnonymous ? `anon_${Math.random().toString(36).substr(2,6)}` : currentUsername;
        const memeData = {
          id: memeId,
          url: imageUrl,
          title: `${top || ''} ${bottom || ''}`.trim() || 'User Cringe',
          ups: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          isUserGenerated: true,
          createdBy: username,
          isAnonymous: isAnonymous
        };
        await db.collection('memes').doc(memeId).set(memeData);
        document.getElementById('memeGenerator').style.display = 'none';
        document.getElementById('topText').value = '';
        document.getElementById('bottomText').value = '';
        document.getElementById('imageUrl').value = '';
        document.getElementById('anonymousMode').checked = false;
        document.getElementById('aiCaptionResult').style.display = 'none';
        loadFeed(true);
        if (!isAnonymous) {
          updateCringeCoin(10);
          updateStreak();
          const questKey = `quest_post_${new Date().toDateString()}`;
          if (!localStorage.getItem(questKey)) {
            localStorage.setItem(questKey, 'completed');
            updateCringeCoin(10);
          }
        }
      } catch (e) {
        alert("Failed to create meme. Check image URL.");
        console.error(e);
      }
    };
    // 🔥 AI CAPTION GENERATOR
    const generateAICaption = async () => {
      const url = document.getElementById('imageUrl').value.trim();
      if (!url) {
        alert("Enter image URL first!");
        return;
      }
      const btn = document.getElementById('aiCaptionBtn');
      btn.disabled = true;
      btn.textContent = "🤖 Thinking...";
      try {
        // Use Hugging Face free API (no key needed for public models)
        const response = await fetch('https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-large', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ inputs: url })
        });
        const captions = await response.json();
        if (captions && captions[0]) {
          const result = document.getElementById('aiCaptionResult');
          result.style.display = 'block';
          result.innerHTML = `Suggestions: 
            <span onclick="document.getElementById('topText').value='${escapeHtml(captions[0])}'">${escapeHtml(captions[0])}</span>`;
        }
      } catch (e) {
        document.getElementById('aiCaptionResult').textContent = "Failed. Try again.";
      }
      btn.disabled = false;
      btn.textContent = "🤖 Generate Caption";
    };
    const switchTab = (tab) => {
      if (currentTab === tab) return;
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };
    const cringeRoulette = async () => {
      const rouletteBtn = document.getElementById('rouletteBtn');
      rouletteBtn.textContent = '🎰';
      rouletteBtn.disabled = true;
      let tempMemes = [];
      for (let i = 0; i < 3; i++) {
        const meme = await fetchMeme();
        if (meme) tempMemes.push(meme);
      }
      let i = 0;
      const interval = setInterval(() => {
        if (i < 5) {
          feed.innerHTML = '';
          if (tempMemes.length > 0) {
            renderMeme(tempMemes[i % tempMemes.length], 0);
          }
          i++;
        } else {
          clearInterval(interval);
          rouletteBtn.textContent = '🎯';
          rouletteBtn.disabled = false;
          loadCount++;
          if (loadCount % 7 === 0) setTimeout(renderAd, 100);
        }
      }, 200);
    };
    const toggleGlowMode = () => {
      isGlowMode = !isGlowMode;
      if (isGlowMode) {
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
      } else {
        document.body.style.background = 'var(--bg)';
        document.body.style.animation = 'none';
      }
      document.getElementById('glowBtn').textContent = isGlowMode ? '🕶️' : '✨';
      localStorage.setItem('cringeGlow', isGlowMode);
    };
    const loadChatMessages = async () => {
      if (!db) return;
      const chatMessages = document.getElementById('chatMessages');
      chatMessages.innerHTML = '<div class="loading-spinner">Loading chat...</div>';
      try {
        const q = db.collection('chat').orderBy('timestamp', 'desc').limit(50);
        const snapshot = await q.get();
        chatMessages.innerHTML = '';
        snapshot.docs.reverse().forEach(doc => {
          const msg = doc.data();
          const msgDiv = document.createElement('div');
          msgDiv.className = msg.username === currentUsername ? 'chat-message self' : 'chat-message';
          msgDiv.innerHTML = `
            <span class="username">${msg.username}</span>
            <span class="content">${escapeHtml(msg.text)}</span>
          `;
          chatMessages.appendChild(msgDiv);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      } catch (e) {
        chatMessages.innerHTML = '<div style="color:var(--neon-pink);">Error loading chat</div>';
      }
    };
    const sendChatMessage = async () => {
      if (!currentUsername) {
        document.getElementById('usernameModal').style.display = 'flex';
        return;
      }
      const input = document.getElementById('chatMessage');
      const text = input.value.trim();
      if (!text) return;
      // Handle duel command
      if (text.startsWith('/duel @')) {
        const target = text.split('@')[1];
        if (target && target !== currentUsername) {
          startDuel(currentUsername, target);
          input.value = '';
          return;
        }
      }
      try {
        await db.collection('chat').add({
          username: currentUsername,
          text: text,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = '';
        loadChatMessages();
        updateCringeCoin(2);
        updateStreak();
      } catch (e) {
        alert("Failed to send message.");
        console.error(e);
      }
    };
    // 🔥 DUEL SYSTEM
    const startDuel = async (challenger, opponent) => {
      try {
        const duelId = `duel_${Date.now()}`;
        await db.collection('duels').doc(duelId).set({
          challenger: challenger,
          opponent: opponent,
          challengerMeme: null,
          opponentMeme: null,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        // Auto-assign meme
        const meme = await fetchMeme();
        if (meme) {
          await db.collection('duels').doc(duelId).update({
            challengerMeme: meme.url,
            opponentMeme: meme.url,
            status: 'active'
          });
          alert(`Duel started! React first to win 10 CC!`);
          loadChatMessages();
        }
      } catch (e) {
        console.warn("Duel failed:", e);
      }
    };
    const setUsername = async () => {
      const input = document.getElementById('usernameInput');
      let username = input.value.trim();
      if (!username) {
        alert("Please enter a username.");
        return;
      }
      username = username.replace(/[^a-zA-Z0-9]/g, '');
      if (username.length < 2) {
        alert("Username must be at least 2 characters (letters/numbers only).");
        return;
      }
      currentUsername = username;
      localStorage.setItem('cringeUsername', username);
      document.getElementById('usernameModal').style.display = 'none';
      input.value = '';
      loadUserProfile(username);
      loadChatMessages();
    };
    const logout = () => {
      currentUsername = null;
      localStorage.removeItem('cringeUsername');
      localStorage.removeItem('lastActive');
      localStorage.removeItem('unlockedMilestones');
      document.getElementById('userStats').style.display = 'none';
      updateChatUserStatus();
      document.getElementById('chatMessages').innerHTML = '';
    };
    const updateChatUserStatus = () => {
      const userStatus = document.getElementById('chatUserStatus');
      const userName = document.getElementById('chatUserName');
      const logoutBtn = document.getElementById('chatLogoutBtn');
      if (currentUsername) {
        userStatus.style.display = 'flex';
        userName.textContent = currentUsername;
        logoutBtn.onclick = logout;
      } else {
        userStatus.style.display = 'none';
      }
    };
    const initScrollHiding = () => {
      const header = document.querySelector('header');
      const uiBar = document.getElementById('uiBar');
      let ticking = false;
      let isHidden = false;
      let lastDirection = 0;
      const updateBars = () => {
        const currentScrollTop = feed.scrollTop;
        const scrollDelta = currentScrollTop - lastScrollTop;
        const direction = scrollDelta > 0 ? 1 : -1;
        if (Math.abs(scrollDelta) > 10) {
          const shouldHide = direction === 1 && currentScrollTop > 100;
          if (shouldHide && !isHidden) {
            header.classList.add('hidden');
            uiBar.classList.add('hidden');
            feed.classList.add('fullscreen');
            isHidden = true;
          } else if (direction === -1 && isHidden) {
            header.classList.remove('hidden');
            uiBar.classList.remove('hidden');
            feed.classList.remove('fullscreen');
            isHidden = false;
          }
        }
        lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        lastDirection = direction;
        ticking = false;
      };
      feed.addEventListener('scroll', () => {
        if (!ticking) {
          requestAnimationFrame(updateBars);
          ticking = true;
        }
      });
    };
    const attachButtonListeners = () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });
      document.getElementById('rouletteBtn').onclick = cringeRoulette;
      document.getElementById('glowBtn').onclick = toggleGlowMode;
      document.getElementById('chatBtn').onclick = () => {
        document.getElementById('chatPanel').classList.add('open');
        if (currentUsername) {
          loadChatMessages();
        }
      };
      document.getElementById('closeChat').onclick = () => {
        document.getElementById('chatPanel').classList.remove('open');
      };
      document.getElementById('sendChat').onclick = sendChatMessage;
      document.getElementById('usernameSubmit').onclick = setUsername;
      document.getElementById('logoLink').onclick = () => {
        window.location.href = window.location.origin + window.location.pathname;
      };
      document.getElementById('installBtn').onclick = () => {
        alert("Tap 'Share' → 'Add to Home Screen' for fullscreen mode!");
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
      document.getElementById('dismissBtn').onclick = () => {
        document.getElementById('installPrompt').style.display = 'none';
        localStorage.setItem('installPromptSeen', 'true');
      };
      document.getElementById('createBtn').onclick = () => {
        if (!currentUsername) {
          document.getElementById('usernameModal').style.display = 'flex';
          return;
        }
        document.getElementById('memeGenerator').style.display = 'flex';
      };
      document.getElementById('cancelGenerator').onclick = () => {
        document.getElementById('memeGenerator').style.display = 'none';
      };
      document.getElementById('generateMeme').onclick = () => {
        const top = document.getElementById('topText').value.trim();
        const bottom = document.getElementById('bottomText').value.trim();
        const url = document.getElementById('imageUrl').value.trim();
        const isAnonymous = document.getElementById('anonymousMode').checked;
        if (!url) {
          alert("Image URL is required!");
          return;
        }
        createMeme(top, bottom, url, isAnonymous);
      };
      document.getElementById('aiCaptionBtn').onclick = generateAICaption;
      document.getElementById('leaderboardBtn').onclick = () => {
        document.getElementById('leaderboardPanel').classList.add('open');
        loadLeaderboard();
        if (currentUsername) {
          updateLeaderboardUI();
        }
      };
      document.getElementById('closeLeaderboard').onclick = () => {
        document.getElementById('leaderboardPanel').classList.remove('open');
      };
    };
    const initApp = () => {
      feed = document.getElementById('feed');
      const savedGlow = localStorage.getItem('cringeGlow') === 'true';
      if (savedGlow) {
        isGlowMode = true;
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
        document.getElementById('glowBtn').textContent = '🕶️';
      }
      attachButtonListeners();
      initScrollHiding();
      if (!localStorage.getItem('installPromptSeen')) {
        setTimeout(() => {
          document.getElementById('installPrompt').style.display = 'block';
        }, 10000);
      }
      loadFeed();
      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadFeed();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
