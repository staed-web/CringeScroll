<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a14" />
  <meta name="description" content="Endless cringe. Infinite laughs. Zero regrets." />
  <title>CringeScroll</title>
  <link rel="manifest" href="#inline-manifest" />
  <link rel="icon" href="image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23D400FF%22>💀</text></svg>">
  <style>
    :root {
      --bg: #0a0a14;
      --card-bg: #121220;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f0f0ff;
      --muted: #8a8aa0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      height: 100dvh;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 12px 16px;
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--neon-purple);
      text-align: center;
      z-index: 10;
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* CRITICAL: Feed is scrollable */
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 8px 80px;
    }

    .meme-card {
      background: var(--card-bg);
      margin: 16px 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(212, 0, 255, 0.1);
    }

    .meme-title {
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      color: var(--neon-green);
      line-height: 1.4;
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
    }

    .ad-container {
      background: rgba(18, 18, 32, 0.7);
      margin: 20px 0;
      padding: 20px;
      border: 1px dashed var(--neon-purple);
      text-align: center;
    }

    /* Sentinel element to trigger loading */
    #sentinel {
      height: 20px;
      width: 100%;
    }

    @media (min-width: 768px) {
      #feed { padding: 0 16px 80px; }
      .meme-card { max-width: 700px; margin: 20px auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header><h1>CRINGESCROLL</h1></header>
    <div id="feed">
      <!-- Memes load here -->
    </div>
  </div>

  <script>
    // ===== PWA SETUP (unchanged) =====
    const manifest = {name:"CringeScroll",short_name:"CringeScroll",start_url:"/",display:"standalone",background_color:"#0a0a14",theme_color:"#0a0a14",icons:[{src:"image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23D400FF'>💀</text></svg>",sizes:"192x192",type:"image/svg+xml"}]};
    const manifestURL = URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
    document.head.appendChild(Object.assign(document.createElement('link'),{rel:'manifest',href:manifestURL}));

    if ('serviceWorker' in navigator) {
      const sw = `self.addEventListener('fetch',()=>{});self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
    }

    // ===== CORE LOGIC =====
    const feed = document.getElementById('feed');
    let memeCount = 0;
    let isLoading = false;

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));
    }

    async function loadMeme() {
      if (isLoading) return;
      isLoading = true;

      try {
        const res = await fetch('https://meme-api.com/gimme?nocache=' + Date.now());
        const data = await res.json();
        memeCount++;

        const card = document.createElement('div');
        card.className = 'meme-card';
        card.innerHTML = `
          <div class="meme-title">${escapeHtml(data.title || 'Untitled Cringe')}</div>
          <img class="meme-image" src="${data.url}" loading="lazy" alt="meme">
        `;
        feed.insertBefore(card, document.getElementById('sentinel'));

        // Insert ad every 5 memes
        if (memeCount % 5 === 0) {
          const ad = document.createElement('div');
          ad.className = 'ad-container';
          ad.innerHTML = `
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3940256099942544" crossorigin="anonymous"><\/script>
            <ins class="adsbygoogle" style="display:block" data-ad-format="fluid" data-ad-layout-key="-fb+5w+4e-db+86" data-ad-client="ca-pub-3940256099942544" data-ad-slot="6300978111"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script>
          `;
          feed.insertBefore(ad, document.getElementById('sentinel'));
        }
      } catch (e) {
        console.error("Load fail", e);
      } finally {
        isLoading = false;
      }
    }

    // ===== INFINITE SCROLL WITH INTERSECTION OBSERVER =====
    const sentinel = document.createElement('div');
    sentinel.id = 'sentinel';
    feed.appendChild(sentinel);

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !isLoading) {
        loadMeme();
      }
    }, { root: feed, threshold: 0.1 });

    observer.observe(sentinel);

    // Load initial batch
    for (let i = 0; i < 8; i++) loadMeme();
  </script>
</body>
</html>
