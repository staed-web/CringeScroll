<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9372118866074955" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --neon-pink: #FF2A6D;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
      --ad-bg: rgba(22, 22, 37, 0.4);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* NEW: FUN CONTROL BAR */
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(212, 0, 255, 0.3);
    }

    .control-btn {
      background: transparent;
      border: 2px solid var(--neon-pink);
      color: var(--neon-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .meme-card:hover {
      transform: translateY(-2px);
    }

    /* NEW: REACTION BADGE */
    .reaction-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--neon-green);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* NEW: LOADING SPINNER */
    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
    }

    .loading-spinner::after {
      content: "💀";
      animation: pulse 1.5s infinite;
      margin-left: 8px;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .ad-container {
      background: var(--ad-bg);
      border-radius: 16px;
      margin: 20px 10px;
      padding: 16px;
      text-align: center;
      border: 1px dashed var(--neon-purple);
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .ad-container::before {
      content: "Sponsored Cringe";
      color: var(--neon-green);
      font-size: 14px;
      opacity: 0.7;
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      padding: 0 8px;
      border-radius: 4px;
    }

    .footer-notice {
      text-align: center;
      margin: 30px 0;
      font-size: 12px;
      color: #8a8aa0;
    }

    .footer-notice a {
      color: #8a8aa0;
      text-decoration: none;
    }

    .footer-notice a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    
    <!-- NEW: FUN CONTROL BAR -->
    <div class="control-bar">
      <button class="control-btn" id="refreshBtn" title="Fresh Cringe">🔄</button>
      <button class="control-btn" id="darkModeBtn" title="Toggle Glow">✨</button>
      <button class="control-btn" id="shareBtn" title="Share Cringe">📤</button>
    </div>
    
    <div id="feed">
      <div class="loading-spinner">Loading cringe...</div>
    </div>
  </div>

  <div class="footer-notice">
    <a href="/privacy.html">Privacy Policy</a>
  </div>

  <script>
    // ===== ENHANCED CORE ENGINE =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300;
    let isGlowMode = false;

    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    const fetchMeme = async () => {
      try {
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now()}`, {
          cache: 'no-store',
          mode: 'cors'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { 
          url: data.url, 
          title: data.title || 'Cringe',
          ups: data.ups || Math.floor(Math.random() * 10000) + 1000
        };
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.innerHTML = `
        <div class="reaction-badge">🔥 ${formatNumber(meme.ups)}</div>
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" onerror="this.parentElement.style.display='none'">
      `;
      feed.appendChild(card);
    };

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };

    const renderAd = () => {
      const adContainer = document.createElement('div');
      adContainer.className = 'ad-container';
      
      const ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-format', 'fluid');
      ins.setAttribute('data-ad-layout-key', '-fb+5w+4e-db+86');
      ins.setAttribute('data-ad-client', 'ca-pub-9372118866074955');
      ins.setAttribute('data-ad-slot', '5669979942');

      adContainer.appendChild(ins);
      feed.appendChild(adContainer);

      try {
        (window.adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("Ad load failed:", e);
      }
    };

    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      // Remove loading spinner on first load
      if (loadCount === 0) {
        feed.innerHTML = '';
      }

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;
        if (loadCount % 5 === 0) {
          setTimeout(renderAd, 100);
        }
      }
      isLoading = false;
    };

    // ===== NEW: FUN FEATURES =====
    const initControls = () => {
      // Refresh button
      document.getElementById('refreshBtn').onclick = () => {
        loadNext();
      };

      // Glow mode toggle
      document.getElementById('darkModeBtn').onclick = () => {
        isGlowMode = !isGlowMode;
        document.body.style.boxShadow = isGlowMode ? 
          `0 0 30px var(--neon-purple), 0 0 60px var(--neon-green)` : 'none';
        document.getElementById('darkModeBtn').textContent = isGlowMode ? '🕶️' : '✨';
      };

      // Share button
      document.getElementById('shareBtn').onclick = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: 'CringeScroll',
              text: 'Endless cringe memes 👀',
              url: window.location.href
            });
          } catch (e) {
            // Fallback: copy URL
            navigator.clipboard.writeText(window.location.href);
            alert('Link copied! Paste anywhere.');
          }
        } else {
          // Fallback for non-supporting browsers
          navigator.clipboard.writeText(window.location.href);
          alert('Link copied! Paste anywhere.');
        }
      };
    };

    const initApp = () => {
      feed = document.getElementById('feed');
      initControls();

      // Load initial memes
      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 150);
      }

      // Attach scroll after content
      setTimeout(() => {
        let scrollTimer;
        const handleScroll = () => {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(() => {
            const { scrollTop, scrollHeight, clientHeight } = feed;
            if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
              loadNext();
            }
          }, 100);
        };
        feed.addEventListener('scroll', handleScroll, { passive: true });
      }, 1000);
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
