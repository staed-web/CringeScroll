<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d1a" />
  <title>CringeScroll</title>
  <style>
    :root {
      --bg: #0d0d1a;
      --card-bg: #161625;
      --neon-purple: #D400FF;
      --neon-green: #39FF14;
      --text: #f5f5ff;
      --border: rgba(212, 0, 255, 0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--neon-purple);
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--neon-purple), var(--neon-green));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .meme-card:hover {
      transform: translateY(-2px);
    }

    .meme-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--neon-green);
      word-break: break-word;
    }

    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .loader {
      text-align: center;
      padding: 20px;
      color: var(--neon-green);
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>CringeScroll</h1>
    </header>
    <div id="feed">
      <!-- Memes load here -->
    </div>
  </div>

  <script>
    // ===== CORE ENGINE WITH SCROLL-BASED INFINITE LOAD =====
    const feed = document.getElementById('feed');
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    const BUFFER_HEIGHT = 300; // Trigger load when 300px from bottom

    // Escape HTML
    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));

    // Fetch one unique meme
    const fetchMeme = async () => {
      try {
        const res = await fetch(`https://meme-api.com/gimme?_=${Date.now()}`, {
          cache: 'no-store',
          mode: 'cors'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data?.url || seenUrls.has(data.url)) return null;
        seenUrls.add(data.url);
        return { url: data.url, title: data.title || 'Cringe' };
      } catch (e) {
        console.warn("Fetch failed:", e.message);
        return null;
      }
    };

    // Render meme
    const renderMeme = (meme) => {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.innerHTML = `
        <div class="meme-title">${escapeHtml(meme.title)}</div>
        <img class="meme-image" src="${meme.url}" loading="lazy" alt="meme" onerror="this.parentElement.style.display='none'">
      `;
      feed.appendChild(card);
    };

    // Load next meme
    const loadNext = async () => {
      if (isLoading) return;
      isLoading = true;

      const meme = await fetchMeme();
      if (meme) {
        renderMeme(meme);
        loadCount++;
      }

      isLoading = false;
    };

    // ===== SCROLL HANDLER (100% RELIABLE) =====
    let scrollTimer;
    const handleScroll = () => {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const { scrollTop, scrollHeight, clientHeight } = feed;
        if (scrollHeight - scrollTop <= clientHeight + BUFFER_HEIGHT && !isLoading) {
          loadNext();
        }
      }, 100);
    };

    feed.addEventListener('scroll', handleScroll, { passive: true });

    // Load initial batch
    const loadInitial = () => {
      for (let i = 0; i < 6; i++) {
        setTimeout(loadNext, i * 200);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadInitial);
    } else {
      loadInitial();
    }
  </script>
  <div style="text-align:center;margin:30px 0;font-size:12px;color:#8a8aa0;">
  <a href="/privacy.html" style="color:#8a8aa0;">Privacy Policy</a>
  </div>
</body>
</html>
