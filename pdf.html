<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PremiumPDF - Ultimate Free PDF Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1"></script>
    <style>
        .drag-over { border-color: #3b82f6; background-color: #eff6ff; }
        .tool-active { border-bottom: 2px solid #2563eb; color: #2563eb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <nav class="bg-white shadow-sm py-4 px-8 flex flex-wrap justify-between items-center">
        <div class="text-2xl font-bold text-blue-600 mr-8">PremiumPDF</div>
        <div class="space-x-6 text-sm font-medium mt-4 sm:mt-0" id="tool-menu">
            <button onclick="selectTool('merge')" id="btn-merge" class="tool-active hover:text-blue-600 pb-1">Merge PDF</button>
            <button onclick="selectTool('split')" id="btn-split" class="hover:text-blue-600 pb-1">Split PDF</button>
            <button onclick="selectTool('watermark')" id="btn-watermark" class="hover:text-blue-600 pb-1">Watermark</button>
        </div>
    </nav>

    <div class="w-full max-w-4xl mx-auto mt-6 h-24 bg-gray-200 border border-gray-300 flex items-center justify-center text-gray-500 text-sm">
        [ AdSense Banner 728x90 ]
    </div>

    <main class="max-w-4xl mx-auto mt-10 px-4">
        <div class="text-center mb-10">
            <h1 id="tool-title" class="text-4xl font-extrabold text-gray-900 mb-4">Merge PDF Files</h1>
            <p id="tool-desc" class="text-lg text-gray-600">Combine multiple PDFs into one unified document.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <div id="drop-zone" class="border-4 border-dashed border-gray-300 rounded-xl p-12 text-center cursor-pointer hover:bg-gray-50 transition-colors">
                <p class="text-xl font-semibold text-gray-700">Choose PDF file(s)</p>
                <input type="file" id="file-input" class="hidden" multiple accept="application/pdf">
            </div>

            <ul id="file-list" class="mt-6 space-y-2 text-sm text-gray-600"></ul>

            <div class="mt-8 text-center hidden" id="action-area">
                <button id="process-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105">
                    Process PDF
                </button>
            </div>
            
            <p id="status-text" class="mt-4 text-center text-blue-600 font-semibold hidden">Processing...</p>
        </div>
    </main>

    <script>
        const { PDFDocument, rgb, degrees } = PDFLib;
        
        let currentTool = 'merge';
        let selectedFiles = [];

        // UI Elements
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const actionArea = document.getElementById('action-area');
        const processBtn = document.getElementById('process-btn');
        const statusText = document.getElementById('status-text');

        // Tool Selection Logic
        function selectTool(tool) {
            currentTool = tool;
            selectedFiles = []; // Reset files when changing tools
            updateUI();
            
            // Update UI text based on tool
            const title = document.getElementById('tool-title');
            const desc = document.getElementById('tool-desc');
            
            document.querySelectorAll('#tool-menu button').forEach(btn => btn.classList.remove('tool-active'));
            document.getElementById(`btn-${tool}`).classList.add('tool-active');

            if(tool === 'merge') {
                title.textContent = 'Merge PDF Files';
                desc.textContent = 'Combine multiple PDFs into one unified document.';
                fileInput.multiple = true;
            } else if (tool === 'split') {
                title.textContent = 'Split PDF (Extract Page 1)';
                desc.textContent = 'Extracts the first page of your PDF into a new document.';
                fileInput.multiple = false;
            } else if (tool === 'watermark') {
                title.textContent = 'Add Watermark';
                desc.textContent = 'Stamp "PremiumPDF" across your document.';
                fileInput.multiple = false;
            }
        }

        // File Handling
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            updateUI();
        }

        function updateUI() {
            fileList.innerHTML = '';
            selectedFiles.forEach(file => {
                let li = document.createElement('li');
                li.textContent = `📄 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
                fileList.appendChild(li);
            });

            if ((currentTool === 'merge' && selectedFiles.length > 1) || 
                (currentTool !== 'merge' && selectedFiles.length === 1)) {
                actionArea.classList.remove('hidden');
            } else {
                actionArea.classList.add('hidden');
            }
        }

        // Processing Logic Engine
        processBtn.addEventListener('click', async () => {
            statusText.classList.remove('hidden');
            processBtn.disabled = true;

            try {
                let finalPdfBytes;
                let fileName = 'Processed.pdf';

                if (currentTool === 'merge') {
                    const mergedPdf = await PDFDocument.create();
                    for (let file of selectedFiles) {
                        const pdf = await PDFDocument.load(await file.arrayBuffer());
                        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                        copiedPages.forEach((page) => mergedPdf.addPage(page));
                    }
                    finalPdfBytes = await mergedPdf.save();
                    fileName = 'Merged.pdf';

                } else if (currentTool === 'split') {
                    // MVP Split: Extracts just the first page
                    const originalPdf = await PDFDocument.load(await selectedFiles[0].arrayBuffer());
                    const newPdf = await PDFDocument.create();
                    const [firstPage] = await newPdf.copyPages(originalPdf, [0]);
                    newPdf.addPage(firstPage);
                    finalPdfBytes = await newPdf.save();
                    fileName = 'Split_Page1.pdf';

                } else if (currentTool === 'watermark') {
                    const pdfDoc = await PDFDocument.load(await selectedFiles[0].arrayBuffer());
                    const pages = pdfDoc.getPages();
                    pages.forEach(page => {
                        const { width, height } = page.getSize();
                        page.drawText('PremiumPDF', {
                            x: width / 4,
                            y: height / 2,
                            size: 50,
                            color: rgb(0.95, 0.1, 0.1),
                            opacity: 0.3,
                            rotate: degrees(45),
                        });
                    });
                    finalPdfBytes = await pdfDoc.save();
                    fileName = 'Watermarked.pdf';
                }

                // Trigger Download
                const blob = new Blob([finalPdfBytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();

                statusText.textContent = "Done! Downloading...";
            } catch (error) {
                console.error(error);
                alert('An error occurred.');
            }

            setTimeout(() => { 
                statusText.classList.add('hidden'); 
                statusText.textContent = "Processing..."; 
                processBtn.disabled = false; 
            }, 2000);
        });
    </script>
</body>
</html>
