<html lang="en">
<head>

  <style>
    :root {
      --bg: #000;
      --card-bg: #0f0f14;
      --text: #e0e0e0;
      --highlight: #ff2a6d;
      --highlight-alt: #00ccff;
      --border: rgba(255, 42, 109, 0.15);
      --glow: 0 0 15px rgba(255, 42, 109, 0.7);
      --glow-alt: 0 0 15px rgba(0, 204, 255, 0.7);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Exo 2', sans-serif;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    
    /* 3D EFFECTS */
    .floating {
      animation: float 6s ease-in-out infinite;
      transform-style: preserve-3d;
      perspective: 1000px;
    }
    
    @keyframes float {
      0% { transform: translateZ(0px); }
      50% { transform: translateZ(10px); }
      100% { transform: translateZ(0px); }
    }
    
    .glow {
      box-shadow: var(--glow);
      transition: box-shadow 0.3s;
    }
    
    .glow:hover {
      box-shadow: var(--glow-alt);
    }
    
    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      height: 60px;
    }
    
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(45deg, #ff2a6d, #00ccff);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
      color: white;
      font-family: 'Orbitron', sans-serif;
      box-shadow: 0 0 10px rgba(255, 42, 109, 0.5);
      position: relative;
    }
    
    .logo-icon::before {
      content: "";
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(45deg, #ff2a6d, #00ccff);
      border-radius: 12px;
      z-index: -1;
      filter: blur(10px);
      opacity: 0.7;
    }
    
    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(90deg, var(--highlight), var(--highlight-alt));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      letter-spacing: -1px;
      position: relative;
      display: inline-block;
    }
    
    .logo-title::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, var(--highlight), var(--highlight-alt));
      transform: scaleX(0);
      transition: transform 0.3s;
    }
    
    .logo-title:hover::after {
      transform: scaleX(1);
    }
    
    .hamburger-menu {
      width: 30px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    
    .hamburger-menu span {
      display: block;
      width: 100%;
      height: 4px;
      background: var(--text);
      border-radius: 2px;
      transition: all 0.3s;
      position: relative;
    }
    
    .hamburger-menu:hover span {
      background: var(--highlight);
    }
    
    /* STATS PANEL */
    .stats-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 20px;
      margin: 15px 20px;
      background: rgba(15, 15, 20, 0.7);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    
    .stat-item {
      text-align: center;
      padding: 10px;
      border-radius: 15px;
      background: rgba(10, 10, 15, 0.5);
      transition: all 0.3s;
    }
    
    .stat-item:hover {
      transform: translateY(-5px);
      background: rgba(20, 20, 25, 0.6);
    }
    
    .stat-value {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 5px;
      background: linear-gradient(90deg, var(--highlight), var(--highlight-alt));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      font-family: 'Orbitron', sans-serif;
    }
    
    .stat-label {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* MEME CARD */
    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 20px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      position: relative;
      transition: transform 0.3s;
    }
    
    .meme-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
    
    .meme-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }
    
    .meme-source {
      color: var(--highlight-alt);
      font-weight: 600;
    }
    
    .meme-time {
      color: rgba(255, 255, 255, 0.5);
    }
    
    .meme-title {
      font-size: 22px;
      font-weight: 700;
      padding: 0 20px 20px;
      color: white;
      line-height: 1.3;
    }
    
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s;
    }
    
    .meme-image.loaded {
      opacity: 1;
    }
    
    /* INTERACTION PANEL */
    .interaction-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: rgba(10, 10, 15, 0.7);
      border-top: 1px solid var(--border);
      gap: 15px;
    }
    
    .vote-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 25, 0.5);
      border: none;
      border-radius: 50px;
      padding: 10px 15px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 100px;
      justify-content: center;
    }
    
    .vote-btn:hover {
      background: rgba(255, 42, 109, 0.2);
    }
    
    .vote-btn:active {
      transform: scale(0.95);
    }
    
    .vote-btn i {
      font-size: 20px;
      color: var(--highlight-alt);
    }
    
    .cringe-level {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 42, 109, 0.2);
      border-radius: 50px;
      padding: 10px 15px;
      color: var(--highlight);
      font-weight: 600;
      font-size: 14px;
    }
    
    .cringe-level i {
      font-size: 20px;
    }
    
    /* FLOATING BUTTON */
    .floating-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--highlight), var(--highlight-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      z-index: 100;
      cursor: pointer;
      transition: all 0.3s;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .floating-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 25px rgba(255, 42, 109, 0.5);
    }
    
    /* SIDEBAR */
    #sidebar {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(10px);
      z-index: 200;
      transition: right 0.3s ease;
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    
    #sidebar.open {
      right: 0;
    }
    
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    
    .sidebar-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--highlight);
    }
    
    .close-sidebar {
      background: none;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
    }
    
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 0;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .sidebar-item:hover {
      color: var(--highlight);
      transform: translateX(5px);
    }
    
    .sidebar-item i {
      width: 20px;
      text-align: center;
    }
    
    /* MODALS */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      display: none;
    }
    
    .modal-content {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      width: 90%;
      max-width: 400px;
      border: 1px solid var(--border);
      position: relative;
    }
    
    .close-modal {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }
    
    .modal-title {
      font-size: 22px;
      color: var(--highlight);
      text-align: center;
      margin-bottom: 20px;
    }
    
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .auth-input {
      background: rgba(20, 20, 25, 0.5);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 15px;
      color: var(--text);
      font-size: 16px;
    }
    
    .auth-btn {
      background: linear-gradient(45deg, var(--highlight), var(--highlight-alt));
      border: none;
      border-radius: 10px;
      padding: 12px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .auth-btn:hover {
      opacity: 0.9;
    }
    
    /* TOAST MESSAGES */
    .toast {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    /* 3D CANVAS CONTAINER */
    .canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
    
    /* SCROLL INDICATOR */
    .scroll-indicator {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 99;
    }
    
    .scroll-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--highlight);
      opacity: 0.5;
    }
    
    .scroll-dot.active {
      opacity: 1;
      transform: scale(1.2);
    }
    
    /* AD CONTAINER */
    .ad-container {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 10px 20px;
      padding: 15px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      position: relative;
      margin-bottom: 30px;
    }
    
    .ad-container::before {
      content: "Sponsored";
      position: absolute;
      top: 10px;
      right: 15px;
      background: var(--highlight);
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    
    /* SKELETON LOADING */
    .skeleton {
      background: rgba(20, 20, 25, 0.5);
      border-radius: 15px;
      margin: 20px 20px 30px;
      overflow: hidden;
      position: relative;
    }
    
    .skeleton::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(30,30,40,0), rgba(30,30,40,0.2) 50%, rgba(30,30,40,0) 100%);
      background-size: 200% 100%;
      animation: skeleton 1.5s infinite;
    }
    
    @keyframes skeleton {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    /* FOOTER */
    .footer {
      text-align: center;
      padding: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      margin-top: 20px;
      border-top: 1px solid var(--border);
    }
    
    /* MEDIA QUERIES */
    @media (max-width: 600px) {
      .stats-panel {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      
      .meme-title {
        font-size: 20px;
      }
      
      .interaction-panel {
        flex-direction: column;
        align-items: stretch;
      }
      
      .vote-btn {
        width: 100%;
      }
    }
    
    /* 3D TRANSITION EFFECTS */
    .card-3d {
      transform: perspective(1000px) rotateY(0deg);
      transition: transform 0.6s ease;
    }
    
    .card-3d:hover {
      transform: perspective(1000px) rotateY(10deg);
    }
    
    /* HAMBURGER MENU ANIMATION */
    .hamburger-menu.active span:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
      width: 25px;
    }
    
    .hamburger-menu.active span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger-menu.active span:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
      width: 25px;
    }
    
    /* CRINGE LEVEL BAR */
    .cringe-bar {
      height: 8px;
      background: linear-gradient(90deg, var(--highlight), var(--highlight-alt));
      border-radius: 4px;
      width: 100%;
      margin-top: 5px;
    }
    
    /* FEED SCROLL */
    #feed {
      height: calc(100dvh - 60px - 100px);
      overflow-y: auto;
      padding-bottom: 50px;
      scroll-behavior: smooth;
    }
    
    /* MODAL ANIMATION */
    @keyframes modal-open {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    .modal-content {
      animation: modal-open 0.3s forwards;
    }
  </style>
</head>

  <!-- MAIN CONTENT -->

  </div>
    <script>
    // ===== CORE ENGINE v7.0 — REBORN WITH 3D EFFECTS =====
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    let currentTab = 'all';
    let db = null;
    let auth = null;
    let currentUser = null;
    let cringeCoin = 0;
    let streak = 0;
    let dailyCrown = null;
    let isSidebarOpen = false;
    let isAuthModalOpen = false;
    
    // 3D Background
    let scene, camera, renderer, stars = [];
    
    // Cringe Level System
    const CRINGE_LEVELS = [
      { level: 1, name: "Mild", max: 5, color: "#00ff00" },
      { level: 2, name: "Medium", max: 10, color: "#00ccff" },
      { level: 3, name: "High", max: 15, color: "#0099ff" },
      { level: 4, name: "Extreme", max: 20, color: "#0066ff" },
      { level: 5, name: "MAX", max: Infinity, color: "#ff2a6d" }
    ];
    
    // Meme categories
    const MEME_CATEGORIES = [
      'https://meme-api.com/gimme/memes',
      'https://meme-api.com/gimme/dankmemes',
      'https://meme-api.com/gimme/me_irl',
      'https://meme-api.com/gimme/wholesomememes',
      'https://meme-api.com/gimme/funny',
      'https://meme-api.com/gimme/ProgrammerHumor',
      'https://meme-api.com/gimme/ComedyCemetery',
      'https://meme-api.com/gimme/terriblefacebookmemes',
      'https://meme-api.com/gimme/okbuddyretard',
      'https://meme-api.com/gimme/2meirl4meirl',
      'https://meme-api.com/gimme/antiwork',
      'https://meme-api.com/gimme/iamverysmart'
    ];
    
    // Initialize 3D background
    function init3DBackground() {
      const canvas = document.getElementById('backgroundCanvas');
      if (!canvas) return;
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      
      // Create stars
      for (let i = 0; i < 100; i++) {
        const geometry = new THREE.SphereGeometry(0.1, 16, 16);
        const material = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff });
        const star = new THREE.Mesh(geometry, material);
        
        star.position.x = (Math.random() - 0.5) * 100;
        star.position.y = (Math.random() - 0.5) * 100;
        star.position.z = (Math.random() - 0.5) * 100;
        
        stars.push(star);
        scene.add(star);
      }
      
      camera.position.z = 5;
      
      function animate() {
        requestAnimationFrame(animate);
        
        // Rotate stars
        stars.forEach((star, i) => {
          star.position.x = Math.sin(Date.now() * 0.0005 + i) * 10;
          star.position.y = Math.cos(Date.now() * 0.0005 + i) * 10;
        });
        
        renderer.render(scene, camera);
      }
      
      animate();
      
      // Handle window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
    
    // Update Cringe Level display
    function updateCringeLevel() {
      const cringeLevel = Math.min(streak, 20); // Cap at level 20
      const level = CRINGE_LEVELS.find(l => cringeLevel <= l.max) || CRINGE_LEVELS[CRINGE_LEVELS.length - 1];
      
      document.getElementById('cringeLevel').textContent = level.name;
      document.getElementById('cringeLevel').style.color = level.color;
      
      // Update progress bar
      const progress = cringeLevel / level.max;
      const cringeBar = document.createElement('div');
      cringeBar.className = 'cringe-bar';
      cringeBar.style.width = `${Math.min(progress * 100, 100)}%`;
      cringeBar.style.background = `linear-gradient(90deg, var(--highlight), ${level.color})`;
      
      // Replace any existing progress bar
      const existingBar = document.querySelector('.cringe-bar');
      if (existingBar) {
        existingBar.replaceWith(cringeBar);
      } else {
        document.querySelector('.stat-item:last-child').appendChild(cringeBar);
      }
    }
    
    // Show toast notification
    function showToast(message, duration = 3000) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }
    
    // Firebase initialization
    function initFirebase() {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      auth = firebase.auth();
      
      // Auth state observer
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          try {
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
              currentUser = {
                uid: user.uid,
                email: user.email,
                username: userDoc.data().username
              };
              cringeCoin = userDoc.data().cringeCoin || 0;
              streak = userDoc.data().streak || 0;
              
              // Update UI
              document.getElementById('sidebarProfile').style.display = 'block';
              document.getElementById('sidebarLogout').style.display = 'block';
              document.getElementById('menuLogin').style.display = 'none';
              updateCringeLevel();
              updateStats();
              
              // Load user data
              await loadUserProfile();
            }
          } catch (error) {
            console.error("Error loading user data:", error);
            showToast("Error loading user data. Please try again.", 5000);
          }
        } else {
          currentUser = null;
          cringeCoin = 0;
          streak = 0;
          
          // Update UI
          document.getElementById('sidebarProfile').style.display = 'none';
          document.getElementById('sidebarLogout').style.display = 'none';
          document.getElementById('menuLogin').style.display = 'block';
          updateCringeLevel();
          updateStats();
        }
      });
    }
    
    // Load user profile data
    async function loadUserProfile() {
      if (!db || !currentUser) return;
      
      try {
        const userDoc = await db.collection('users').doc(currentUser.uid).get();
        if (userDoc.exists) {
          const data = userDoc.data();
          cringeCoin = data.cringeCoin || 0;
          streak = data.streak || 0;
          
          updateStats();
          updateCringeLevel();
        }
      } catch (error) {
        console.error("Error loading user profile:", error);
        showToast("Error loading profile. Please refresh.", 5000);
      }
    }
    
    // Update stats panel
    function updateStats() {
      document.getElementById('memesServed').textContent = formatNumber(1265 + loadCount);
      document.getElementById('activeNow').textContent = Math.max(1, Math.min(100, Math.round(Math.random() * 100)));
      document.getElementById('cringeLevel').textContent = streak > 0 ? streak : '0';
    }
    
    // Format large numbers
    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    }
    
    // Render a meme card
    function renderMeme(meme, index) {
      const card = document.createElement('div');
      card.className = 'meme-card';
      card.dataset.id = meme.id;
      
      // Calculate cringe level
      const cringeLevel = Math.min(10, Math.floor((meme.ups || 1000) / 100));
      const level = CRINGE_LEVELS.find(l => cringeLevel <= l.max) || CRINGE_LEVELS[CRINGE_LEVELS.length - 1];
      
      card.innerHTML = `
        <div class="meme-header">
          <span class="meme-source">${meme.source || 'r/unknown'}</span>
          <span class="meme-time">${meme.time || '2d ago'}</span>
        </div>
        <div class="meme-title">${meme.title || 'Cringe Meme'}</div>
        <img class="meme-image" src="${meme.url}" data-src="${meme.url}" loading="lazy" alt="meme">
        <div class="interaction-panel">
          <button class="vote-btn">
            <i class="fas fa-arrow-up"></i> ${formatNumber(meme.ups || 4800)}
          </button>
          <button class="vote-btn">
            <i class="fas fa-arrow-down"></i> ${formatNumber(meme.downs || 221)}
          </button>
          <div class="cringe-level">
            <i class="fas fa-heart"></i>
            CRINGE LEVEL<br>${cringeLevel}/10
          </div>
        </div>
      `;
      
      // Add hover effect
      card.addEventListener('mouseenter', () => {
        card.querySelector('.meme-image').style.transform = 'scale(1.02)';
      });
      
      card.addEventListener('mouseleave', () => {
        card.querySelector('.meme-image').style.transform = 'scale(1)';
      });
      
      // Add interaction events
      card.querySelector('.vote-btn:first-child').addEventListener('click', () => {
        if (currentUser) {
          showToast('Upvoted! +1 CringeCoin', 2000);
          updateCringeCoin(1);
        } else {
          showToast('Please log in to vote', 2000);
          document.getElementById('authModal').style.display = 'flex';
        }
      });
      
      card.querySelector('.vote-btn:last-child').addEventListener('click', () => {
        if (currentUser) {
          showToast('Downvoted!', 2000);
          updateCringeCoin(-1);
        } else {
          showToast('Please log in to vote', 2000);
          document.getElementById('authModal').style.display = 'flex';
        }
      });
      
      // Add to feed
      feed.appendChild(card);
      
      // Image loading
      const img = card.querySelector('.meme-image');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            img.src = img.dataset.src;
            img.classList.add('loaded');
            observer.disconnect();
          }
        });
        observer.observe(img);
      } else {
        img.src = img.dataset.src;
        img.classList.add('loaded');
      }
      
      // Add 3D effect
      card.style.transform = `perspective(1000px) rotateY(${Math.random() * 5 - 2.5}deg)`;
      
      return true;
    }
    
    // Load meme content
    async function loadContent() {
      if (isLoading) return;
      isLoading = true;
      
      try {
        // Simulate loading
        if (loadCount === 0) {
          const skeletonCount = Math.min(5, Math.floor(window.innerHeight / 400));
          for (let i = 0; i < skeletonCount; i++) {
            const skeleton = document.createElement('div');
            skeleton.className = 'skeleton';
            skeleton.style.height = `${Math.random() * 300 + 300}px`;
            feed.appendChild(skeleton);
          }
        }
        
        // Load real content
        const shuffled = [...MEME_CATEGORIES].sort(() => 0.5 - Math.random());
        for (const url of shuffled) {
          try {
            const response = await fetch(`${url}?_=${Date.now()}`, {
              mode: 'cors',
              cache: 'no-store'
            });
            
            if (response.ok) {
              const data = await response.json();
              if (data && data.url && !seenUrls.has(data.url)) {
                seenUrls.add(data.url);
                
                // Create meme object
                const meme = {
                  id: Date.now(),
                  title: data.title || 'Cringe Meme',
                  url: data.url,
                  source: data.subreddit ? `r/${data.subreddit}` : 'External',
                  time: '2d ago',
                  ups: data.ups || Math.floor(Math.random() * 10000) + 1000,
                  downs: Math.floor(Math.random() * 500) + 100,
                  isUserGenerated: false
                };
                
                renderMeme(meme, loadCount);
                loadCount++;
                
                // Stop after 3 memes
                if (loadCount >= 3) break;
              }
            }
          } catch (error) {
            console.error("Error fetching meme:", error);
            continue;
          }
        }
        
        // Update stats
        updateStats();
        
      } catch (error) {
        console.error("Error loading content:", error);
        showToast("Error loading memes. Please check your connection.", 5000);
      } finally {
        isLoading = false;
      }
    }
    
    // Update CringeCoin
    async function updateCringeCoin(amount) {
      if (!currentUser || amount === 0) return;
      
      try {
        await db.collection('users').doc(currentUser.uid).update({
          cringeCoin: firebase.firestore.FieldValue.increment(amount)
        });
        
        cringeCoin += amount;
        updateStats();
        
        // Daily quest check
        if (amount === 1) {
          const questKey = `quest_voted_${new Date().toDateString()}`;
          if (!localStorage.getItem(questKey)) {
            localStorage.setItem(questKey, 'completed');
            await updateCringeCoin(5);
            showToast("Daily vote quest completed! +5 CringeCoin", 3000);
          }
        }
      } catch (error) {
        console.error("Error updating CringeCoin:", error);
        showToast("Failed to update CringeCoin. Please try again.", 3000);
      }
    }
    
    // Initialize app
    function initApp() {
      feed = document.getElementById('feed');
      
      // Initialize 3D background
      init3DBackground();
      
      // Initialize Firebase
      initFirebase();
      
      // Event listeners
      document.getElementById('hamburgerBtn').addEventListener('click', toggleSidebar);
      document.getElementById('closeSidebar').addEventListener('click', toggleSidebar);
      document.getElementById('floatingBtn').addEventListener('click', () => {
        feed.scrollTo({ top: 0, behavior: 'smooth' });
      });
      
      // Auth modal
      document.getElementById('authSubmit').addEventListener('click', handleAuth);
      document.getElementById('closeAuth').addEventListener('click', () => {
        document.getElementById('authModal').style.display = 'none';
      });
      
      // Sidebar items
      document.getElementById('sidebarProfile').addEventListener('click', () => {
        toggleSidebar();
        showToast("Profile feature coming soon", 3000);
      });
      
      document.getElementById('sidebarMemes').addEventListener('click', () => {
        toggleSidebar();
        showToast("My Memes feature coming soon", 3000);
      });
      
      document.getElementById('sidebarCollections').addEventListener('click', () => {
        toggleSidebar();
        showToast("Collections feature coming soon", 3000);
      });
      
      document.getElementById('sidebarQuests').addEventListener('click', () => {
        toggleSidebar();
        showToast("Daily quests coming soon", 3000);
      });
      
      document.getElementById('sidebarChat').addEventListener('click', () => {
        toggleSidebar();
        showToast("CringeChat coming soon", 3000);
      });
      
      document.getElementById('sidebarSettings').addEventListener('click', () => {
        toggleSidebar();
        showToast("Settings coming soon", 3000);
      });
      
      document.getElementById('sidebarLogout').addEventListener('click', async () => {
        try {
          await auth.signOut();
          toggleSidebar();
          showToast("Logged out successfully", 2000);
        } catch (error) {
          console.error("Logout error:", error);
          showToast("Failed to log out. Please try again.", 3000);
        }
      });
      
      // Handle outside clicks
      document.addEventListener('click', (e) => {
        if (isSidebarOpen && !e.target.closest('#sidebar') && !e.target.closest('.hamburger-menu')) {
          toggleSidebar();
        }
      });
      
      // Load initial content
      loadContent();
      
      // Infinite scroll
      let scrollTimer;
      feed.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const { scrollTop, scrollHeight, clientHeight } = feed;
          if (scrollHeight - scrollTop <= clientHeight + 150 && !isLoading) {
            loadContent();
          }
          
          // Update scroll indicator
          const scrollPercentage = (scrollTop / (scrollHeight - clientHeight)) * 100;
          const dots = document.querySelectorAll('.scroll-dot');
          dots.forEach((dot, i) => {
            if (i === Math.floor(scrollPercentage / 33)) {
              dot.classList.add('active');
            } else {
              dot.classList.remove('active');
            }
          });
        }, 200);
      });
      
      // Handle window resize
      window.addEventListener('resize', () => {
        if (renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      });
    }
    
    // Toggle sidebar
    function toggleSidebar() {
      isSidebarOpen = !isSidebarOpen;
      document.getElementById('hamburgerBtn').classList.toggle('active', isSidebarOpen);
      document.getElementById('sidebar').classList.toggle('open', isSidebarOpen);
      document.body.style.overflow = isSidebarOpen ? 'hidden' : 'auto';
    }
    
    // Handle authentication
    async function handleAuth(e) {
      e.preventDefault();
      
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      
      if (!email || !password) {
        showToast("Please fill in all fields", 2000);
        return;
      }
      
      try {
        await auth.signInWithEmailAndPassword(email, password);
        document.getElementById('authModal').style.display = 'none';
        showToast("Successfully logged in!", 2000);
      } catch (error) {
        let message = "Login failed. Please check your credentials.";
        
        if (error.code === "auth/invalid-email") {
          message = "Invalid email format";
        } else if (error.code === "auth/user-not-found") {
          message = "No user found with this email";
        } else if (error.code === "auth/wrong-password") {
          message = "Incorrect password";
        }
        
        showToast(message, 3000);
      }
    }
    
    // Initialize app after DOM loads
    document.addEventListener('DOMContentLoaded', () => {
      initApp();
    });
  </script>
</body>
</html>
