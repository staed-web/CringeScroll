  <style>
    :root {
      --bg-primary: #090a14;
      --bg-secondary: #111322;
      --bg-tertiary: #1a1d30;
      --text-primary: #f0f2ff;
      --text-secondary: #a7abce;
      --accent-purple: #8c52ff;
      --accent-blue: #4cc9f0;
      --accent-cyan: #4361ee;
      --accent-teal: #3ab09e;
      --accent-pink: #ff6b9d;
      --border-radius-sm: 8px;
      --border-radius-md: 16px;
      --border-radius-lg: 24px;
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      --blur-sm: blur(4px);
      --blur-md: blur(12px);
      
      /* 3D depth variables */
      --depth-1: 0;
      --depth-2: 2px;
      --depth-3: 5px;
      --depth-4: 10px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(72, 48, 168, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(43, 95, 151, 0.1) 0%, transparent 20%);
      color: var(--text-primary);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(140, 82, 255, 0.05) 0%, transparent 25%),
        radial-gradient(circle at 80% 60%, rgba(76, 201, 240, 0.05) 0%, transparent 25%);
      z-index: -2;
      pointer-events: none;
    }
    
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(9, 10, 20, 0.9) 0%,
        rgba(9, 10, 20, 0.7) 100%
      );
      z-index: -1;
      pointer-events: none;
    }
    
    #app {
      display: flex;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }
    
    /* 3D Depth Layering System */
    .depth-1 {
      transform: translateZ(var(--depth-1));
    }
    
    .depth-2 {
      transform: translateZ(var(--depth-2));
      box-shadow: var(--shadow-md);
    }
    
    .depth-3 {
      transform: translateZ(var(--depth-3));
      box-shadow: var(--shadow-lg);
    }
    
    .depth-4 {
      transform: translateZ(var(--depth-4));
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    }
    
    /* Glassmorphism elements */
    .glass {
      background: rgba(26, 29, 48, 0.6);
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--border-radius-md);
    }
    
    .glass-strong {
      background: rgba(26, 29, 48, 0.8);
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* Sidebar Navigation */
    #sidebar {
      width: 72px;
      background: var(--bg-secondary);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      z-index: 100;
      transition: var(--transition);
      overflow: hidden;
    }
    
    #sidebar:hover {
      width: 280px;
    }
    
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      transition: var(--transition);
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(140, 82, 255, 0.4);
      transition: var(--transition);
      transform-style: preserve-3d;
    }
    
    .logo-icon::before {
      content: "✨";
      font-size: 18px;
      transform: translateZ(5px);
    }
    
    .logo-text {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transition: var(--transition);
    }
    
    #sidebar:hover .logo-text {
      opacity: 1;
    }
    
    #sidebar:hover .logo-icon {
      transform: rotate(0deg) scale(1.1);
    }
    
    .nav-item {
      width: 100%;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--border-radius-sm);
      margin: 4px 0;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    
    .nav-item:hover, .nav-item.active {
      color: var(--text-primary);
      background: rgba(140, 82, 255, 0.1);
    }
    
    .nav-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--accent-purple);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: var(--transition);
    }
    
    .nav-item:hover::before, .nav-item.active::before {
      transform: scaleY(1);
    }
    
    .nav-item i {
      font-size: 20px;
      width: 24px;
      text-align: center;
    }
    
    .nav-text {
      opacity: 0;
      transform: translateX(-10px);
      transition: var(--transition);
    }
    
    #sidebar:hover .nav-text {
      opacity: 1;
      transform: translateX(0);
    }
    
    .nav-divider {
      height: 1px;
      width: 80%;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px auto;
    }
    
    .user-profile {
      margin-top: auto;
      padding: 12px 16px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: var(--border-radius-sm);
      transition: var(--transition);
    }
    
    .user-profile:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }
    
    .user-info {
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateX(-10px);
      transition: var(--transition);
    }
    
    #sidebar:hover .user-info {
      opacity: 1;
      transform: translateX(0);
    }
    
    .user-name {
      font-weight: 500;
      font-size: 14px;
    }
    
    .user-coin {
      color: var(--accent-teal);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* Main Content Area */
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    
    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(17, 19, 34, 0.8);
      backdrop-filter: var(--blur-sm);
      -webkit-backdrop-filter: var(--blur-sm);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 90;
      height: 64px;
    }
    
    .search-container {
      position: relative;
      max-width: 500px;
      width: 100%;
    }
    
    .search-input {
      width: 100%;
      padding: 12px 20px 12px 40px;
      background: rgba(26, 29, 48, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px;
      color: var(--text-primary);
      font-size: 16px;
      transition: var(--transition);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(140, 82, 255, 0.3);
    }
    
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }
    
    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .action-btn {
      background: rgba(26, 29, 48, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    
    .action-btn:hover {
      background: rgba(140, 82, 255, 0.2);
      transform: translateY(-2px);
    }
    
    .action-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
      transform: scale(0);
      transition: transform 0.5s ease;
    }
    
    .action-btn:hover::before {
      transform: scale(1);
    }
    
    .action-btn.active {
      background: rgba(140, 82, 255, 0.3);
      border-color: var(--accent-purple);
    }
    
    .coin-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(68, 184, 161, 0.2);
      border: 1px solid rgba(68, 184, 161, 0.3);
      padding: 8px 16px;
      border-radius: 50px;
      font-weight: 600;
      color: var(--accent-teal);
    }
    
    /* Content Area with Tabs */
    #content-area {
      flex: 1;
      overflow: hidden;
      display: flex;
      position: relative;
    }
    
    /* Tab Navigation */
    .tab-nav {
      width: 80px;
      background: rgba(17, 19, 34, 0.8);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      z-index: 80;
    }
    
    .tab-item {
      width: 48px;
      height: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      transition: var(--transition);
    }
    
    .tab-item i {
      font-size: 20px;
      margin-bottom: 4px;
    }
    
    .tab-item span {
      font-size: 10px;
      opacity: 0;
    }
    
    .tab-item:hover, .tab-item.active {
      background: rgba(140, 82, 255, 0.2);
    }
    
    .tab-item.active::after {
      content: '';
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 32px;
      background: var(--accent-purple);
      border-radius: 2px;
    }
    
    /* Tab Content */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }
    
    /* Meme Card with 3D effects */
    .meme-card {
      background: var(--bg-tertiary);
      border-radius: var(--border-radius-md);
      overflow: hidden;
      margin-bottom: 24px;
      transition: var(--transition);
      position: relative;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: pointer;
    }
    
    .meme-card:hover {
      transform: translateY(-4px) translateZ(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    
    .meme-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(140, 82, 255, 0.1), transparent);
      opacity: 0;
      transition: var(--transition);
      z-index: 1;
    }
    
    .meme-card:hover::before {
      opacity: 1;
    }
    
    .meme-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      position: relative;
      z-index: 2;
    }
    
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .user-avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }
    
    .user-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .username {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-primary);
    }
    
    .timestamp {
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    .meme-actions {
      display: flex;
      gap: 8px;
    }
    
    .action-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 16px;
      transition: var(--transition);
      cursor: pointer;
    }
    
    .action-icon:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.08);
    }
    
    .meme-content {
      padding: 0 16px 16px;
      position: relative;
      z-index: 2;
    }
    
    .meme-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent-cyan);
      line-height: 1.4;
    }
    
    .meme-image-container {
      position: relative;
      border-radius: var(--border-radius-md);
      overflow: hidden;
      margin-bottom: 16px;
      aspect-ratio: 16/9;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .meme-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: var(--transition);
    }
    
    .meme-image.placeholder {
      opacity: 0.5;
    }
    
    .meme-image.loaded {
      opacity: 1;
    }
    
    .meme-image-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        linear-gradient(135deg, 
          rgba(255, 255, 255, 0.05) 0%, 
          rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
    }
    
    .meme-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 12px;
    }
    
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    
    .stat-icon {
      color: var(--accent-teal);
    }
    
    .meme-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    
    .footer-btn {
      padding: 6px 12px;
      border-radius: var(--border-radius-sm);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .btn-primary {
      background: rgba(140, 82, 255, 0.2);
      color: var(--accent-purple);
      border: 1px solid rgba(140, 82, 255, 0.3);
    }
    
    .btn-primary:hover {
      background: rgba(140, 82, 255, 0.3);
    }
    
    .btn-secondary {
      background: rgba(68, 184, 161, 0.2);
      color: var(--accent-teal);
      border: 1px solid rgba(68, 184, 161, 0.3);
    }
    
    .btn-secondary:hover {
      background: rgba(68, 184, 161, 0.3);
    }
    
    /* 3D Floating Elements */
    .floating-element {
      position: absolute;
      pointer-events: none;
      z-index: -1;
      animation: float 15s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-20px) rotate(5deg); }
      50% { transform: translateY(10px) rotate(10deg); }
      75% { transform: translateY(-10px) rotate(5deg); }
    }
    
    /* Loading States */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 40px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(140, 82, 255, 0.2);
      border-top: 3px solid var(--accent-purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .skeleton {
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--border-radius-sm);
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* Error States */
    .error-container {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }
    
    .error-icon {
      font-size: 48px;
      color: #ff6b6b;
      margin-bottom: 16px;
    }
    
    /* Modals & Panels */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 10, 20, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }
    
    .modal.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-content {
      background: var(--bg-tertiary);
      border-radius: var(--border-radius-lg);
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      transform: translateY(20px);
      opacity: 0;
      transition: var(--transition);
      box-shadow: var(--shadow-lg);

    .modal.active .modal-content {
      transform: translateY(0);
      opacity: 1;
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);

    .modal-title {
      font-size: 20px;
      font-weight: 700;
    }
    
    .close-modal {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .close-modal:hover {
      color: var(--text-primary);
    }
    
    .modal-body {
      padding: 20px;
    }
    
    /* Forms */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: var(--text-primary);
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(26, 29, 48, 0.7);

      transition: var(--transition);

    .form-input:focus {

    .form-btn {

    .btn-purple {

    .btn-purple:hover {
      background: #7a45e5;

    /* Notifications */
    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 16px 24px;
      border-radius: var(--border-radius-md);
      color: white;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      transform: translateX(300px);
      opacity: 0;
      transition: var(--transition);
      z-index: 999;
      max-width: 300px;

    .notification.show {
      transform: translateX(0);
      opacity: 1;
    }
    
    .notification.success {

    }
    
    .notification.error {
      background: linear-gradient(135deg, #ff6b6b, #e55a5a);
    }
    
    /* 3D Gradient Animations */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    
    .gradient-text {
      background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan), var(--accent-teal), var(--accent-blue));
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 8s ease infinite;

    /* Floating particles */

      pointer-events: none;

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      #sidebar {

    /* Custom scrollbar */

    /* 3D Button Animations */

    .btn-3d::before {

    /* Deep depth shadow */

    <div class="floating-element" style="bottom: 30%; left: 20%; width: 100px; height: 100px; background: radial-gradient(circle, rgba(68, 184, 161, 0.2), transparent); border-radius: 50%; animation-delay: 4s;"></div>

  <script>
    // ===== CORE ENGINE v7.0 - 3D IMMERSIVE EXPERIENCE =====
    console.log("CringeVerse v7.0 initializing...");
    
    // Global state
    let db = null;
    let auth = null;
    let currentUser = null;
    let cringeCoin = 0;
    let currentTab = 'hot';
    let feedContent = null;
    let isLoading = false;
    let loadCount = 0;
    const seenUrls = new Set();
    const BUFFER_HEIGHT = 300;
    
    // MEME SOURCES - LOCAL BACKUP WITH NO CORS
    const MEME_SOURCES = [
      'https://jsonplaceholder.typicode.com/photos?_limit=5',
      'https://picsum.photos/v2/list?page=1&limit=5',
      {
        local: true,
        memes: [
          { id: 'local1', url: 'https://picsum.photos/600/400?random=1', title: 'When the code finally works', ups: 1200 },
          { id: 'local2', url: 'https://picsum.photos/600/400?random=2', title: 'Debugging in production', ups: 2400 },
          { id: 'local3', url: 'https://picsum.photos/600/400?random=3', title: 'My code vs Stack Overflow code', ups: 3100 }
        ]
      }
    ];

    // Initialize Firebase after DOM loads
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        console.log("Initializing Firebase...");
        await initFirebase();
        feedContent = document.getElementById('feed-content');
        attachEventListeners();
        loadFeed();
        initParticles();
        console.log("CringeVerse v7.0 fully loaded!");
      } catch (error) {
        console.error("Initialization failed:", error);
        showError("Failed to initialize the app. Please refresh.");
      }
    });

    async function initFirebase() {
      return new Promise((resolve, reject) => {
        // Wait for Firebase to be fully loaded
        const checkFirebase = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
            clearInterval(checkFirebase);
            
            try {
              // Initialize Firebase if not already initialized
              if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
              }
              
              db = firebase.firestore();
              auth = firebase.auth();
              
              // Set up auth state listener
              auth.onAuthStateChanged(async (user) => {
                await handleAuthStateChange(user);
              });
              
              console.log("Firebase initialized successfully");
              resolve();
            } catch (error) {
              console.error("Firebase initialization error:", error);
              reject(error);
            }
          }
        }, 100);
        
        // Timeout after 5 seconds
        setTimeout(() => {
          clearInterval(checkFirebase);
          if (typeof firebase === 'undefined') {
            reject(new Error("Firebase failed to load"));
          }
        }, 5000);
      });
    }

    async function handleAuthStateChange(user) {
      if (user) {
        try {
          const userDoc = await db.collection('users').doc(user.uid).get();
          if (userDoc.exists) {
            currentUser = {
              uid: user.uid,
              email: user.email,
              username: userDoc.data().username,
              avatar: userDoc.data().avatar || 'U'
            };
            cringeCoin = userDoc.data().cringeCoin || 0;
            updateUI();
          } else {
            // Create new user document
            await db.collection('users').doc(user.uid).set({
              email: user.email,
              username: `user_${Math.random().toString(36).substr(2, 8)}`,
              cringeCoin: 0,
              streak: 0,
              lastActive: firebase.firestore.FieldValue.serverTimestamp(),
              avatar: 'U',
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            // This will trigger another auth state change
          }
        } catch (error) {
          console.error("User document error:", error);
          showError("Failed to load user profile");
        }
      } else {
        currentUser = null;
        cringeCoin = 0;
        updateUI();
      }
    }

    function updateUI() {
      // Update coin display
      document.getElementById('coin-count').textContent = cringeCoin;
      
      // Update user profile in sidebar
      const userAvatar = document.querySelector('.user-avatar');
      const userName = document.querySelector('.user-name');
      const userCoin = document.querySelector('.user-coin');
      
      if (currentUser) {
        userAvatar.textContent = currentUser.avatar;
        userName.textContent = currentUser.username;
        userCoin.textContent = `💀 ${cringeCoin} CringeCoin`;
      } else {
        userAvatar.textContent = 'G';
        userName.textContent = 'Guest';
        userCoin.textContent = '💀 0 CringeCoin';
      }
    }

    function attachEventListeners() {
      // Sidebar navigation
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          
          const tab = item.dataset.tab;
          switchTab(tab);
        });
      });
      
      // Top bar actions
      document.getElementById('create-btn').addEventListener('click', () => {
        document.getElementById('create-modal').classList.add('active');
      });
      
      document.querySelector('.close-modal').addEventListener('click', () => {
        document.getElementById('create-modal').classList.remove('active');
      });
      
      document.getElementById('post-meme-btn').addEventListener('click', createMeme);
      
      // Tab navigation in content area
      document.querySelectorAll('.tab-item').forEach((item, index) => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          
          const tabs = ['hot', 'fresh', 'crowned', 'mymemes'];
          currentTab = tabs[index];
          loadFeed(true);
        });
      });
      
      // Window resize handler
      window.addEventListener('resize', () => {
        // Re-adjust layout on resize
      });
    }

    function switchTab(tab) {
      console.log(`Switching to tab: ${tab}`);
      
      if (tab === 'explore') {
        // Default to hot tab
        currentTab = 'hot';
        document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
        document.querySelectorAll('.tab-item')[0].classList.add('active');
        loadFeed(true);
      } else if (tab === 'profile') {
        if (!currentUser) {
          showNotification("Please log in to view your profile", 'error');
          return;
        }
        // In a full app, this would navigate to profile page
        showNotification(`Profile page for ${currentUser.username}`, 'success');
      } else if (tab === 'leaderboard') {
        // Load leaderboard data
        loadLeaderboard();
      } else {
        // Standard tabs that are already handled by the bottom tab navigation
        // This is just for sidebar navigation consistency
      }
    }

    async function loadFeed(clear = false) {
      if (isLoading) return;
      
      isLoading = true;
      
      if (clear) {
        loadCount = 0;
        seenUrls.clear();
        feedContent.innerHTML = '';
      }
      
      if (loadCount === 0) {
        showLoading();
      }
      
      try {
        let memes = [];
        
        if (currentTab === 'mymemes' && currentUser) {
          // Load user's memes from Firestore
          memes = await fetchUserMemes(5);
        } else {
          // Load default memes
          memes = await fetchMemes(3);
        }
        
        // Render memes
        memes.forEach(meme => {
          if (!seenUrls.has(meme.id)) {
            seenUrls.add(meme.id);
            renderMeme(meme);
            loadCount++;
          }
        });
        
        // Show empty state if no memes
        if (loadCount === 0 && memes.length === 0) {
          showEmptyState();
        }
        
      } catch (error) {
        console.error("Feed loading error:", error);
        showError("Failed to load memes. Please try again.");
      } finally {
        isLoading = false;
      }
    }

    function showLoading() {
      feedContent.innerHTML = `
        <div class="loading-container">
          <div class="loading-spinner"></div>
        </div>
      `;
    }

    function showEmptyState() {
      feedContent.innerHTML = `
        <div class="error-container">
          <div class="error-icon">😮</div>
          <h3>No memes found</h3>
          <p>Try refreshing or check back later</p>
          <button class="form-btn btn-purple btn-3d" onclick="loadFeed(true)" style="margin-top: 20px;">
            Refresh Feed
          </button>
        </div>
      `;
    }

    function showError(message) {
      feedContent.innerHTML = `
        <div class="error-container">
          <div class="error-icon">❌</div>
          <h3>Error</h3>
          <p>${message}</p>
          <button class="form-btn btn-purple btn-3d" onclick="loadFeed(true)" style="margin-top: 20px;">
            Try Again
          </button>
        </div>
      `;
    }

    async function fetchMemes(count) {
      return new Promise((resolve) => {
        setTimeout(() => {
          // Use local memes for demo
          const localSource = MEME_SOURCES.find(source => source.local);
          if (localSource) {
            // Shuffle and take requested count
            const shuffled = [...localSource.memes].sort(() => 0.5 - Math.random());
            resolve(shuffled.slice(0, count));
          } else {
            resolve([]);
          }
        }, 800); // Simulate network delay
      });
    }

    async function fetchUserMemes(count) {
      // This would fetch from Firestore in a real app
      return new Promise((resolve) => {
        setTimeout(() => {
          resolve([
            { 
              id: 'user1',

      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m";
      return Math.floor(seconds) + "s";

    async function initFirebase() {
      return new Promise((resolve, reject) => {
        // Wait for Firebase to be fully loaded
        const checkFirebase = setInterval(() => {
          if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
            clearInterval(checkFirebase);
            
            try {
              // Initialize Firebase if not already initialized
              if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
              }
              
              db = firebase.firestore();
              auth = firebase.auth();
              
              // Set up auth state listener
              auth.onAuthStateChanged(async (user) => {
                await handleAuthStateChange(user);
              });
              
              console.log("Firebase initialized successfully");
              resolve();
            } catch (error) {
              console.error("Firebase initialization error:", error);
              reject(error);
            }
          }
        }, 100);
        
        // Timeout after 5 seconds
        setTimeout(() => {
          clearInterval(checkFirebase);
          if (typeof firebase === 'undefined') {
            reject(new Error("Firebase failed to load"));
          }
        }, 5000);
      });

    function formatTimeAgo(date) {
      if (!date) return 'just now';
      
      const seconds = Math.floor((new Date() - date) / 1000);
      
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y";
      
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo";
      
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d";
      
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h";
      
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m";
      
      return Math.floor(seconds) + "s";
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => 
        ({'&': '&amp;', '<': '<', '>': '>', '"': '&quot;', "'": '&#039;'}[m])
      );
    }

    async function createMeme() {
      const title = document.getElementById('meme-title').value.trim();
      const imageUrl = document.getElementById('image-url').value.trim();
      const topText = document.getElementById('top-text').value.trim();
      const bottomText = document.getElementById('bottom-text').value.trim();
      const isAnonymous = document.getElementById('anonymous-mode').checked;
      
      if (!imageUrl) {
        showNotification("Image URL is required", 'error');
        return;
      }
      
      if (!title) {
        showNotification("Title is required", 'error');
        return;
      }
      
      // Show loading state
      const postBtn = document.getElementById('post-meme-btn');
      const originalText = postBtn.innerHTML;
      postBtn.innerHTML = '<div class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></div>';
      postBtn.disabled = true;
      
      try {
        if (!currentUser || !db) {
          throw new Error("Not authenticated");
        }
        
        const memeId = `meme_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
        const fullTitle = `${topText ? `${topText} ` : ''}${title}${bottomText ? ` ${bottomText}` : ''}`.trim();
        
        const memeData = {
          id: memeId,
          url: imageUrl,
          title: fullTitle,

          bottomText: bottomText,
          ups: 0,

          username: currentUser.username,
          avatar: currentUser.avatar,
          isAnonymous: isAnonymous,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        
        // Save to Firestore
        await db.collection('memes').doc(memeId).set(memeData);
        
        // Update user stats
        await db.collection('users').doc(currentUser.uid).update({
          cringeCoin: firebase.firestore.FieldValue.increment(10),
          postCount: firebase.firestore.FieldValue.increment(1)
        });
        
        // Update local state
        cringeCoin += 10;
        updateUI();
        
        showNotification("Meme created successfully! +10 CringeCoin", 'success');
        
        // Close modal
        document.getElementById('create-modal').classList.remove('active');
        
        // Clear form
        document.getElementById('meme-title').value = '';
        document.getElementById('image-url').value = '';
        document.getElementById('top-text').value = '';
        document.getElementById('bottom-text').value = '';
        document.getElementById('anonymous-mode').checked = false;
        
        // Add to feed if on my memes tab
        if (currentTab === 'mymemes') {
          renderMeme({
            ...memeData,

            ups: 0
          });

        updateQuestProgress('post', 1);

        console.error("Meme creation error:", error);
        showNotification("Failed to create meme. Please try again.", 'error');
      } finally {

        postBtn.innerHTML = originalText;

    function tipMeme(memeId, amount) {
      if (!currentUser) {
        showNotification("Please log in to tip", 'error');
        return;
      }
      
      if (cringeCoin < amount) {
        showNotification(`Not enough CringeCoin. Need ${amount} CC.`, 'error');
        return;
      }
      
      // Show confirmation
      if (!confirm(`Tip ${amount} CringeCoin to this meme creator?`)) {
        return;
      }
      
      // Update balance
      cringeCoin -= amount;
      updateUI();
      
      showNotification(`Tipped ${amount} CringeCoin!`, 'success');
      
      // Visual feedback
      const card = document.querySelector(`.meme-card[data-id="${memeId}"]`);
      if (card) {
        const float = document.createElement('div');
        float.textContent = `+${amount} 💀`;
        float.style.cssText = `
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: var(--accent-teal);
          font-weight: bold;
          font-size: 24px;
          pointer-events: none;
          z-index: 100;
          animation: floatUp 1s forwards;
        `;
        card.appendChild(float);
        
        float.addEventListener('animationend', () => {
          float.remove();
        });
      }
      
      // Update quest progress
      updateQuestProgress('tip', amount);
    }

    function saveMeme(memeId) {
      if (!currentUser) {
        showNotification("Please log in to save memes", 'error');
        return;
      }
      
      // Get user's collections
      const collections = currentUser.collections || {};
      const collectionNames = Object.keys(collections);
      
      if (collectionNames.length === 0) {
        // Create default collection
        collections['Favorites'] = [];
        collectionNames.push('Favorites');
      }
      
      // Save to first collection
      const firstCollection = collectionNames[0];
      if (!collections[firstCollection].includes(memeId)) {
        collections[firstCollection].push(memeId);
        
        // Update user document
        db.collection('users').doc(currentUser.uid).update({
          collections: collections
        }).then(() => {
          showNotification(`Saved to "${firstCollection}"!`, 'success');
          
          // Update local state
          currentUser.collections = collections;
        }).catch(error => {
          console.error("Save failed:", error);
          showNotification("Failed to save meme", 'error');
        });
      } else {
        showNotification("Already saved to your collections", 'success');
      }
    }

    function shareMeme(meme) {
      const shareUrl = `${window.location.origin}/meme/${meme.id}`;
      const shareText = `Check out this meme: ${meme.title} - CringeVerse`;
      
      if (navigator.share) {
        navigator.share({
          title: meme.title,
          text: shareText,
          url: shareUrl
        }).then(() => {
          showNotification("Meme shared successfully!", 'success');
        }).catch(() => {
          // Fallback to copy
          copyToClipboard(shareUrl);
        });
      } else {
        copyToClipboard(shareUrl);
      }
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        showNotification("Link copied to clipboard!", 'success');
      }).catch(() => {
        showNotification("Failed to copy link", 'error');
      });
    }

    async function addReaction(memeId, emoji, memeData) {
      if (!currentUser || !db) {
        showNotification("Please log in to react", 'error');
        return;
      }
      
      try {
        // Check if user already reacted
        const reactionDoc = await db.collection('reactions').doc(`${memeId}_${currentUser.uid}`).get();
        
        if (reactionDoc.exists) {
          showNotification("You already reacted to this meme", 'error');
          return;
        }
        
        // Add reaction
        await db.collection('reactions').doc(`${memeId}_${currentUser.uid}`).set({
          memeId: memeId,
          userId: currentUser.uid,
          emoji: emoji,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        
        // Update meme stats
        await db.collection('memes').doc(memeId).update({
          ups: firebase.firestore.FieldValue.increment(1)
        });
        
        // Update user stats
        await db.collection('users').doc(currentUser.uid).update({
          cringeCoin: firebase.firestore.FieldValue.increment(1),
          reactionCount: firebase.firestore.FieldValue.increment(1)
        });
        
        // Update local state
        cringeCoin += 1;
        updateUI();
        
        showNotification(`Reacted with ${emoji}! +1 CringeCoin`, 'success');
        
        // Update quest progress
        const questKey = `quest_react_${new Date().toDateString()}`;
        if (!localStorage.getItem(questKey)) {
          localStorage.setItem(questKey, 'started');
          const currentCount = parseInt(localStorage.getItem(`${questKey}_count`) || '0');
          localStorage.setItem(`${questKey}_count`, currentCount + 1);
          
          if (currentCount + 1 >= 5) {
            // Complete quest
            await db.collection('users').doc(currentUser.uid).update({
              cringeCoin: firebase.firestore.FieldValue.increment(5)
            });
            cringeCoin += 5;
            updateUI();
            localStorage.removeItem(questKey);
            localStorage.removeItem(`${questKey}_count`);
            showNotification("Daily reaction quest completed! +5 CringeCoin", 'success');
          }
        }
        
      } catch (error) {
        console.error("Reaction failed:", error);
        showNotification("Failed to add reaction", 'error');
      }
    }

    function createNewCollection() {
      const name = prompt("Enter collection name:");
      if (!name || name.trim() === '') return;
      
      const collectionName = name.trim();
      
      if (!currentUser || !db) {
        showNotification("Please log in to create collections", 'error');
        return;
      }
      
      try {
        const userDoc = db.collection('users').doc(currentUser.uid);
        userDoc.update({
          collections: firebase.firestore.FieldValue.arrayUnion(collectionName)
        }).then(() => {
          showNotification(`Collection "${collectionName}" created!`, 'success');
          loadCollectionsPanel();
        }).catch(error => {
          console.error("Collection creation failed:", error);
          showNotification("Failed to create collection", 'error');
        });
      } catch (error) {
        console.error("Collection creation error:", error);
        showNotification("Failed to create collection", 'error');
      }
    }

        const messageEl = document.createElement('div');
        messageEl.className = 'chat-message';
        messageEl.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <div class="user-avatar-sm" style="width: 28px; height: 28px; font-size: 14px;">${msg.user.charAt(0)}</div>
            <div style="font-weight: bold; color: var(--accent-purple);">${msg.user}</div>
            <div style="color: var(--text-secondary); font-size: 12px;">${msg.time}</div>
          </div>
          <div style="margin-left: 36px; line-height: 1.4;">${escapeHtml(msg.text)}</div>
        `;
        chatMessages.appendChild(messageEl);
      });
      
      // Scroll to bottom
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      if (!input) return;
      
      const text = input.value.trim();
      if (!text) return;
      
      if (!currentUser) {
        showNotification("Please log in to chat", 'error');
        return;
      }
      
      input.value = '';
      
      // Add to chat UI immediately
      const chatMessages = document.getElementById('chat-messages');
      if (chatMessages) {
        const messageEl = document.createElement('div');
        messageEl.className = 'chat-message';
        messageEl.innerHTML = `
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <div class="user-avatar-sm" style="width: 28px; height: 28px; font-size: 14px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));">${currentUser.avatar || currentUser.username.charAt(0)}</div>
            <div style="font-weight: bold; color: var(--accent-purple);">${currentUser.username}</div>
            <div style="color: var(--text-secondary); font-size: 12px;">just now</div>
          </div>
          <div style="margin-left: 36px; line-height: 1.4;">${escapeHtml(text)}</div>
        `;
        chatMessages.appendChild(messageEl);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
      
      showNotification("Message sent!", 'success');
    }

    function updateQuestProgress(questId, increment = 1) {
      if (!currentUser || !db) return;
      
      // This would update the quest progress in Firestore in a real app
      console.log(`Quest progress updated: ${questId} +${increment}`);
      
      // Show notification for completed quests
      if (questId === 'post' || questId === 'react' || questId === 'tip') {
        showNotification(`Quest progress updated for ${questId}!`, 'success');
      }
    }

    function loadUserData() {
      if (!currentUser || !db) return;
      
      db.collection('users').doc(currentUser.uid).get().then(doc => {
        if (doc.exists) {
          const data = doc.data();
          cringeCoin = data.cringeCoin || 0;
          streak = data.streak || 0;
          updateUI();
        }
      }).catch(error => {
        console.error("User data load failed:", error);
      });
    }
  </script>
</body>
</html>
