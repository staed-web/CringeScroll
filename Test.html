<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>CringeScroll</title>

  <link rel="dns-prefetch" href="//i.redd.it">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Fredoka+One&display=swap" rel="stylesheet">
  <!-- Firebase -->
  <script>
    // Firebase initialization
    const firebaseConfig = {
      apiKey: "AIzaSyCu93I__VAq5GuBrUvhvxymejwjrYBM43g",
      authDomain: "cringescroll-prod.firebaseapp.com",
      projectId: "cringescroll-prod",
      storageBucket: "cringescroll-prod.firebasestorage.app",
      messagingSenderId: "802266413389",
      appId: "1:802266413389:web:22a7274e4edc8a0529df04"
    };
    // Load Firebase SDKs synchronously
    const scripts = [
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js',

  <!-- Tilt.js for 3D effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
  <!-- Fabric.js for Meme Editor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --primary: #ff6b6b;
      --secondary: #4ecdc4;
      --background: #1a1a2e;
      --card-bg: #16213e;
      --text: #f8f9fa;
      --border-radius: 24px;
      --shadow: 0 10px 30px rgba(0,0,0,0.3);
      --transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: var(--background);
      color: var(--text);
      font-family: 'Comic Neue', cursive;
      height: 100dvh;
      overflow-x: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: hidden;
      position: relative;
    }
    
    /* Glowing background bubbles */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 107, 107, 0.1);
      animation: float 15s infinite ease-in-out;
      z-index: -1;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      25% { transform: translateY(-20px) translateX(10px); }
      50% { transform: translateY(-10px) translateX(-10px); }
      75% { transform: translateY(-15px) translateX(5px); }
    }
    
    /* App Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 100;
      position: sticky;
      top: 0;
      background: rgba(22, 33, 62, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2px solid var(--secondary);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Fredoka One', cursive;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(255, 107, 107, 0.3);
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
    }
    
    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      align-content: start;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    
    /* 3D Tilt Card */
    .cringe-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
      transform-style: preserve-3d;
      position: relative;
      cursor: pointer;
      height: fit-content;
    }
    
    .cringe-card:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
      z-index: 10;
    }
    
    .card-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed rgba(78, 205, 196, 0.3);
    }
    
    .meme-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.4;
      word-break: break-word;
    }
    
    .meme-type {
      background: rgba(78, 205, 196, 0.2);
      color: var(--secondary);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    
    .meme-image-container {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
    }
    
    .meme-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: var(--transition);
    }
    
    .cringe-card:hover .meme-image {
      transform: scale(1.05);
    }
    
    .card-footer {
      padding: 16px;
    }
    
    .reactions-bar {
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .reaction-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      transition: var(--transition);
    }
    
    .reaction-btn:hover {
      transform: scale(1.2);
      color: var(--secondary);
    }
    
    .reaction-count {
      font-size: 12px;
      font-weight: bold;
      color: var(--secondary);
    }
    
    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }
    
    .action-btn {
      flex: 1;
      padding: 8px;
      border-radius: 12px;
      border: none;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .tip-btn {
      background: var(--primary);
      color: white;
    }
    
    .save-btn {
      background: var(--secondary);
      color: var(--background);
    }
    
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(22, 33, 62, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 2px solid var(--primary);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text);
      text-decoration: none;
      font-size: 12px;
      transition: var(--transition);
    }
    
    .nav-item.active {
      color: var(--secondary);
      transform: translateY(-3px);
    }
    
    .nav-icon {
      font-size: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(78, 205, 196, 0.1);
      transition: var(--transition);
    }
    
    .nav-item.active .nav-icon {
      background: var(--secondary);
      color: var(--background);
      transform: scale(1.1);
    }
    
    /* Modals */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
    }
    
    .modal.active {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-content {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: var(--transition);
    }
    
    .modal.active .modal-content {
      transform: scale(1);
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--secondary);
    }
    
    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--secondary);
    }
    
    .close-modal {
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
      transition: var(--transition);
    }
    
    .close-modal:hover {
      color: var(--primary);
      transform: rotate(90deg);
    }
    
    /* Editor */
    .editor-canvas-container {
      width: 100%;
      height: 400px;
      background: rgba(0,0,0,0.3);
      border-radius: 16px;
      margin: 16px 0;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    }
    
    /* Notifications */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border-left: 4px solid var(--secondary);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transform: translateX(350px);
      transition: var(--transition);
      z-index: 1000;
    }
    
    .notification.show {
      transform: translateX(0);
    }
    
    /* Skeleton Loaders */
    .skeleton-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      height: 450px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    /* Loading Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(78, 205, 196, 0.2);
      border-top: 4px solid var(--secondary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Buttons */
    .btn {
      padding: 12px 24px;
      border-radius: 16px;
      border: none;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-secondary {
      background: var(--secondary);
      color: var(--background);
    }
    
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    
    .btn:active {
      transform: translateY(1px);
    }
    
    /* Form elements */
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: var(--secondary);
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid rgba(78, 205, 196, 0.3);
      background: rgba(0,0,0,0.2);
      color: var(--text);
      font-size: 16px;
      transition: var(--transition);
    }
    
    .form-input:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
    }
    
    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    
    .tab-btn {
      padding: 8px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(78, 205, 196, 0.1);
      color: var(--text);
      font-weight: bold;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    
    .tab-btn.active {
      background: var(--secondary);
      color: var(--background);
    }
    
    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    
    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--secondary);
    }
    
    .empty-title {
      font-size: 20px;
      margin-bottom: 8px;
      color: var(--secondary);
      font-weight: bold;
    }
    
    .empty-text {
      color: rgba(255,255,255,0.6);
      margin-bottom: 20px;
    }
    
    /* User stats */
    .user-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border-radius: 16px;
    }
    
    .stat-item {
      text-align: center;
      flex: 1;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--secondary);
    }
    
    .stat-label {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
    }
    
    /* 3D tilt effect for special elements */
    .tilt-effect {
      transform-style: preserve-3d;
      transition: var(--transition);
    }
    
    @media (max-width: 768px) {
      .content-area {
        grid-template-columns: 1fr;
      }
      
      .logo {
        font-size: 24px;
      }
      
      .user-avatar {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Background bubbles -->
    <div class="bubble" style="width: 150px; height: 150px; top: 10%; left: 5%;"></div>
    <div class="bubble" style="width: 100px; height: 100px; top: 25%; right: 10%;"></div>
    <div class="bubble" style="width: 200px; height: 200px; bottom: 15%; left: 15%;"></div>
    <div class="bubble" style="width: 80px; height: 80px; bottom: 30%; right: 5%;"></div>
    
    <!-- App Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">💀</div>
        <div>CringeScroll</div>
      </div>
      <div class="user-avatar" id="userAvatar">U</div>
    </header>
    
    <!-- Content Area -->
    <main class="content-area" id="contentArea">
      <!-- Skeleton loaders will be inserted here -->
    </main>
    
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active" data-tab="hot">
        <div class="nav-icon">🔥</div>
        <div>Hot</div>
      </a>
      <a href="#" class="nav-item" data-tab="fresh">
        <div class="nav-icon">💀</div>
        <div>Fresh</div>
      </a>
      <a href="#" class="nav-item" id="createBtn">
        <div class="nav-icon" style="background: var(--primary); color: white;">+</div>
        <div>Create</div>
      </a>
      <a href="#" class="nav-item" data-tab="crowned">
        <div class="nav-icon">👑</div>
        <div>Crowned</div>
      </a>
      <a href="#" class="nav-item" data-tab="profile">
        <div class="nav-icon">👤</div>
        <div>Me</div>
      </a>
    </nav>
  </div>
    <!-- Modals -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="authTitle">Sign Up</div>
        <button class="close-modal" id="closeAuthModal">×</button>
      </div>
      <form id="authForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="emailInput" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-input" id="usernameInput" placeholder="cringe_master69" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="passwordInput" placeholder="●●●●●●●●" required minlength="6">
        </div>
        <button type="submit" class="btn btn-secondary" style="width: 100%;">Sign Up</button>
      </form>
      <div style="text-align: center; margin-top: 15px;">
        <span id="toggleAuthMode" style="color: var(--secondary); cursor: pointer;">Already have an account? Log in</span>
      </div>
    </div>
  </div>
  
  <div class="modal" id="memeEditorModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🎨 Create Meme</div>
        <button class="close-modal" id="closeEditorModal">×</button>
      </div>
      <div class="editor-canvas-container">
        <canvas id="editorCanvas" width="600" height="400"></canvas>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0;">
        <div class="form-group">
          <label class="form-label">Text</label>
          <input type="text" class="form-input" id="editorText" placeholder="Enter text" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">Font</label>
          <select class="form-input" id="editorFont">
            <option value="Impact">Impact (Classic)</option>
            <option value="Arial">Arial</option>
            <option value="Comic Sans MS">Comic Sans (Cringe)</option>
            <option value="Fredoka One">Fredoka One (Fun)</option>
          </select>
        </div>
      </div>
      <div style="display: flex; gap: 15px; margin-bottom: 15px;">
        <div style="flex: 1;">
          <label class="form-label">Color</label>
          <input type="color" id="editorColor" value="#ffffff" style="width: 100%; height: 40px; border-radius: 12px;">
        </div>
        <div style="flex: 1;">
          <label class="form-label">Size</label>
          <input type="range" min="12" max="72" value="36" id="editorFontSize" style="width: 100%;">
        </div>
      </div>
      <div style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button class="btn btn-secondary" id="addImageButton">🖼️ Add Image</button>
        <button class="btn btn-primary" id="addTextButton">✏️ Add Text</button>
        <button class="btn btn-secondary" id="clearCanvasButton">🗑️ Clear</button>
      </div>
      <button class="btn btn-primary" style="width: 100%;" id="postMemeButton">✨ Post Cringe</button>
    </div>
  </div>
  
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">👤 My Profile</div>
        <button class="close-modal" id="closeProfileModal">×</button>
      </div>
      <div class="user-stats">
        <div class="stat-item">
          <div class="stat-value" id="coinDisplay">0</div>
          <div class="stat-label">CringeCoin</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="streakDisplay">0</div>
          <div class="stat-label">Streak</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="profileUsername" disabled>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="profileEmail" disabled>
      </div>
      <button class="btn btn-secondary" id="logoutButton" style="width: 100%;">🚪 Logout</button>
    </div>
  </div>
  
  <div class="modal" id="collectionsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">💾 My Collections</div>
        <button class="close-modal" id="closeCollectionsModal">×</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="collections">Collections</button>
        <button class="tab-btn" data-tab="saved">Saved Memes</button>
      </div>
      <div id="collectionsContent">
        <div style="text-align: center; padding: 20px;">
          <div class="spinner"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="createCollectionButton" style="width: 100%; margin-top: 15px;">➕ Create Collection</button>
    </div>
  </div>
  
  <!-- Notifications -->
  <div class="notification" id="notificationToast">Default message</div>
  
  <script>
    // ===== CORE ENGINE v7.0 — COMPLETE REWRITE =====
    class CringeScroll {
      constructor() {
        this.db = null;
        this.auth = null;
        this.currentUser = null;
        this.cringeCoin = 0;
        this.streak = 0;
        this.contentArea = document.getElementById('contentArea');
        this.seenMemeIds = new Set();
        this.loadCount = 0;
        this.isLoading = false;
        this.currentTab = 'hot';
        this.fabricCanvas = null;
        this.initFirebase();
        this.initEventListeners();
        this.initBackgroundBubbles();
        this.init3DTiltEffects();
        this.checkInstallPrompt();
      }
      
      async initFirebase() {
        try {
          // Firebase is already loaded via script tags
          firebase.initializeApp(firebaseConfig);
          this.db = firebase.firestore();
          this.auth = firebase.auth();
          
          // Initialize collections field for all users
          this.auth.onAuthStateChanged(async (user) => {
            if (user) {
              const userDoc = await this.db.collection('users').doc(user.uid).get();
              if (userDoc.exists) {
                const userData = userDoc.data();
                this.currentUser = {
                  uid: user.uid,
                  email: user.email,
                  username: userData.username || `user_${user.uid.substring(0, 6)}`
                };
                
                // Ensure collections field exists
                if (!userData.collections) {
                  await this.db.collection('users').doc(user.uid).update({
                    collections: {}
                  });
                }
                
                this.cringeCoin = userData.cringeCoin || 0;
                this.streak = userData.streak || 0;
                this.updateUserAvatar();
                this.updateCoinDisplay();
              } else {
                // Create new user document with collections field
                await this.db.collection('users').doc(user.uid).set({
                  email: user.email,
                  username: `user_${Math.random().toString(36).substr(2, 8)}`,
                  cringeCoin: 0,
                  streak: 0,
                  lastActive: firebase.firestore.FieldValue.serverTimestamp(),
                  collections: {} // Initialize collections
                });
                this.currentUser = {
                  uid: user.uid,
                  email: user.email,
                  username: `user_${Math.random().toString(36).substr(2, 8)}`
                };
                this.cringeCoin = 0;
                this.streak = 0;
                this.updateUserAvatar();
                this.updateCoinDisplay();
              }
              await this.updateStreak();
            } else {
              this.currentUser = null;
              this.cringeCoin = 0;
              this.streak = 0;
              this.updateUserAvatar();
              this.updateCoinDisplay();
            }
          });
        } catch (error) {
          console.error('Firebase initialization failed:', error);
          this.showNotification('Failed to connect to server. Please try again later.', true);
        }
      }
      
      initEventListeners() {
        // Navigation tabs
        document.querySelectorAll('.nav-item').forEach(item => {
          item.addEventListener('click', (e) => {
            e.preventDefault();
            const tab = item.dataset.tab;
            if (tab) {
              this.switchTab(tab);
            }
          });
        });
        
        // Create meme button
        document.getElementById('createBtn').addEventListener('click', (e) => {
          e.preventDefault();
          this.openMemeEditor();
        });
        
        // User avatar click
        document.getElementById('userAvatar').addEventListener('click', () => {
          if (this.currentUser) {
            this.openProfileModal();
          } else {
            this.openAuthModal();
          }
        });
        
        // Close modal buttons
        document.querySelectorAll('.close-modal').forEach(button => {
          button.addEventListener('click', () => {
            button.closest('.modal').classList.remove('active');
          });
        });
        
        // Auth form submission
        document.getElementById('authForm').addEventListener('submit', (e) => {
          e.preventDefault();
          this.handleAuth();
        });
        
        // Toggle auth mode
        document.getElementById('toggleAuthMode').addEventListener('click', () => {
          this.toggleAuthMode();
        });
        
        // Post meme button
        document.getElementById('postMemeButton').addEventListener('click', () => {
          this.postMeme();
        });
        
        // Add text button
        document.getElementById('addTextButton').addEventListener('click', () => {
          this.addTextToCanvas();
        });
        
        // Add image button
        document.getElementById('addImageButton').addEventListener('click', () => {
          this.addImageToCanvas();
        });
        
        // Clear canvas button
        document.getElementById('clearCanvasButton').addEventListener('click', () => {
          this.clearCanvas();
        });
        
        // Logout button
        document.getElementById('logoutButton').addEventListener('click', () => {
          this.logout();
        });
        
        // Create collection button
        document.getElementById('createCollectionButton').addEventListener('click', () => {
          this.createCollection();
        });
        
        // Collections tab switching
        document.querySelectorAll('.tab-btn').forEach(button => {
          button.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            const tab = button.dataset.tab;
            if (tab === 'collections') {
              this.loadCollections();
            } else if (tab === 'saved') {
              this.loadSavedMemes();
            }
          });
        });
        
        // Infinite scroll
        this.contentArea.addEventListener('scroll', () => {
          const { scrollTop, scrollHeight, clientHeight } = this.contentArea;
          if (scrollHeight - scrollTop <= clientHeight + 300 && !this.isLoading) {
            this.loadMoreContent();
          }
        });
      }
      
      init3DTiltEffects() {
        // Apply 3D tilt effect to cards
        const cringeCards = document.querySelectorAll('.cringe-card');
        cringeCards.forEach(card => {
          VanillaTilt.init(card, {
            max: 15,
            speed: 400,
            glare: true,
            "max-glare": 0.2,
          });
        });
        
        // Apply tilt to editor canvas
        const editorCanvas = document.getElementById('editorCanvas');
        if (editorCanvas) {
          editorCanvas.parentElement.classList.add('tilt-effect');
        }
      }
      
      initBackgroundBubbles() {
        // Already created in HTML
      }
      
      checkInstallPrompt() {
        if (!localStorage.getItem('installPromptSeen')) {
          setTimeout(() => {
            this.showNotification('💡 Tap "Share" → "Add to Home Screen" for fullscreen cringe mode!');
            localStorage.setItem('installPromptSeen', 'true');
          }, 5000);
        }
      }
      
      updateUserAvatar() {
        const avatar = document.getElementById('userAvatar');
        if (this.currentUser) {
          avatar.textContent = this.currentUser.username.charAt(0).toUpperCase();
          avatar.style.background = 'linear-gradient(135deg, var(--primary), var(--secondary))';
        } else {
          avatar.textContent = '👤';
          avatar.style.background = 'rgba(78, 205, 196, 0.1)';
        }
      }
      
      updateCoinDisplay() {
        document.getElementById('coinDisplay').textContent = this.cringeCoin;
        document.getElementById('streakDisplay').textContent = this.streak;
      }
      
      showNotification(message, isError = false) {
        const notification = document.getElementById('notificationToast');
        notification.textContent = message;
        notification.style.borderLeft = isError ? '4px solid var(--primary)' : '4px solid var(--secondary)';
        notification.classList.add('show');
        
        setTimeout(() => {
          notification.classList.remove('show');
        }, 3000);
      }
      
      async switchTab(tab) {
        // Update active nav item
        document.querySelectorAll('.nav-item').forEach(item => {
          item.classList.toggle('active', item.dataset.tab === tab || 
            (tab === 'profile' && item.dataset.tab === 'me'));
        });
        
        this.currentTab = tab;
        this.seenMemeIds.clear();
        this.loadCount = 0;
        this.contentArea.innerHTML = '';
        
        // Show loading skeleton
        for (let i = 0; i < 4; i++) {
          this.contentArea.innerHTML += `<div class="skeleton-card"></div>`;
        }
        
        // Load content based on tab
        if (tab === 'profile') {
          await this.loadUserProfileContent();
        } else {
          await this.loadMemes();
        }
      }
      
      async loadMemes() {
        if (this.isLoading) return;
        this.isLoading = true;
        
        try {
          let memes = [];
          
          if (this.currentTab === 'hot') {
            memes = await this.fetchHotMemes();
          } else if (this.currentTab === 'fresh') {
            memes = await this.fetchFreshMemes();
          } else if (this.currentTab === 'crowned') {
            memes = await this.fetchCrownedMemes();
          }
          
          // Filter out already seen memes
          memes = memes.filter(meme => !this.seenMemeIds.has(meme.id));
          
          // Clear skeleton loaders on first load
          if (this.loadCount === 0) {
            this.contentArea.innerHTML = '';
          }
          
          // Render memes
          memes.forEach(meme => {
            this.seenMemeIds.add(meme.id);
            this.renderMeme(meme);
            this.loadCount++;
          });
          
          // Show empty state if no memes found
          if (memes.length === 0 && this.loadCount === 0) {
            this.contentArea.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">😔</div>
                <div class="empty-title">No cringe found</div>
                <div class="empty-text">Try checking back later or create your own meme!</div>
                <button class="btn btn-primary" id="createEmptyMemeBtn">Create Meme</button>
              </div>
            `;
            document.getElementById('createEmptyMemeBtn').addEventListener('click', () => {
              this.openMemeEditor();
            });
          }
        } catch (error) {
          console.error('Error loading memes:', error);
          this.showNotification('Failed to load memes. Please try again.', true);
        } finally {
          this.isLoading = false;
        }
      }
      
      async fetchHotMemes() {
        // Mix of user-generated and API memes
        try {
          // Get top user memes
          const userMemesSnapshot = await this.db.collection('memes')
            .where('isUserGenerated', '==', true)
            .orderBy('ups', 'desc')
            .limit(5)
            .get();
          
          const userMemes = [];
          userMemesSnapshot.forEach(doc => {
            const data = doc.data();
            userMemes.push({
              id: doc.id,
              ...data,
              isUserGenerated: true,
              memeType: 'USER'
            });
          });
          
          // Get API memes as fallback
          const apiMemes = await this.fetchAPIMemes(5);
          
          // Combine and shuffle
          const combinedMemes = [...userMemes, ...apiMemes];
          return this.shuffleArray(combinedMemes).slice(0, 10);
        } catch (error) {
          console.error('Error fetching hot memes:', error);
          return await this.fetchAPIMemes(10);
        }
      }
      
      async fetchFreshMemes() {
        // Get latest user memes
        try {
          const snapshot = await this.db.collection('memes')
            .where('isUserGenerated', '==', true)
            .orderBy('createdAt', 'desc')
            .limit(10)
            .get();
          
          const memes = [];
          snapshot.forEach(doc => {
            const data = doc.data();
            memes.push({
              id: doc.id,
              ...data,
              isUserGenerated: true,
              memeType: 'NEW'
            });
          });
          
          return memes;
        } catch (error) {
          console.error('Error fetching fresh memes:', error);
          return await this.fetchAPIMemes(10);
        }
      }
      
      async fetchCrownedMemes() {
        // Get memes with most reactions
        try {
          const snapshot = await this.db.collection('reactions')
            .orderBy('total', 'desc')
            .limit(10)
            .get();
          
          const memeIds = snapshot.docs.map(doc => doc.id);
          const memes = [];
          
          for (const memeId of memeIds) {
            const memeDoc = await this.db.collection('memes').doc(memeId).get();
            if (memeDoc.exists) {
              const data = memeDoc.data();
              memes.push({
                id: memeId,
                ...data,
                isCrowned: true,
                memeType: '👑'
              });
            }
          }
          
          return memes;
        } catch (error) {
          console.error('Error fetching crowned memes:', error);
          return await this.fetchAPIMemes(10);
        }
      }
      
      async fetchAPIMemes(limit = 10) {
        // Fallback to backup meme APIs
        const memeAPIs = [
          'https://api.imgflip.com/get_memes',
          'https://official-joke-api.appspot.com/random_joke',
          // Backup static memes
          { 
            id: 'backup1',
            url: 'https://i.imgur.com/QfGpJYl.jpg',
            title: 'When the code finally works',
            ups: 1500
          },
          { 
            id: 'backup2',
            url: 'https://i.imgur.com/7O2JhQr.jpg',
            title: 'Debugging in production',
            ups: 2300
          },
          { 
            id: 'backup3',
            url: 'https://i.imgur.com/xH9QfKk.jpg',
            title: 'AI taking over jobs',
            ups: 3100
          }
        ];
        
        try {
          // Try to get memes from imgflip API
          const response = await fetch('https://api.imgflip.com/get_memes');
          const data = await response.json();
          
          if (data.success && data.data.memes) {
            return data.data.memes.slice(0, limit).map(meme => ({
              id: `imgflip_${meme.id}`,
              url: meme.url,
              title: meme.name,
              ups: Math.floor(Math.random() * 5000) + 1000,
              width: meme.width,
              height: meme.height
            }));
          }
        } catch (error) {
          console.warn('Imgflip API failed, using backup memes');
        }
        
        // Return backup memes
        return memeAPIs.filter(m => typeof m === 'object' && m.url).slice(0, limit);
      }
      
      renderMeme(meme) {
        try {
          const card = document.createElement('div');
          card.className = 'cringe-card tilt-effect';
          card.innerHTML = `
            <div class="card-header">
              <div class="meme-title">${this.escapeHtml(meme.title || 'Untitled Cringe')}</div>
              <div class="meme-type">${meme.memeType || '🔥'}</div>
            </div>
            <div class="meme-image-container">
              <img src="${meme.url}" alt="meme" class="meme-image" loading="lazy">
            </div>
            <div class="card-footer">
              <div class="reactions-bar">
                <button class="reaction-btn" data-emoji="💀" data-meme-id="${meme.id}">
                  💀 <span class="reaction-count">${meme.ups || 0}</span>
                </button>
                <button class="reaction-btn" data-emoji="😂" data-meme-id="${meme.id}">
                  😂 <span class="reaction-count">0</span>
                </button>
                <button class="reaction-btn" data-emoji="🤡" data-meme-id="${meme.id}">
                  🤡 <span class="reaction-count">0</span>
                </button>
                <button class="reaction-btn" data-emoji="👍" data-meme-id="${meme.id}">
                  👍 <span class="reaction-count">0</span>
                </button>
              </div>
              <div class="action-buttons">
                <button class="action-btn tip-btn" data-meme-id="${meme.id}">
                  💀 Tip 5
                </button>
                <button class="action-btn save-btn" data-meme-id="${meme.id}">
                  💾 Save
                </button>
              </div>
            </div>
          `;
          
          // Add event listeners
          card.querySelectorAll('.reaction-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const emoji = btn.dataset.emoji;
              const memeId = btn.dataset.memeId;
              this.addReaction(memeId, emoji, meme);
            });
          });
          
          card.querySelector('.tip-btn').addEventListener('click', () => {
            this.tipMeme(meme.id, 5);
          });
          
          card.querySelector('.save-btn').addEventListener('click', () => {
            this.saveMeme(meme);
          });
          
          this.contentArea.appendChild(card);
          
          // Apply 3D tilt effect
          VanillaTilt.init(card, {
            max: 15,
            speed: 400,
            glare: true,
            "max-glare": 0.2,
          });
          
          return true;
        } catch (error) {
          console.error('Error rendering meme:', error);
          return false;
        }
      }
      
      async addReaction(memeId, emoji, memeData) {
        if (!this.currentUser) {
          this.openAuthModal();
          return;
        }
        
        try {
          // Ensure meme exists in database
          await this.ensureMemeInDB(memeData);
          
          // Add reaction
          const reactionRef = this.db.collection('reactions').doc(memeId);
          await this.db.runTransaction(async (transaction) => {
            const reactionDoc = await transaction.get(reactionRef);
            const data = reactionDoc.exists ? reactionDoc.data() : { total: 0, counts: {} };
            
            data.counts[emoji] = (data.counts[emoji] || 0) + 1;
            data.total += 1;
            
            transaction.set(reactionRef, data);
          });
          
          // Update user's CringeCoin
          await this.updateCringeCoin(1);
          
          // Update UI
          const reactionBtn = document.querySelector(`.reaction-btn[data-emoji="${emoji}"][data-meme-id="${memeId}"]`);
          if (reactionBtn) {
            const countEl = reactionBtn.querySelector('.reaction-count');
            if (countEl) {
              countEl.textContent = parseInt(countEl.textContent) + 1;
              countEl.parentElement.classList.add('reaction-btn');
              setTimeout(() => {
                countEl.parentElement.classList.remove('reaction-btn');
              }, 300);
            }
          }
          
          // Update streak and check quests
          await this.updateStreak();
          this.checkDailyQuests('react');
          
          this.showNotification(`+1 CringeCoin for reacting with ${emoji}!`);
          return true;
        } catch (error) {
          console.error('Error adding reaction:', error);
          this.showNotification('Failed to add reaction. Please try again.', true);
          return false;
        }
      }
      
      async tipMeme(memeId, amount) {
        if (!this.currentUser) {
          this.openAuthModal();
          return;
        }
        
        if (this.cringeCoin < amount) {
          this.showNotification('Not enough CringeCoin!', true);
          return;
        }
        
        try {
          // Create tip record
          await this.db.collection('tips').add({
            from: this.currentUser.uid,
            to: memeId,
            amount: amount,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          
          // Deduct coins from user
          await this.db.collection('users').doc(this.currentUser.uid).update({
            cringeCoin: firebase.firestore.FieldValue.increment(-amount)
          });
          
          this.cringeCoin -= amount;
          this.updateCoinDisplay();
          
          // Visual feedback
          const tipBtn = document.querySelector(`.tip-btn[data-meme-id="${memeId}"]`);
          if (tipBtn) {
            tipBtn.innerHTML = `✅ Tipped!`;
            tipBtn.disabled = true;
            setTimeout(() => {
              tipBtn.innerHTML = '💀 Tip 5';
              tipBtn.disabled = false;
            }, 2000);
          }
          
          this.showNotification(`Tipped ${amount} CringeCoin!`);
          return true;
        } catch (error) {
          console.error('Error tipping meme:', error);
          this.showNotification('Failed to tip meme. Please try again.', true);
          return false;
        }
      }
      
      async saveMeme(meme) {
        if (!this.currentUser) {
          this.openAuthModal();
          return;
        }
        
        try {
          // Open collections modal
          document.getElementById('collectionsModal').classList.add('active');
          
          // Load collections
          await this.loadCollections();
          
          // Set current meme for saving
          this.currentMemeToSave = meme;
          
          return true;
        } catch (error) {
          console.error('Error saving meme:', error);
          this.showNotification('Failed to save meme. Please try again.', true);
          return false;
        }
      }
      
      async loadCollections() {
        if (!this.currentUser) return;
        
        try {
          const contentDiv = document.getElementById('collectionsContent');
          contentDiv.innerHTML = '<div class="spinner"></div>';
          
          const userDoc = await this.db.collection('users').doc(this.currentUser.uid).get();
          if (!userDoc.exists) return;
          
          const userData = userDoc.data();
          const collections = userData.collections || {};
          const collectionNames = Object.keys(collections);
          
          if (collectionNames.length === 0) {
            contentDiv.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">📁</div>
                <div class="empty-title">No collections yet</div>
                <div class="empty-text">Create your first collection to save memes!</div>
              </div>
            `;
            return;
          }
          
          // Render collections
          let html = '';
          collectionNames.forEach(name => {
            html += `
              <div class="cringe-card tilt-effect" style="margin-bottom: 15px; cursor: pointer;" data-collection="${name}">
                <div class="card-header">
                  <div class="meme-title">${name}</div>
                  <div class="meme-type">${collections[name].length} memes</div>
                </div>
                <div style="padding: 20px; text-align: center; color: var(--secondary);">
                  <div style="font-size: 48px; margin-bottom: 10px;">📁</div>
                  <div>Tap to view</div>
                </div>
              </div>
            `;
          });
          
          contentDiv.innerHTML = html;
          
          // Add click handlers
          document.querySelectorAll('[data-collection]').forEach(card => {
            card.addEventListener('click', async () => {
              const collectionName = card.dataset.collection;
              await this.saveMemeToCollection(collectionName);
            });
          });
          
        } catch (error) {
          console.error('Error loading collections:', error);
          document.getElementById('collectionsContent').innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">❌</div>
              <div class="empty-title">Error loading collections</div>
              <div class="empty-text">Please try again later</div>
            </div>
          `;
        }
      }
      
      async saveMemeToCollection(collectionName) {
        if (!this.currentUser || !this.currentMemeToSave) return;
        
        try {
          const userDoc = await this.db.collection('users').doc(this.currentUser.uid).get();
          if (!userDoc.exists) return;
          
          const userData = userDoc.data();
          const collections = userData.collections || {};
          
          if (!collections[collectionName]) {
            collections[collectionName] = [];
          }
          
          // Add meme ID to collection if not already there
          const memeId = this.currentMemeToSave.id;
          if (!collections[collectionName].includes(memeId)) {
            collections[collectionName].push(memeId);
            
            // Update database
            await this.db.collection('users').doc(this.currentUser.uid).update({
              collections: collections
            });
            
            this.showNotification(`Saved to "${collectionName}" collection!`);
            
            // Close modal
            document.getElementById('collectionsModal').classList.remove('active');
          } else {
            this.showNotification('Already saved to this collection!', true);
          }
        } catch (error) {
          console.error('Error saving to collection:', error);
          this.showNotification('Failed to save to collection. Please try again.', true);
        }
      }
      
      async createCollection() {
        if (!this.currentUser) {
          this.openAuthModal();
          return;
        }
        
        const collectionName = prompt('Enter collection name (max 20 characters):');
        if (!collectionName || collectionName.trim() === '') return;
        
        if (collectionName.length > 20) {
          this.showNotification('Collection name must be 20 characters or less', true);
          return;
        }
        
        try {
          const userDoc = await this.db.collection('users').doc(this.currentUser.uid).get();
          if (!userDoc.exists) return;
          
          const userData = userDoc.data();
          const collections = userData.collections || {};
          
          if (collections[collectionName]) {
            this.showNotification('Collection already exists!', true);
            return;
          }
          
          // Create new collection
          collections[collectionName] = [];
          
          // Update database
          await this.db.collection('users').doc(this.currentUser.uid).update({
            collections: collections
          });
          
          this.showNotification(`Collection "${collectionName}" created!`);
          await this.loadCollections();
        } catch (error) {
          console.error('Error creating collection:', error);
          this.showNotification('Failed to create collection. Please try again.', true);
        }
      }
      
      async ensureMemeInDB(memeData) {
        if (!memeData.id) return;
        
        try {
          const memeRef = this.db.collection('memes').doc(memeData.id);
          const memeDoc = await memeRef.get();
          
          if (!memeDoc.exists) {
            await memeRef.set({
              title: memeData.title || 'Untitled',
              url: memeData.url,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              isUserGenerated: memeData.isUserGenerated || false,
              ups: memeData.ups || 0,
              userId: memeData.userId || null,
              claimedBy: null,
              collections: []
            });
          }
        } catch (error) {
          console.error('Error ensuring meme in DB:', error);
        }
      }
      
      async updateCringeCoin(amount) {
        if (!this.currentUser || amount <= 0) return;
        
        try {
          await this.db.collection('users').doc(this.currentUser.uid).update({
            cringeCoin: firebase.firestore.FieldValue.increment(amount)
          });
          
          this.cringeCoin += amount;
          this.updateCoinDisplay();
          
          return true;
        } catch (error) {
          console.error('Error updating CringeCoin:', error);
          return false;
        }
      }
      
      async updateStreak() {
        if (!this.currentUser) return;
        
        try {
          const today = new Date().toDateString();
          const lastActive = localStorage.getItem('lastActive');
          let newStreak = this.streak;
          
          if (lastActive !== today) {
            if (lastActive === new Date(Date.now() - 86400000).toDateString()) {
              newStreak = this.streak + 1;
            } else {
              newStreak = 1;
            }
            
            localStorage.setItem('lastActive', today);
            this.streak = newStreak;
            
            // Update database
            await this.db.collection('users').doc(this.currentUser.uid).update({
              streak: this.streak,
              lastActive: firebase.firestore.FieldValue.serverTimestamp()
            });
            
            this.updateCoinDisplay();
            
            // Award milestone badges
            this.checkStreakMilestones();
          }
        } catch (error) {
          console.error('Error updating streak:', error);
        }
      }
      
      checkStreakMilestones() {
        const milestones = [3, 7, 14, 30];
        const unlocked = JSON.parse(localStorage.getItem('unlockedMilestones') || '[]');
        
        for (const day of milestones) {
          if (this.streak >= day && !unlocked.includes(day)) {
            unlocked.push(day);
            localStorage.setItem('unlockedMilestones', JSON.stringify(unlocked));
            
            let badgeName = '';
            if (day === 3) badgeName = '🔥 3-Day Streak';
            else if (day === 7) badgeName = '👑 7-Day Streak';
            else if (day === 14) badgeName = '💀 14-Day Streak';
            else if (day === 30) badgeName = '🏆 30-Day Streak';
            
            this.showNotification(`🎉 Unlocked badge: ${badgeName}`);
          }
        }
      }
      
      checkDailyQuests(questType) {
        const today = new Date().toDateString();
        let quests = JSON.parse(localStorage.getItem('dailyQuests') || '{}');
        
        if (quests.date !== today) {
          quests = {
            date: today,
            react: { count: 0, completed: false },
            post: { count: 0, completed: false },
            tip: { count: 0, completed: false }
          };
        }
        
        // Update quest count
        if (quests[questType]) {
          quests[questType].count++;
          
          // Check completion
          if (questType === 'react' && quests[questType].count >= 5 && !quests[questType].completed) {
            quests[questType].completed = true;
            this.updateCringeCoin(10);
            this.showNotification('🎯 Quest completed: React to 5 memes! +10 CringeCoin');
          } else if (questType === 'post' && quests[questType].count >= 1 && !quests[questType].completed) {
            quests[questType].completed = true;
            this.updateCringeCoin(15);
            this.showNotification('🎯 Quest completed: Post 1 meme! +15 CringeCoin');
          } else if (questType === 'tip' && quests[questType].count >= 1 && !quests[questType].completed) {
            quests[questType].completed = true;
            this.updateCringeCoin(5);
            this.showNotification('🎯 Quest completed: Tip someone! +5 CringeCoin');
          }
          
          localStorage.setItem('dailyQuests', JSON.stringify(quests));
        }
      }
      
      openMemeEditor() {
        if (!this.currentUser) {
          this.openAuthModal();
          return;
        }
        
        document.getElementById('memeEditorModal').classList.add('active');
        this.initFabricEditor();
      }
      
      initFabricEditor() {
        const canvasElement = document.getElementById('editorCanvas');
        
        // Dispose existing canvas if any
        if (this.fabricCanvas) {
          this.fabricCanvas.dispose();
        }
        
        // Initialize new canvas
        this.fabricCanvas = new fabric.Canvas(canvasElement, {
          width: 600,
          height: 400,
          backgroundColor: '#16213e',
          selection: true,
          preserveObjectStacking: true
        });
      }
      
      addTextToCanvas() {
        if (!this.fabricCanvas) return;
        
        const text = document.getElementById('editorText').value.trim() || 'Your cringe text here';
        const font = document.getElementById('editorFont').value;
        const color = document.getElementById('editorColor').value;
        const fontSize = parseInt(document.getElementById('editorFontSize').value);
        
        const textObject = new fabric.IText(text, {
          left: 50,
          top: 50,
          fontFamily: font,
          fill: color,
          fontSize: fontSize,
          fontWeight: 'bold',
          stroke: '#000',
          strokeWidth: 2,
          originX: 'left',
          originY: 'top',
          hasRotatingPoint: true
        });
        
        this.fabricCanvas.add(textObject);
        this.fabricCanvas.setActiveObject(textObject);
        this.fabricCanvas.renderAll();
      }
      
      addImageToCanvas() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          const reader = new FileReader();
          reader.onload = (event) => {
            fabric.Image.fromURL(event.target.result, (img) => {
              // Scale image to fit canvas
              const maxWidth = 500;
              const maxHeight = 300;
              
              let scale = 1;
              if (img.width > maxWidth) scale = maxWidth / img.width;
              if (img.height * scale > maxHeight) scale = maxHeight / img.height;
              
              img.scale(scale);
              img.top = 50;
              img.left = 50;
              
              this.fabricCanvas.add(img);
              this.fabricCanvas.renderAll();
            });
          };
          
          reader.readAsDataURL(file);
        };
        
        input.click();
      }
      
      clearCanvas() {
        if (!this.fabricCanvas) return;
        this.fabricCanvas.clear();
        this.fabricCanvas.backgroundColor = '#16213e';
        this.fabricCanvas.renderAll();
      }
      
      async postMeme() {
        if (!this.currentUser || !this.fabricCanvas) return;
        
        try {
          // Convert canvas to data URL
          const dataURL = this.fabricCanvas.toDataURL({
            format: 'png',
            quality: 1.0
          });
          
          // Create meme document
          const memeId = `user_${Date.now()}`;
          const memeData = {
            id: memeId,
            url: dataURL,
            title: 'User Generated Cringe',
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            isUserGenerated: true,
            ups: 0,
            userId: this.currentUser.uid,
            username: this.currentUser.username
          };
          
          // Save to database
          await this.db.collection('memes').doc(memeId).set(memeData);
          
          // Award CringeCoin
          await this.updateCringeCoin(10);
          this.checkDailyQuests('post');
          
          // Close editor
          document.getElementById('memeEditorModal').classList.remove('active');
          
          this.showNotification('🎉 Meme posted successfully! +10 CringeCoin');
          
          // Refresh feed if on user content tab
          if (this.currentTab === 'profile') {
            this.switchTab('profile');
          }
          
          return true;
        } catch (error) {
          console.error('Error posting meme:', error);
          this.showNotification('Failed to post meme. Please try again.', true);
          return false;
        }
      }
      
      async loadUserProfileContent() {
        if (!this.currentUser) {
          this.contentArea.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">👤</div>
              <div class="empty-title">Not logged in</div>
              <div class="empty-text">Log in to see your profile and memes</div>
              <button class="btn btn-primary" id="loginProfileBtn">Log In</button>
            </div>
          `;
          
          document.getElementById('loginProfileBtn').addEventListener('click', () => {
            this.openAuthModal();
          });
          
          return;
        }
        
        try {
          this.contentArea.innerHTML = '<div class="spinner"></div>';
          
          // Get user's memes
          const memesSnapshot = await this.db.collection('memes')
            .where('userId', '==', this.currentUser.uid)
            .orderBy('createdAt', 'desc')
            .limit(10)
            .get();
          
          const memes = [];
          memesSnapshot.forEach(doc => {
            const data = doc.data();
            memes.push({
              id: doc.id,
              ...data,
              isUserGenerated: true,
              memeType: 'ME'
            });
          });
          
          // Clear loading spinner
          this.contentArea.innerHTML = '';
          
          // Show empty state if no memes
          if (memes.length === 0) {
            this.contentArea.innerHTML = `
              <div class="empty-state" style="grid-column: 1 / -1;">
                <div class="empty-icon">🎨</div>
                <div class="empty-title">No memes yet</div>
                <div class="empty-text">Create your first meme and share it with the world!</div>
                <button class="btn btn-primary" id="createFirstMemeBtn">Create First Meme</button>
              </div>
            `;
            
            document.getElementById('createFirstMemeBtn').addEventListener('click', () => {
              this.openMemeEditor();
            });
            
            return;
          }
          
          // Render memes
          memes.forEach(meme => {
            this.renderMeme(meme);
          });
          
        } catch (error) {
          console.error('Error loading profile content:', error);
          this.contentArea.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <div class="empty-icon">❌</div>
              <div class="empty-title">Error loading profile</div>
              <div class="empty-text">Please try again later</div>
            </div>
          `;
        }
      }
      
      openProfileModal() {
        if (!this.currentUser) return;
        
        document.getElementById('profileUsername').value = this.currentUser.username;
        document.getElementById('profileEmail').value = this.currentUser.email || '';
        document.getElementById('coinDisplay').textContent = this.cringeCoin;
        document.getElementById('streakDisplay').textContent = this.streak;
        
        document.getElementById('profileModal').classList.add('active');
      }
      
      openAuthModal() {
        document.getElementById('authTitle').textContent = 'Sign Up';
        document.getElementById('usernameInput').style.display = 'block';
        document.getElementById('authForm').reset();
        document.getElementById('authModal').classList.add('active');
      }
      
      toggleAuthMode() {
        const isLoginMode = document.getElementById('authTitle').textContent === 'Log In';
        
        if (isLoginMode) {
          // Switch to sign up
          document.getElementById('authTitle').textContent = 'Sign Up';
          document.getElementById('usernameInput').style.display = 'block';
        } else {
          // Switch to log in
          document.getElementById('authTitle').textContent = 'Log In';
          document.getElementById('usernameInput').style.display = 'none';
        }
      }
      
      async handleAuth() {
        const email = document.getElementById('emailInput').value.trim();
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const isLoginMode = document.getElementById('authTitle').textContent === 'Log In';
        
        if (!email || !password) {
          this.showNotification('Please fill all required fields', true);
          return;
        }
        
        if (!isLoginMode && (!username || username.length < 2 || username.length > 15)) {
          this.showNotification('Username must be 2-15 characters', true);
          return;
        }
        
        try {
          if (isLoginMode) {
            // Log in existing user
            await this.auth.signInWithEmailAndPassword(email, password);
            this.showNotification('Logged in successfully!');
          } else {
            // Check if username exists
            const usernameQuery = await this.db.collection('users')
              .where('username', '==', username)
              .limit(1)
              .get();
            
            if (!usernameQuery.empty) {
              this.showNotification('Username already taken!', true);
              return;
            }
            
            // Create new user
            const userCredential = await this.auth.createUserWithEmailAndPassword(email, password);
            
            // Create user document with collections field
            await this.db.collection('users').doc(userCredential.user.uid).set({
              email: email,
              username: username,
              cringeCoin: 0,
              streak: 0,
              lastActive: firebase.firestore.FieldValue.serverTimestamp(),
              collections: {} // Initialize collections
            });
            
            this.showNotification('Account created successfully!');
          }
          
          // Close modal
          document.getElementById('authModal').classList.remove('active');
          
        } catch (error) {
          let message = 'Authentication failed. Please try again.';
          
          if (error.code === 'auth/email-already-in-use') {
            message = 'Email already registered!';
          } else if (error.code === 'auth/invalid-email') {
            message = 'Invalid email address!';
          } else if (error.code === 'auth/weak-password') {
            message = 'Password must be at least 6 characters!';
          } else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
            message = 'Incorrect email or password!';
          }
          
          this.showNotification(message, true);
        }
      }
      
      async logout() {
        try {
          await this.auth.signOut();
          this.currentUser = null;
          this.cringeCoin = 0;
          this.streak = 0;
          this.updateUserAvatar();
          this.updateCoinDisplay();
          document.getElementById('profileModal').classList.remove('active');
          this.showNotification('Logged out successfully');
        } catch (error) {
          console.error('Error logging out:', error);
          this.showNotification('Failed to log out. Please try again.', true);
        }
      }
      
      escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({
          '&': '&amp;',
          '<': '<',
          '>': '>',
          '"': '&quot;',
          "'": '&#39;'
        }[m]));
      }
      
      shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }
      
      async loadMoreContent() {
        if (this.currentTab === 'profile') {
          await this.loadUserProfileContent();
        } else {
          await this.loadMemes();
        }
      }
    }
    
    // Initialize app when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      window.cringeScroll = new CringeScroll();
      
      // Initialize Fabric.js after DOM is ready
      if (typeof fabric !== 'undefined') {
        // Fabric.js is already loaded
      }
    });
  </script>
