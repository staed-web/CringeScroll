<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0c29" />
  <meta name="description" content="CringeScroll - The ultimate meme sharing platform. Create, share, and cringe.">
  <title>CringeScroll • Where Memes Live</title>
  
  <link rel="preconnect" href="https://i.imgur.com" crossorigin>
  <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js" defer></script>

  <style>
    :root {
      /* Base theme colors */
      --bg-primary: #0f0c29;
      --bg-secondary: #1a1640;
      --card-bg: #242152;
      --text-primary: #e6e6ff;
      --text-secondary: #b8b8e0;
      --accent-1: #6a0dad;
      --accent-2: #a64ca6;
      --accent-3: #c46cff;
      --gold: #FFD700;
      --neon-green: #39ff14;
      --success: #00d26a;
      --error: #ff4d4d;
      --info: #4dabf7;
      --border-color: rgba(106, 13, 173, 0.3);
      --border-radius: 16px;
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.2);
      --card-padding: 12px;
      --header-height: 72px;
    }
    
    /* Themes */
    .theme-dark { --bg-primary: #0f0c29; --bg-secondary: #1a1640; --card-bg: #242152; --text-primary: #e6e6ff; --text-secondary: #b8b8e0; }
    .theme-light { --bg-primary: #f8f9fa; --bg-secondary: #e9ecef; --card-bg: #ffffff; --text-primary: #212529; --text-secondary: #6c757d; --accent-1: #9b59b6; --accent-2: #8e44ad; --accent-3: #7d3c98; --border-color: rgba(0, 0, 0, 0.1); }

    /* RESET & BASE */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body { height: 100%; width: 100%; overflow: hidden; }
    
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
      transition: background 0.3s ease, color 0.3s ease;
      font-size: var(--font-size-base, 1rem);
    }

    /* ===== SHOP ITEM EFFECTS ===== */
    .effect-gold-name { 
      color: var(--gold) !important; 
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); 
      background: linear-gradient(to right, #FFD700, #FDB931, #FFD700);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800 !important;
    }
    .effect-neon-text { 
      color: var(--neon-green) !important; 
      text-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green); 
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }
    .effect-fire-border { 
      border: 2px solid #ff4d4d !important; 
      box-shadow: 0 0 10px #ff4d4d, inset 0 0 10px #ff4d4d !important; 
      animation: borderPulse 2s infinite;
    }
    @keyframes borderPulse { 0% { box-shadow: 0 0 5px #ff4d4d; } 50% { box-shadow: 0 0 15px #ff4d4d; } 100% { box-shadow: 0 0 5px #ff4d4d; } }

    /* ===== LAYOUT ===== */
    .app-container { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; width: 100%; }

    /* HEADER */
    .header {
      height: var(--header-height);
      background: var(--bg-secondary); 
      backdrop-filter: blur(10px); 
      position: sticky; top: 0; left: 0; width: 100%; z-index: 100; 
      padding: 0 16px; 
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3)); 
      border-radius: 12px; display: flex; align-items: center; justify-content: center; 
      box-shadow: 0 4px 10px rgba(106, 13, 173, 0.3);
    }
    .logo-text {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(to right, var(--accent-1), var(--accent-3));
      -webkit-background-clip: text; background-clip: text; color: transparent; 
    }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .action-btn {
      width: 40px; height: 40px; border-radius: 12px;
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid var(--border-color);
      color: var(--text-primary); font-size: 1.1rem; 
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition); position: relative;
    }
    .action-btn:active { transform: scale(0.95); }
    .notification-badge {
      position: absolute; top: -2px; right: -2px; background: var(--error);
      color: white; font-size: 0.7rem; font-weight: bold;
      min-width: 18px; height: 18px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg-secondary);
    }
    .notification-badge:empty { display: none; }

    /* NAV */
    .nav-container {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color); 
      position: sticky; bottom: 0; left: 0; width: 100%; z-index: 90; 
      display: flex; justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); flex-shrink: 0;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; 
      gap: 4px; color: var(--text-secondary); 
      text-decoration: none; font-size: 0.75rem; font-weight: 500; 
      padding: 6px 16px; border-radius: 12px; transition: var(--transition); cursor: pointer;
    }
    .nav-item.active { color: var(--accent-3); background: rgba(106, 13, 173, 0.1); transform: translateY(-2px); }
    .nav-item i { font-size: 1.25rem; }

    /* FEED */
    .content-area {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px;
      column-count: 3; column-gap: 16px;
      scrollbar-width: thin; scrollbar-color: var(--accent-1) transparent;
    }
    
    /* MEME CARD */
    .meme-card {
      background: var(--card-bg); border-radius: var(--border-radius); 
      overflow: hidden; box-shadow: var(--shadow-sm);
      margin-bottom: 16px; break-inside: avoid-column;
      display: flex; flex-direction: column; width: 100%;
      transition: var(--transition); position: relative;
      border: 1px solid transparent; /* For Shop Border Effect */
    }
    .meme-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
    
    .card-header { padding: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
    .meme-title { font-weight: 700; color: var(--text-primary); line-height: 1.3; margin-bottom: 4px; word-break: break-word; }
    .meme-meta { font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
    .user-badge { 
      background: rgba(106, 13, 173, 0.15); padding: 2px 8px; border-radius: 12px; 
      font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    
    /* Double Tap Heart Animation */
    .meme-image-container { 
      width: 100%; position: relative; background: rgba(0,0,0,0.2); 
      min-height: 200px; overflow: hidden; cursor: pointer;
    }
    .meme-image { width: 100%; height: auto; display: block; opacity: 0; transition: opacity 0.3s; }
    .meme-image.loaded { opacity: 1; }
    
    .like-animation {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
      font-size: 5rem; color: white; pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
      z-index: 10;
    }
    .like-animation.animate { animation: popLike 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popLike { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

    .card-footer { padding: 10px; border-top: 1px solid rgba(255,255,255,0.05); }
    .reaction-bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .reaction-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; 
      background: rgba(255,255,255,0.03); border: none; padding: 8px; 
      border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: 0.2s;
    }
    .reaction-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .reaction-btn.active { color: var(--accent-3); background: rgba(106, 13, 173, 0.15); font-weight: bold; }
    
    .action-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .card-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.1); 
      color: var(--text-secondary); border-radius: 8px; padding: 6px 0;
      font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
    }
    .card-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .card-btn.saved { color: var(--accent-3); border-color: var(--accent-3); background: rgba(106, 13, 173, 0.1); }

    /* MODALS & OVERLAYS */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      z-index: 2000; display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content {
      background: var(--bg-secondary); width: 100%; max-width: 500px; max-height: 85vh;
      border-radius: 20px; display: flex; flex-direction: column;
      transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 1px solid var(--border-color); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; }
    
    /* EDITOR SPECIFIC */
    .editor-modal { max-width: 1000px; height: 90vh; }
    .editor-body { padding: 0; display: flex; flex-direction: column; height: 100%; }
    .canvas-wrapper { flex: 1; background: #000; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .editor-controls { background: var(--bg-secondary); padding: 15px; border-top: 1px solid var(--border-color); overflow-x: auto; flex-shrink: 0; }
    
    /* UI ELEMENTS */
    .btn {
      width: 100%; padding: 12px; border-radius: 12px; border: none; 
      font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: linear-gradient(135deg, var(--accent-1), var(--accent-3)); color: white; box-shadow: 0 4px 15px rgba(106, 13, 173, 0.4); }
    .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text-primary); }
    .form-control {
      width: 100%; padding: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: white; margin-bottom: 10px; font-size: 1rem;
    }
    .form-control:focus { outline: none; border-color: var(--accent-3); }

    /* UTILITIES */
    .loading-spinner {
      width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent-3); border-radius: 50%;
      animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESPONSIVE */
    @media (max-width: 1024px) { .content-area { column-count: 2; } }
    @media (max-width: 768px) {
      .content-area { column-count: 1; padding: 10px; }
      .chat-window { bottom: 70px; right: 10px; left: 10px; width: auto; }
      .editor-body { flex-direction: column; }
    }
  </style>
</head>
<body class="theme-dark">
  <div class="app-container">
    <header class="header">
      <a href="#" class="logo-container" id="logoLink">
        <div class="logo-icon"><i class="fas fa-skull"></i></div>
        <div class="logo-text">CringeScroll</div>
      </a>
      
      <div style="flex: 1; max-width: 400px; margin: 0 20px; display: none; @media(min-width: 768px){display:block;}">
        <input type="text" id="searchInput" class="form-control" style="margin:0; border-radius: 20px;" placeholder="Search users...">
      </div>
    
      <div class="header-actions">
        <button class="action-btn" id="notificationsBtn"><i class="fas fa-bell"></i><span class="notification-badge" id="notificationsBadge"></span></button>
        <button class="action-btn" id="themeToggleBtn"><i class="fas fa-moon"></i></button>
        <button class="action-btn" id="menuToggleBtn"><i class="fas fa-bars"></i></button>
      </div>
    </header>
    
    <main class="content-area" id="feed">
      <div class="loading-spinner"></div>
    </main>

    <nav class="nav-container">
      <a href="#" class="nav-item active" data-tab="hot"><i class="fas fa-fire"></i><span>Hot</span></a>
      <a href="#" class="nav-item" data-tab="fresh"><i class="fas fa-bolt"></i><span>Fresh</span></a>
      <a href="#" class="nav-item" data-tab="create" id="navCreateBtn"><i class="fas fa-plus-circle" style="color: var(--accent-3); font-size: 1.5rem;"></i><span>Create</span></a>
      <a href="#" class="nav-item" data-tab="mymemes"><i class="fas fa-user"></i><span>Me</span></a>
    </nav>
  </div>

  <div class="sidebar" id="sidebar" style="position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--bg-secondary); z-index: 1000; transition: right 0.3s; padding: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); overflow-y: auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <h2 style="margin:0;">Menu</h2>
      <button class="action-btn" id="closeSidebar"><i class="fas fa-times"></i></button>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <button class="btn btn-secondary" id="menuProfile" style="justify-content: flex-start;"><i class="fas fa-user-circle"></i> Profile</button>
      <button class="btn btn-secondary" id="menuShop" style="justify-content: flex-start;"><i class="fas fa-store"></i> Cringe Shop <span class="notification-badge" style="position: static; margin-left: auto; background: var(--gold);">NEW</span></button>
      <button class="btn btn-secondary" id="menuQuests" style="justify-content: flex-start;"><i class="fas fa-trophy"></i> Daily Quests</button>
      <button class="btn btn-secondary" id="menuLeaderboard" style="justify-content: flex-start;"><i class="fas fa-chart-line"></i> Leaderboard</button>
      <button class="btn btn-secondary" id="menuCollections" style="justify-content: flex-start;"><i class="fas fa-bookmark"></i> Saved Memes</button>
      <button class="btn btn-secondary" id="menuChat" style="justify-content: flex-start;"><i class="fas fa-comments"></i> Public Chat</button>
      <hr style="border-color: rgba(255,255,255,0.1); width: 100%;">
      <button class="btn btn-secondary" id="menuSettings" style="justify-content: flex-start;"><i class="fas fa-cog"></i> Settings</button>
      <button class="btn btn-primary" id="menuLogin" style="display: flex;"><i class="fas fa-sign-in-alt"></i> Login / Sign Up</button>
      <button class="btn btn-secondary" id="menuLogout" style="display: none; color: var(--error); border-color: var(--error);"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </div>

  <div class="chat-window" id="chatWindow" style="position: fixed; bottom: 80px; right: 20px; width: 320px; height: 400px; background: var(--bg-secondary); border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 900; transform: translateY(120%); transition: transform 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
    <div class="chat-header" id="chatHeader" style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: move; display: flex; justify-content: space-between;">
      <span><i class="fas fa-comments"></i> Public Chat</span>
      <button style="background: none; border: none; color: white; cursor: pointer;" id="closeChat"><i class="fas fa-times"></i></button>
    </div>
    <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px;"></div>
    <div style="padding: 10px; display: flex; gap: 5px;">
      <input type="text" id="chatInput" class="form-control" style="margin: 0;" placeholder="Say something...">
      <button class="btn btn-primary" id="sendChatBtn" style="width: auto;"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h2>Welcome</h2>
        <button class="action-btn close-modal" style="width: 32px; height: 32px;"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button class="btn btn-secondary" id="tabLogin" style="background: var(--accent-1);">Log In</button>
          <button class="btn btn-secondary" id="tabSignup">Sign Up</button>
        </div>
        
        <form id="authForm">
          <input type="text" id="authUsername" class="form-control" placeholder="Username (Signup only)" style="display: none;">
          <input type="email" id="authEmail" class="form-control" placeholder="Email Address" required>
          <input type="password" id="authPassword" class="form-control" placeholder="Password" required>
          <p id="authError" style="color: var(--error); font-size: 0.8rem; margin-bottom: 10px;"></p>
          <button type="submit" class="btn btn-primary" id="authSubmitBtn">Log In</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="memeEditorModal">
    <div class="modal-content editor-modal">
      <div class="modal-header">
        <h2>Meme Editor</h2>
        <button class="action-btn close-modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body editor-body">
        <div class="canvas-wrapper" id="editorWrapper">
          <canvas id="memeCanvas"></canvas>
        </div>
        
        <div class="editor-controls">
          <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px;">
             <button class="btn btn-secondary" onclick="editor.addText()" style="flex-shrink: 0; width: auto;"><i class="fas fa-font"></i> Text</button>
             <button class="btn btn-secondary" id="uploadImgBtn" style="flex-shrink: 0; width: auto;"><i class="fas fa-image"></i> Image</button>
             <input type="file" id="imgUploadInput" accept="image/*" hidden>
             <button class="btn btn-secondary" id="addTemplateBtn" style="flex-shrink: 0; width: auto;"><i class="fas fa-smile"></i> Template</button>
             <button class="btn btn-secondary" onclick="editor.toggleDraw()" id="drawBtn" style="flex-shrink: 0; width: auto;"><i class="fas fa-paint-brush"></i> Draw</button>
             <div style="width: 1px; background: rgba(255,255,255,0.2); margin: 0 5px;"></div>
             <button class="btn btn-secondary" onclick="editor.deleteActive()" style="flex-shrink: 0; width: auto; color: var(--error);"><i class="fas fa-trash"></i></button>
          </div>
          
          <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
            <input type="color" id="editorColor" value="#ffffff" style="height: 40px; border: none; background: none; cursor: pointer;">
            <input type="range" id="editorSize" min="10" max="100" value="30" style="flex: 1;">
          </div>
          
          <div style="display: flex; gap: 10px;">
             <input type="text" id="memeTitleInput" class="form-control" placeholder="Meme Title..." style="margin: 0;">
             <button class="btn btn-primary" id="publishMemeBtn" style="width: auto; padding: 0 20px;">Post</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="shopModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-store" style="color: var(--gold);"></i> Cringe Shop</h2>
        <button class="action-btn close-modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div style="background: rgba(255, 215, 0, 0.1); padding: 15px; border-radius: 12px; text-align: center; margin-bottom: 20px; border: 1px solid var(--gold);">
           <div style="font-size: 0.9rem; color: var(--gold);">YOUR BALANCE</div>
           <div style="font-size: 2rem; font-weight: bold; color: white;" id="shopBalanceDisplay">0 CC</div>
        </div>
        <div id="shopGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px;"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="questsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-trophy"></i> Daily Quests</h2>
        <button class="action-btn close-modal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body" id="questsList"></div>
    </div>
  </div>

  <div id="toast" style="position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-secondary); border-left: 4px solid var(--accent-3); padding: 15px 25px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); opacity: 0; transition: all 0.3s; z-index: 3000; display: flex; align-items: center; gap: 10px; min-width: 300px;">
    <i class="fas fa-info-circle" id="toastIcon"></i>
    <div>
      <h4 id="toastTitle" style="margin: 0; font-size: 0.9rem;">Notification</h4>
      <p id="toastMessage" style="margin: 0; font-size: 0.8rem; color: var(--text-secondary);">Message goes here</p>
    </div>
  </div>
  <script>
    // Configuration provided by the environment
    var __firebase_config = (typeof __firebase_config !== 'undefined') ? __firebase_config : '{"apiKey":"AIzaSyCc2YgZOUfKfDw7igOfZgfm3709nXTJTYI","authDomain":"cringescroll-meme.firebaseapp.com","projectId":"cringescroll-meme","storageBucket":"cringescroll-meme.firebasestorage.app","messagingSenderId":"952326661480","appId":"1:952326661480:web:366d94b478a6819168a2dd"}';
    var __app_id = (typeof __app_id !== 'undefined') ? __app_id : 'cringescroll-app-dev';
  </script>

  <script type="module">
    // ===== IMPORTS =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, 
      signOut, updateProfile, signInAnonymously 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, query, where, 
      getDocs, onSnapshot, orderBy, serverTimestamp, increment, limit, runTransaction, writeBatch, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { 
      getStorage, ref, uploadString, getDownloadURL, uploadBytes 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

    // ===== STATE & CONFIG =====
    let app, db, auth, storage;
    let currentUser = null;
    let userId = null;
    let isAnonymous = true;
    const appId = __app_id;

    // Global State Stores
    const store = {
      feed: [],
      lastDoc: null, // For pagination
      isLoading: false,
      hasMore: true,
      tab: 'hot',
      listeners: [] // To clean up on logout
    };

    // Shop Configuration
    const SHOP_ITEMS = {
      'name_gold': { id: 'name_gold', name: 'Golden Name', price: 50, type: 'effect', cssClass: 'effect-gold-name', icon: 'fa-crown', desc: 'Your name shines in gold.' },
      'text_neon': { id: 'text_neon', name: 'Neon Text', price: 75, type: 'effect', cssClass: 'effect-neon-text', icon: 'fa-bolt', desc: 'Matrix style terminal text.' },
      'border_fire': { id: 'border_fire', name: 'Fire Border', price: 100, type: 'effect', cssClass: 'effect-fire-border', icon: 'fa-fire', desc: 'Hot border for your memes.' }
    };

    // Paths Helper
    const paths = {
      publicUser: (uid) => doc(db, `artifacts/${appId}/public/data/users/${uid}`),
      privateUser: (uid) => doc(db, `artifacts/${appId}/users/${uid}/data/main`),
      memes: () => collection(db, `artifacts/${appId}/public/data/memes`),
      meme: (id) => doc(db, `artifacts/${appId}/public/data/memes/${id}`),
      chat: () => collection(db, `artifacts/${appId}/public/data/chat`)
    };

    // ===== UTILITIES =====
    const $ = (id) => document.getElementById(id);
    
    // Performance: Debounce function to limit rapid-fire events (like scroll or resize)
    const debounce = (func, wait) => {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    };

    // Security: Prevent XSS
    const escapeHtml = (str) => {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    };

    // Formatting
    const formatNumber = (num) => {
      if (!num) return '0';
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    };

    const timeAgo = (date) => {
      if (!date) return 'just now';
      const seconds = Math.floor((new Date() - date) / 1000);
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y ago";
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo ago";
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d ago";
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h ago";
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m ago";
      return "just now";
    };

    // Toast Notification System
    const showToast = (title, message, type = 'info') => {
      const toast = $('toast');
      const icon = $('toastIcon');
      
      $('toastTitle').textContent = title;
      $('toastMessage').textContent = message;
      
      // Reset classes
      toast.className = ''; 
      toast.style.borderLeftColor = type === 'error' ? 'var(--error)' : (type === 'success' ? 'var(--success)' : 'var(--accent-3)');
      
      if (type === 'success') icon.className = 'fas fa-check-circle';
      else if (type === 'error') icon.className = 'fas fa-exclamation-triangle';
      else icon.className = 'fas fa-info-circle';
      
      icon.style.color = toast.style.borderLeftColor;
      
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(100px)';
      }, 3000);
    };

    // Initialization
    const initFirebase = () => {
      try {
        const config = JSON.parse(__firebase_config);
        app = initializeApp(config);
        db = getFirestore(app);
        auth = getAuth(app);
        storage = getStorage(app);
        
        // Auth Listener
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            userId = user.uid;
            isAnonymous = user.isAnonymous;
            await loadUserProfile(user.uid);
            if(isAnonymous) showToast('Guest Mode', 'You are browsing anonymously.');
          } else {
            signInAnonymously(auth).catch(console.error);
          }
          // Initial Feed Load
          loadFeed(true);
        });
      } catch (e) {
        console.error("Firebase Init Failed", e);
        showToast("Error", "Failed to connect to servers.", "error");
      }
    };
    // ===== USER DATA & AUTH LOGIC =====
    
    const loadUserProfile = async (uid) => {
      // 1. Listen to Public Data (Profile, Coins, Inventory)
      const unsubPublic = onSnapshot(paths.publicUser(uid), (doc) => {
        if (doc.exists()) {
          const data = doc.data();
          currentUser = { ...currentUser, ...data };
          updateUI();
          
          // Apply inventory effects dynamically
          if (currentUser.inventory) {
             // Logic to apply themes or border effects would go here
             // For now, we handle specific item effects in the renderMeme function
          }
        }
      });
      store.listeners.push(unsubPublic);

      // 2. Listen to Private Data (Quests, Settings)
      // Only if not anonymous
      if (!isAnonymous) {
        const unsubPrivate = onSnapshot(paths.privateUser(uid), async (doc) => {
          if (doc.exists()) {
            const data = doc.data();
            currentUser = { ...currentUser, ...data }; // Merge private data
            
            // Check Daily Quests Reset
            await checkDailyQuests(uid, data.quests);
            updateUI();
          } else {
            // Create default private data if missing
            await setDoc(paths.privateUser(uid), {
              quests: { lastReset: new Date().toISOString().split('T')[0], reactions: 0, posts: 0, claims: [] }
            }, { merge: true });
          }
        });
        store.listeners.push(unsubPrivate);
      }
    };

    const updateUI = () => {
      // Update Balance in Shop
      const balanceEl = $('shopBalanceDisplay');
      if(balanceEl) balanceEl.textContent = `${currentUser?.cringeCoin || 0} CC`;

      // Update Auth Buttons
      if (isAnonymous) {
        $('menuLogin').style.display = 'flex';
        $('menuLogout').style.display = 'none';
        $('navCreateBtn').onclick = (e) => { e.preventDefault(); showToast('Login Required', 'You must log in to create memes.', 'error'); showAuthModal(); };
      } else {
        $('menuLogin').style.display = 'none';
        $('menuLogout').style.display = 'flex';
        $('navCreateBtn').onclick = (e) => { e.preventDefault(); openEditor(); };
      }
      
      // Update Quest UI if modal is open
      if($('questsModal').classList.contains('active')) renderQuests();
    };

    const showAuthModal = () => { $('authModal').classList.add('active'); };
    
    // Auth Actions
    const handleLogin = async (e) => {
      e.preventDefault();
      const email = $('authEmail').value;
      const pass = $('authPassword').value;
      const btn = $('authSubmitBtn');
      const err = $('authError');
      
      try {
        btn.textContent = 'Loading...'; btn.disabled = true; err.textContent = '';
        await signInWithEmailAndPassword(auth, email, pass);
        $('authModal').classList.remove('active');
        showToast('Welcome Back', 'Logged in successfully.', 'success');
      } catch (error) {
        err.textContent = error.message;
      } finally {
        btn.textContent = 'Log In'; btn.disabled = false;
      }
    };

    const handleSignup = async (e) => {
      e.preventDefault();
      const email = $('authEmail').value;
      const pass = $('authPassword').value;
      const user = $('authUsername').value;
      const btn = $('authSubmitBtn');
      const err = $('authError');

      if(user.length < 3) { err.textContent = 'Username too short.'; return; }

      try {
        btn.textContent = 'Creating...'; btn.disabled = true; err.textContent = '';
        
        // 1. Create Auth
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        const uid = cred.user.uid;
        
        // 2. Create Public Profile
        await setDoc(paths.publicUser(uid), {
          username: user,
          cringeCoin: 50, // Starter bonus
          avatar: `https://ui-avatars.com/api/?name=${user}&background=random`,
          inventory: {},
          createdAt: serverTimestamp()
        });

        // 3. Create Private Data
        await setDoc(paths.privateUser(uid), {
          quests: { lastReset: new Date().toISOString().split('T')[0], reactions: 0, posts: 0, claims: [] }
        });

        await updateProfile(cred.user, { displayName: user });
        $('authModal').classList.remove('active');
        showToast('Account Created', 'Here is 50 free CringeCoin!', 'success');
      } catch (error) {
        err.textContent = error.message;
      } finally {
        btn.textContent = 'Sign Up'; btn.disabled = false;
      }
    };
    
    const handleLogout = async () => {
      store.listeners.forEach(unsub => unsub()); // Detach listeners
      store.listeners = [];
      await signOut(auth);
      location.reload(); // Hard reload to clear state
    };

    // ===== QUESTS & SHOP LOGIC =====

    const checkDailyQuests = async (uid, questData) => {
      const today = new Date().toISOString().split('T')[0];
      // If no data or date mismatch, reset
      if (!questData || questData.lastReset !== today) {
        await updateDoc(paths.privateUser(uid), {
          quests: {
            lastReset: today,
            reactions: 0,
            posts: 0,
            claims: []
          }
        });
      }
    };

    const renderQuests = () => {
      const list = $('questsList');
      list.innerHTML = '';
      
      const qData = currentUser?.quests || { reactions: 0, posts: 0, claims: [] };
      
      // Define Quests Definitions Here
      const quests = [
        { id: 'q_react', title: 'Critic', desc: 'React to 5 memes', goal: 5, current: qData.reactions || 0, reward: 10 },
        { id: 'q_post', title: 'Creator', desc: 'Post 1 meme', goal: 1, current: qData.posts || 0, reward: 25 }
      ];

      quests.forEach(q => {
        const isCompleted = q.current >= q.goal;
        const isClaimed = qData.claims?.includes(q.id);
        const progress = Math.min(100, (q.current / q.goal) * 100);

        const el = document.createElement('div');
        el.style.background = 'rgba(255,255,255,0.05)';
        el.style.padding = '15px';
        el.style.borderRadius = '12px';
        el.style.marginBottom = '10px';
        el.innerHTML = `
          <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <strong>${q.title}</strong>
            <span style="color:var(--gold);">+${q.reward} CC</span>
          </div>
          <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:8px;">${q.desc}</div>
          <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:3px; margin-bottom:10px;">
            <div style="width:${progress}%; height:100%; background:var(--accent-3); border-radius:3px;"></div>
          </div>
          <button class="btn btn-sm ${isClaimed ? 'btn-secondary' : 'btn-primary'}" 
             ${(!isCompleted || isClaimed) ? 'disabled' : ''}
             onclick="claimQuest('${q.id}', ${q.reward})">
             ${isClaimed ? 'Claimed' : (isCompleted ? 'Claim Reward' : `${q.current}/${q.goal}`)}
          </button>
        `;
        list.appendChild(el);
      });
    };
    
    // Exposed globally for onclick
    window.claimQuest = async (qid, reward) => {
      if(!userId) return;
      try {
        await runTransaction(db, async (t) => {
           // 1. Get fresh data
           const pRef = paths.privateUser(userId);
           const pubRef = paths.publicUser(userId);
           const doc = await t.get(pRef);
           const data = doc.data();
           
           if(data.quests.claims.includes(qid)) throw "Already claimed";
           
           // 2. Add to claims
           const newClaims = [...(data.quests.claims || []), qid];
           t.update(pRef, { 'quests.claims': newClaims });
           
           // 3. Give Money
           t.update(pubRef, { cringeCoin: increment(reward) });
        });
        showToast('Quest Complete', `+${reward} CC added to your wallet!`, 'success');
      } catch(e) { console.error(e); }
    };

    const renderShop = () => {
      const grid = $('shopGrid');
      grid.innerHTML = '';
      const inventory = currentUser?.inventory || {};

      Object.values(SHOP_ITEMS).forEach(item => {
        const owned = inventory[item.id];
        const el = document.createElement('div');
        el.className = 'meme-card'; // Reuse card style
        el.style.padding = '15px';
        el.style.alignItems = 'center';
        el.style.textAlign = 'center';
        el.innerHTML = `
          <div style="font-size: 2rem; margin-bottom: 10px;" class="${item.cssClass}"><i class="fas ${item.icon}"></i></div>
          <div style="font-weight:bold; margin-bottom:5px;">${item.name}</div>
          <div style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:10px;">${item.desc}</div>
          <button class="btn ${owned ? 'btn-secondary' : 'btn-primary'}" 
            ${owned ? 'disabled' : ''} onclick="buyItem('${item.id}')">
            ${owned ? 'Owned' : `${item.price} CC`}
          </button>
        `;
        grid.appendChild(el);
      });
    };

    window.buyItem = async (itemId) => {
      const item = SHOP_ITEMS[itemId];
      if(!currentUser || (currentUser.cringeCoin < item.price)) {
        showToast('Too Poor', 'Get more CringeCoins by posting memes!', 'error');
        return;
      }
      
      if(!confirm(`Buy ${item.name} for ${item.price} CC?`)) return;

      try {
        await runTransaction(db, async (t) => {
          const ref = paths.publicUser(userId);
          const doc = await t.get(ref);
          const coins = doc.data().cringeCoin;
          
          if(coins < item.price) throw "Insufficient funds";
          
          t.update(ref, {
            cringeCoin: increment(-item.price),
            [`inventory.${itemId}`]: true
          });
        });
        showToast('Purchased!', `You now own ${item.name}`, 'success');
        renderShop();
      } catch(e) {
        showToast('Error', 'Transaction failed.', 'error');
      }
    };
    // ===== MEME EDITOR CLASS =====
    class MemeEditor {
      constructor() {
        this.canvas = null;
        this.container = $('editorWrapper');
        this.colorInput = $('editorColor');
        this.sizeInput = $('editorSize');
        this.isDrawing = false;
        
        // Bind UI events once
        this.colorInput.addEventListener('input', (e) => this.updateActiveObject('fill', e.target.value));
        this.sizeInput.addEventListener('input', (e) => this.updateActiveObject('fontSize', parseInt(e.target.value)));
        
        // Handle Image Upload
        $('imgUploadInput').addEventListener('change', (e) => this.handleImageUpload(e));
        $('uploadImgBtn').addEventListener('click', () => $('imgUploadInput').click());
        
        // Handle Publish
        $('publishMemeBtn').addEventListener('click', () => this.publish());
        
        // Template quick loads
        $('addTemplateBtn').addEventListener('click', () => {
             // Random templates
             const templates = [
                 'https://i.imgur.com/1v8wL4G.jpg', // Distracted
                 'https://i.imgur.com/pJbPZJ7.jpg', // Drake
                 'https://i.imgur.com/vRtKxXK.jpg'  // Change my mind
             ];
             this.addImage(templates[Math.floor(Math.random() * templates.length)], true);
        });
      }

      init() {
        if (this.canvas) {
           this.canvas.clear();
           this.canvas.setBackgroundColor('#000', this.canvas.renderAll.bind(this.canvas));
           return;
        }

        // Initialize Fabric
        const width = this.container.clientWidth;
        const height = Math.min(window.innerHeight * 0.6, width); // Responsive height
        
        this.canvas = new fabric.Canvas('memeCanvas', {
          width: width,
          height: height,
          backgroundColor: '#000',
          selection: true
        });

        // Responsive resize listener
        window.addEventListener('resize', debounce(() => {
           const newWidth = this.container.clientWidth;
           const scale = newWidth / this.canvas.getWidth();
           this.canvas.setDimensions({ width: newWidth, height: this.canvas.getHeight() * scale });
           this.canvas.setZoom(this.canvas.getZoom() * scale);
           this.canvas.renderAll();
        }, 200));

        // Listener to update UI when object is selected
        this.canvas.on('selection:created', (e) => this.syncUI(e.selected[0]));
        this.canvas.on('selection:updated', (e) => this.syncUI(e.selected[0]));
      }

      syncUI(obj) {
        if(!obj) return;
        if(obj.fill) this.colorInput.value = obj.fill;
        if(obj.fontSize) this.sizeInput.value = obj.fontSize;
      }

      addText() {
        const text = new fabric.IText('Tap to Edit', {
          left: 50, top: 50,
          fontFamily: 'Impact',
          fill: this.colorInput.value,
          stroke: '#000', strokeWidth: 2,
          fontSize: parseInt(this.sizeInput.value)
        });
        this.canvas.add(text);
        this.canvas.setActiveObject(text);
      }

      handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (f) => {
          const data = f.target.result;
          fabric.Image.fromURL(data, (img) => {
             // Scale image to fit canvas width
             const scale = this.canvas.width / img.width;
             img.scale(scale);
             // Center it
             img.set({ top: this.canvas.height/2 - (img.height*scale)/2 });
             this.canvas.add(img);
             this.canvas.sendToBack(img);
          });
        };
        reader.readAsDataURL(file);
      }

      // Add image from URL (Template)
      addImage(url, isBackground = false) {
        fabric.Image.fromURL(url, (img) => {
           if(isBackground) {
               const scale = Math.max(this.canvas.width / img.width, this.canvas.height / img.height);
               img.scale(scale);
               this.canvas.centerObject(img);
               this.canvas.setBackgroundImage(img, this.canvas.renderAll.bind(this.canvas));
           } else {
               img.scaleToWidth(this.canvas.width / 3);
               this.canvas.add(img);
           }
        }, { crossOrigin: 'anonymous' });
      }

      toggleDraw() {
        this.isDrawing = !this.isDrawing;
        this.canvas.isDrawingMode = this.isDrawing;
        this.canvas.freeDrawingBrush.width = 5;
        this.canvas.freeDrawingBrush.color = this.colorInput.value;
        $('drawBtn').style.background = this.isDrawing ? 'var(--accent-3)' : '';
      }

      deleteActive() {
        const active = this.canvas.getActiveObjects();
        if (active.length) {
          this.canvas.discardActiveObject();
          active.forEach((obj) => this.canvas.remove(obj));
        }
      }

      updateActiveObject(prop, val) {
        const obj = this.canvas.getActiveObject();
        if(this.isDrawing) {
            this.canvas.freeDrawingBrush.color = this.colorInput.value;
        }
        if (obj) {
          obj.set(prop, val);
          this.canvas.renderAll();
        }
      }

      async publish() {
        const title = $('memeTitleInput').value.trim();
        if (!title) { showToast('Error', 'Please enter a title', 'error'); return; }
        if (!userId) { showToast('Error', 'You must log in', 'error'); return; }

        const btn = $('publishMemeBtn');
        btn.textContent = 'Posting...'; btn.disabled = true;

        try {
            // 1. Export to Blob (WebP 80% quality)
            const dataURL = this.canvas.toDataURL({ format: 'webp', quality: 0.8, multiplier: 1.5 });
            
            // 2. Upload to Firebase Storage
            const storageRef = ref(storage, `memes/${userId}/${Date.now()}.webp`);
            const uploadTask = await uploadString(storageRef, dataURL, 'data_url');
            const downloadURL = await getDownloadURL(uploadTask.ref);
            
            // 3. Save Metadata to Firestore
            await addDoc(paths.memes(), {
                title: title,
                url: downloadURL,
                userId: userId,
                username: currentUser.username,
                // Save effects if user has them enabled
                effect: currentUser.preferences?.nameColor || null, 
                createdAt: serverTimestamp(),
                likes: 0,
                commentCount: 0
            });

            // 4. Update Quest
            await updateDoc(paths.privateUser(userId), { 'quests.posts': increment(1) });
            
            // 5. Cleanup
            $('memeEditorModal').classList.remove('active');
            $('memeTitleInput').value = '';
            showToast('Success', 'Meme posted! +10 CC', 'success');
            
            // Refresh feed to show new meme
            loadFeed(true);

        } catch (error) {
            console.error(error);
            showToast('Error', 'Failed to upload.', 'error');
        } finally {
            btn.textContent = 'Post'; btn.disabled = false;
        }
      }
    }

    // Initialize Editor Instance
    const editor = new MemeEditor();
    
    // Global function to open editor
    window.openEditor = () => {
        $('memeEditorModal').classList.add('active');
        // Small delay to ensure modal is visible so dimensions are correct
        setTimeout(() => editor.init(), 100);
    };
    // ===== FEED & INTERACTION LOGIC =====

    const loadFeed = async (reset = false) => {
      if (store.isLoading || (!reset && !store.hasMore)) return;
      store.isLoading = true;
      
      const feedEl = $('feed');
      if (reset) {
        feedEl.innerHTML = '';
        store.lastDoc = null;
        store.hasMore = true;
        // Re-add spinner
        const spinner = document.createElement('div');
        spinner.className = 'loading-spinner';
        spinner.id = 'feedLoader';
        feedEl.appendChild(spinner);
      }

      try {
        let q;
        const memesCol = paths.memes();
        
        // Tab Logic
        if (store.tab === 'hot') {
           q = query(memesCol, orderBy('likes', 'desc'), limit(10));
        } else if (store.tab === 'fresh') {
           q = query(memesCol, orderBy('createdAt', 'desc'), limit(10));
        } else if (store.tab === 'mymemes') {
           if (!userId) { 
             $('feedLoader')?.remove(); 
             feedEl.innerHTML = '<div style="text-align:center; padding:40px;">Please log in to see your memes.</div>'; 
             store.isLoading = false; return; 
           }
           q = query(memesCol, where('userId', '==', userId), orderBy('createdAt', 'desc'), limit(10));
        }

        // Pagination
        if (store.lastDoc && !reset) {
           q = query(q, startAfter(store.lastDoc));
        }

        const snapshot = await getDocs(q);
        
        // Remove loader to append real content
        $('feedLoader')?.remove();

        if (snapshot.empty) {
           store.hasMore = false;
           if(reset) feedEl.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-secondary);">No memes found here. Be the first to post!</div>';
           return;
        }

        store.lastDoc = snapshot.docs[snapshot.docs.length - 1];
        
        snapshot.forEach(doc => {
           renderMeme(doc.id, doc.data());
        });

        // Add loader back to bottom for next scroll
        if(store.hasMore) {
           const spinner = document.createElement('div');
           spinner.className = 'loading-spinner';
           spinner.id = 'feedLoader';
           feedEl.appendChild(spinner);
        }

      } catch (error) {
        console.error("Feed Error", error);
        showToast('Error', 'Could not load feed.', 'error');
      } finally {
        store.isLoading = false;
      }
    };

    const renderMeme = (id, data) => {
      const feedEl = $('feed');
      // Ensure we insert before the loader if it exists
      const loader = $('feedLoader');
      
      const el = document.createElement('div');
      
      // 1. APPLY SHOP EFFECTS
      // Check if creator has special border effect saved in meme data
      let cardClass = 'meme-card';
      if (data.effect === 'border_fire') cardClass += ' effect-fire-border';
      
      // Check if creator has name color effect
      let nameClass = '';
      if (data.effect === 'name_gold') nameClass = 'effect-gold-name';
      else if (data.effect === 'text_neon') nameClass = 'effect-neon-text';

      el.className = cardClass;
      el.innerHTML = `
        <div class="card-header">
          <div>
            <div class="meme-title">${escapeHtml(data.title)}</div>
            <div class="meme-meta">
              <span class="user-badge ${nameClass}"><i class="fas fa-user"></i> ${escapeHtml(data.username)}</span>
              <span>• ${timeAgo(data.createdAt?.toDate())}</span>
            </div>
          </div>
          <button class="action-btn" style="width:30px; height:30px; font-size:0.8rem;"><i class="fas fa-ellipsis-v"></i></button>
        </div>
        
        <div class="meme-image-container" id="img-${id}">
          <i class="fas fa-heart like-animation" id="anim-${id}"></i>
          <img class="meme-image" src="${data.url}" loading="lazy" alt="Meme">
        </div>

        <div class="card-footer">
          <div class="reaction-bar">
            <button class="reaction-btn" onclick="handleReaction('${id}', 'likes')">
              <i class="fas fa-fire"></i> <span id="count-likes-${id}">${formatNumber(data.likes || 0)}</span>
            </button>
            <button class="reaction-btn" onclick="handleReaction('${id}', 'skull')">
              <i class="fas fa-skull"></i>
            </button>
            <button class="reaction-btn" onclick="handleReaction('${id}', 'clown')">
              <i class="fas fa-poo"></i>
            </button>
          </div>
          <div class="action-buttons">
            <div class="card-btn"><i class="fas fa-share"></i> Share</div>
            <div class="card-btn"><i class="fas fa-comment"></i> ${data.commentCount || 0}</div>
          </div>
        </div>
      `;
      
      if(loader) feedEl.insertBefore(el, loader);
      else feedEl.appendChild(el);

      // 2. DOUBLE TAP LOGIC
      const imgContainer = document.getElementById(`img-${id}`);
      let lastTap = 0;
      
      imgContainer.addEventListener('click', (e) => {
         const currentTime = new Date().getTime();
         const tapLength = currentTime - lastTap;
         if (tapLength < 500 && tapLength > 0) {
            // Double Tap Detected
            triggerLikeAnimation(id);
            handleReaction(id, 'likes');
            e.preventDefault();
         }
         lastTap = currentTime;
      });
    };

    const triggerLikeAnimation = (id) => {
       const heart = document.getElementById(`anim-${id}`);
       if(heart) {
         heart.classList.add('animate');
         // Vibration for mobile (Haptic Feedback)
         if(navigator.vibrate) navigator.vibrate(50);
         setTimeout(() => heart.classList.remove('animate'), 800);
       }
    };

    window.handleReaction = async (memeId, type) => {
       if(!userId) { showToast('Login Required', 'Please log in to react.', 'error'); return; }
       
       // Optimistic UI Update (Visual only)
       if(type === 'likes') {
          const countEl = document.getElementById(`count-likes-${memeId}`);
          if(countEl) {
             let val = parseInt(countEl.innerText.replace(/,/g,'').replace(/k/g,'000')); 
             countEl.innerText = formatNumber(val + 1);
          }
       }

       // Update Quest Progress
       if(!isAnonymous) updateDoc(paths.privateUser(userId), { 'quests.reactions': increment(1) });

       // Database Update
       try {
         await updateDoc(paths.meme(memeId), { likes: increment(1) });
       } catch(e) { console.error(e); }
    };

    // ===== CHAT LOGIC =====
    let chatUnsub;
    const initChat = () => {
       if(chatUnsub) return; // Already listening
       
       const q = query(paths.chat(), orderBy('timestamp', 'desc'), limit(30));
       chatUnsub = onSnapshot(q, (snapshot) => {
          const div = $('chatMessages');
          div.innerHTML = '';
          const msgs = snapshot.docs.reverse(); // Show newest at bottom
          
          msgs.forEach(doc => {
             const d = doc.data();
             const el = document.createElement('div');
             el.style.background = 'rgba(255,255,255,0.05)';
             el.style.padding = '8px 12px';
             el.style.borderRadius = '8px';
             el.style.fontSize = '0.9rem';
             el.innerHTML = `<strong style="color:var(--accent-3);">${escapeHtml(d.username)}:</strong> ${escapeHtml(d.text)}`;
             div.appendChild(el);
          });
          div.scrollTop = div.scrollHeight;
       });
    };

    const sendChat = async () => {
       const input = $('chatInput');
       const text = input.value.trim();
       if(!text) return;
       if(!userId) { showToast('Error', 'Log in to chat.', 'error'); return; }
       
       input.value = '';
       await addDoc(paths.chat(), {
          text: text,
          username: currentUser.username || 'Anon',
          userId: userId,
          timestamp: serverTimestamp()
       });
    };

    // ===== INITIALIZATION & EVENTS =====

    document.addEventListener('DOMContentLoaded', () => {
       initFirebase();
       initChat();
       
       // Menu Toggles
       const toggleSidebar = () => { $('sidebar').style.right = $('sidebar').style.right === '0px' ? '-300px' : '0px'; };
       $('menuToggleBtn').onclick = toggleSidebar;
       $('closeSidebar').onclick = toggleSidebar;
       
       // Chat Toggle
       const toggleChat = () => { 
           const win = $('chatWindow');
           win.style.transform = win.style.transform === 'translateY(0)' ? 'translateY(120%)' : 'translateY(0)';
       };
       $('menuChat').onclick = () => { toggleSidebar(); toggleChat(); };
       $('closeChat').onclick = toggleChat;
       $('sendChatBtn').onclick = sendChat;
       $('chatInput').onkeypress = (e) => { if(e.key === 'Enter') sendChat(); };

       // Tabs
       const tabs = document.querySelectorAll('.nav-item[data-tab]');
       tabs.forEach(t => t.onclick = (e) => {
           if(t.id === 'navCreateBtn') return; // Handled in updateUI
           e.preventDefault();
           // Update Active State
           tabs.forEach(x => x.classList.remove('active'));
           t.classList.add('active');
           // Reload Feed
           store.tab = t.dataset.tab;
           loadFeed(true);
       });

       // Modals
       const closeModal = (e) => { e.target.closest('.modal-overlay').classList.remove('active'); };
       document.querySelectorAll('.close-modal').forEach(b => b.onclick = closeModal);

       // Menu Links
       $('menuLogin').onclick = () => { toggleSidebar(); showAuthModal(); };
       $('menuLogout').onclick = handleLogout;
       $('menuQuests').onclick = () => { toggleSidebar(); $('questsModal').classList.add('active'); renderQuests(); };
       $('menuShop').onclick = () => { toggleSidebar(); $('shopModal').classList.add('active'); renderShop(); };
       $('menuSettings').onclick = () => showToast('Coming Soon', 'Settings are under construction.');
       $('menuLeaderboard').onclick = () => showToast('Coming Soon', 'Leaderboard resets weekly.');
       
       // Auth Forms
       $('authForm').onsubmit = (e) => {
           if($('tabLogin').classList.contains('btn-primary')) handleLogin(e);
           else handleSignup(e);
       };
       $('tabLogin').onclick = (e) => { 
           e.preventDefault(); 
           $('tabLogin').className = 'btn btn-primary'; $('tabSignup').className = 'btn btn-secondary';
           $('authUsername').style.display = 'none'; $('authSubmitBtn').textContent = 'Log In';
       };
       $('tabSignup').onclick = (e) => { 
           e.preventDefault(); 
           $('tabSignup').className = 'btn btn-primary'; $('tabLogin').className = 'btn btn-secondary';
           $('authUsername').style.display = 'block'; $('authSubmitBtn').textContent = 'Sign Up';
       };

       // Search
       $('searchInput').addEventListener('keyup', debounce((e) => {
          if(e.key === 'Enter') showToast('Search', 'Search filtering coming in update v1.2');
       }, 500));

       // Infinite Scroll
       $('feed').addEventListener('scroll', debounce((e) => {
          const el = e.target;
          // Trigger load when 200px from bottom
          if(el.scrollHeight - el.scrollTop - el.clientHeight < 200) {
             loadFeed();
          }
       }, 200));

       // Draggable Chat
       const header = $('chatHeader');
       const win = $('chatWindow');
       let isDown = false, offset = [0,0];
       
       header.addEventListener('mousedown', (e) => { isDown = true; offset = [win.offsetLeft - e.clientX, win.offsetTop - e.clientY]; });
       document.addEventListener('mouseup', () => { isDown = false; });
       document.addEventListener('mousemove', (e) => {
          if(isDown) { win.style.left = (e.clientX + offset[0]) + 'px'; win.style.top = (e.clientY + offset[1]) + 'px'; win.style.bottom = 'auto'; win.style.right = 'auto'; }
       });
    });

    // Import helper from Part 3 logic for Firestore Query
    import { startAfter } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  </script>
</body>
</html>
