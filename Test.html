  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #161625;
      --card-bg: #1a1a2a;
      --card-border: rgba(120, 100, 200, 0.15);
      --text-primary: #f0f0ff;
      --text-secondary: #a0a0c0;
      --accent-purple: #b993d9;
      --accent-blue: #89b4fa;
      --accent-pink: #f5bde6;
      --accent-green: #a6e3a1;
      --accent-yellow: #f9e2af;
      --border-radius: 18px;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 15px 50px rgba(0, 0, 0, 0.4);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --header-height: 68px;
      --sidebar-width: 280px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(94, 71, 156, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(137, 180, 250, 0.05) 0%, transparent 20%);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      display: flex;
      min-height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* SIDEBAR NAVIGATION */
    .sidebar {
      width: var(--sidebar-width);
      background: rgba(20, 20, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(120, 100, 200, 0.1);
      height: 100dvh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      transform: translateX(0);
      transition: var(--transition);
      box-shadow: var(--shadow-md);
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
    }

    .logo-container {
      padding: 0 24px 20px;
      border-bottom: 1px solid rgba(120, 100, 200, 0.15);
      margin-bottom: 15px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(137, 180, 250, 0.3);
      position: relative;
      overflow: hidden;
    }

    .logo-icon span {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-section {
      padding: 0 24px 16px;
      margin-bottom: 10px;
    }

    .nav-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      transition: var(--transition);
      position: relative;
    }

    .nav-item:hover, .nav-item.active {
      background: rgba(137, 180, 250, 0.1);
      color: var(--accent-blue);
    }

    .nav-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--accent-blue);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: var(--transition);
    }

    .nav-item.active::before {
      transform: scaleY(1);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    /* MAIN CONTENT AREA */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      transition: var(--transition);
    }

    .main-content.sidebar-collapsed {
      margin-left: 0;
    }

    header {
      height: var(--header-height);
      background: rgba(20, 20, 35, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(120, 100, 200, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 999;
    }

    .mobile-nav-btns {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .hamburger-btn {
      background: none;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-blue);
      cursor: pointer;
      transition: var(--transition);
    }

    .hamburger-btn:hover {
      background: rgba(137, 180, 250, 0.1);
    }

    .search-bar {
      flex: 1;
      max-width: 500px;
      position: relative;
      margin: 0 16px;
    }

    .search-input {
      width: 100%;
      background: rgba(30, 30, 50, 0.7);
      border: 1px solid rgba(120, 100, 200, 0.2);
      border-radius: 14px;
      padding: 12px 20px 12px 48px;
      color: var(--text-primary);
      font-size: 16px;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      background: rgba(30, 30, 50, 0.7);
      border: 1px solid rgba(120, 100, 200, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .action-btn:hover {
      background: rgba(137, 180, 250, 0.15);
      color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .notification-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background: var(--accent-pink);
      color: white;
      font-size: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 0 0 2px var(--bg-primary);
    }

    .create-btn {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 0 20px;
      height: 44px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(137, 180, 250, 0.4);
      transition: var(--transition);
    }

    .create-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 6px 25px rgba(137, 180, 250, 0.6);
    }

    /* CONTENT AREA */
    .content-area {
      padding: 20px;
      overflow-y: auto;
      height: calc(100dvh - var(--header-height));
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .panel-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      display: inline-block;
    }

    .panel-title::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(to right, var(--accent-purple), var(--accent-blue));
      border-radius: 2px;
      opacity: 0.7;
    }

    .tab-container {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 30, 50, 0.5);
      border: 1px solid rgba(120, 100, 200, 0.2);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      color: var(--accent-blue);
    }

    .tab-btn.active {
      background: rgba(137, 180, 250, 0.15);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(137, 180, 250, 0.2);
    }

    .tab-btn svg {
      width: 18px;
      height: 18px;
    }

    /* MEME CARDS */
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      padding-bottom: 40px;
    }

    .meme-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      position: relative;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .meme-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: var(--shadow-lg);
      z-index: 10;
    }

    .card-header {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 2;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
    }

    .username {
      font-weight: 600;
      font-size: 15px;
      color: var(--accent-blue);
    }

    .post-time {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 4px;
    }

    .card-btn {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: rgba(30, 30, 50, 0.7);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .card-btn:hover {
      background: rgba(137, 180, 250, 0.2);
      color: var(--accent-blue);
    }

    .meme-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      margin: 0 14px 12px;
      color: var(--text-primary);
      word-break: break-word;
    }

    .meme-image-container {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1/1;
      background: #0a0a15;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .meme-card:hover .meme-image-container {
      transform: scale(1.02);
    }

    .meme-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: var(--transition);
      opacity: 0;
    }

    .meme-image.loaded {
      opacity: 1;
    }

    .badge-container {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 3;
    }

    .reaction-badge {
      background: rgba(166, 227, 161, 0.9);
      color: #0f172a;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(5px);
      box-shadow: 0 2px 8px rgba(166, 227, 161, 0.3);
    }

    .card-footer {
      padding: 14px;
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }

    .reactions {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    .reaction-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .reaction-btn {
      font-size: 22px;
      margin-bottom: 4px;
      transition: var(--transition);
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
    }

    .reaction-btn:hover {
      transform: scale(1.3) rotate(10deg);
      filter: drop-shadow(0 0 8px var(--accent-blue));
    }

    .reaction-count {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-green);
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
    }

    .action-button {
      flex: 1;
      padding: 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      color: white;
    }

    .action-button.tip {
      background: linear-gradient(135deg, #f5bde6, #c6a0f6);
    }

    .action-button.claim {
      background: linear-gradient(135deg, #f9e2af, #fab387);
    }

    .action-button.save {
      background: linear-gradient(135deg, #a6e3a1, #89b4fa);
    }

    .action-button.remix {
      background: linear-gradient(135deg, #89b4fa, #cba6f7);
    }

    .action-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }

    /* PANELS */
    .panel {
      position: fixed;
      top: 0;
      right: -380px;
      width: 360px;
      height: 100dvh;
      background: rgba(26, 26, 42, 0.95);
      backdrop-filter: blur(15px);
      border-left: 1px solid var(--card-border);
      z-index: 1500;
      transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: -5px 0 30px rgba(0, 0, 0, 0.4);
    }

    .panel.open {
      right: 0;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-content {
      padding: 20px;
      overflow-y: auto;
      height: calc(100% - 70px);
    }

    .close-panel {
      background: none;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }

    .close-panel:hover {
      background: rgba(137, 180, 250, 0.1);
      color: var(--accent-blue);
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: rgba(26, 26, 42, 0.95);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      width: 90%;
      max-width: 500px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-lg);
      transform: translateY(20px);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .modal.open .modal-content {
      transform: translateY(0);
      opacity: 1;
    }

    /* NOTIFICATIONS */
    .notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(26, 26, 42, 0.95);
      backdrop-filter: blur(10px);
      color: var(--text-primary);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-lg);
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 3000;
      max-width: 350px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .notification.show {
      transform: translateX(0);
    }

    .notification-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(137, 180, 250, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .notification-content {
      flex: 1;
    }

    .notification-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--accent-blue);
    }

    .notification-message {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* LOADING STATES */
    .skeleton-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      height: 480px;
      position: relative;
      overflow: hidden;
    }

    .skeleton-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* UTILITIES */
    .hidden {
      display: none !important;
    }

    .text-center {
      text-align: center;
    }

    .mt-20 {
      margin-top: 20px;
    }

    /* RESPONSIVE DESIGN */
    @media (max-width: 1024px) {
      :root {
        --sidebar-width: 80px;
      }
      
      .sidebar {
        width: var(--sidebar-width);
        overflow: hidden;
      }
      
      .logo-text, .nav-title, .nav-item span, .profile-info {
        display: none;
      }
      
      .logo-icon {
        margin: 0 auto;
      }
      
      .nav-item {
        justify-content: center;
        padding: 16px 0;
      }
      
      .nav-item svg {
        margin: 0 auto;
      }
    }

    @media (max-width: 768px) {
      :root {
        --sidebar-width: 0;
      }
      
      .sidebar {
        transform: translateX(-100%);

  // Three.js background initialization
  function initThreeBackground() {
    const canvas = document.getElementById('background-canvas');
    if (!canvas) return;
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ 
      canvas, 
      alpha: true,
      antialias: true
    });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    // Create particle system
    const particleCount = 2000;
    const particles = new THREE.BufferGeometry();
    const posArray = new Float32Array(particleCount * 3);
    const sizeArray = new Float32Array(particleCount);
    
    for (let i = 0; i < particleCount * 3; i += 3) {
      posArray[i] = (Math.random() - 0.5) * 20;
      posArray[i + 1] = (Math.random() - 0.5) * 20;
      posArray[i + 2] = (Math.random() - 0.5) * 20;
      sizeArray[i/3] = Math.random() * 0.5 + 0.1;
    }
    
    particles.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    particles.setAttribute('size', new THREE.BufferAttribute(sizeArray, 1));
    
    const particleMaterial = new THREE.PointsMaterial({
      size: 0.1,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.8,
      color: 0x89b4fa
    });
    
    const particleSystem = new THREE.Points(particles, particleMaterial);
    scene.add(particleSystem);
    
    camera.position.z = 5;
    
    // Animation loop
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const elapsedTime = clock.getElapsedTime();
      
      // Rotate particles
      particleSystem.rotation.x = elapsedTime * 0.05;
      particleSystem.rotation.y = elapsedTime * 0.1;
      
      // Move particles
      const positions = particles.attributes.position.array;
      for (let i = 0; i < positions.length; i += 3) {
        positions[i + 2] += 0.01;
        if (positions[i + 2] > 10) {
          positions[i + 2] = -10;
        }
      }
      particles.attributes.position.needsUpdate = true;
      
      renderer.render(scene, camera);
    }
    
    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    animate();
  }

  // Initialize 3D effects for cards and UI elements
  function init3DEffects() {
    // Card hover effects
    document.querySelectorAll('.meme-card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = (y - centerY) / 20;
        const rotateY = (centerX - x) / 20;
        
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;
      });
      
      card.addEventListener('mouseleave', () => {
        card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0) scale(1)';
      });
    });
    
    // 3D floating animations
    gsap.utils.toArray('.floating').forEach(element => {
      gsap.to(element, {
        y: -15,
        ease: "sine.inOut",
        duration: 2,
        repeat: -1,
        yoyo: true
      });
    });
    
    // Parallax effect for background elements
    document.addEventListener('mousemove', (e) => {
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      document.querySelectorAll('.parallax').forEach(el => {
        const speed = parseFloat(el.getAttribute('data-speed') || '0.05');
        const xOffset = (x - 0.5) * speed * 100;
        const yOffset = (y - 0.5) * speed * 100;
        el.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
      });
    });
  }

  // Setup scroll handling with optimizations
  function setupScrollHandling() {
    const feed = document.getElementById('feed');
    if (!feed) return;
    
    let isLoading = false;
    let currentPage = 0;
    const ITEMS_PER_PAGE = 6;
    
    // Initial load
    loadFeedContent('hot');
    
    // Infinite scroll
    feed.addEventListener('scroll', debounce(() => {
      if (isLoading) return;
      
      const { scrollTop, scrollHeight, clientHeight } = feed;
      if (scrollHeight - scrollTop <= clientHeight + 300) {
        isLoading = true;
        currentPage++;
        loadMoreContent(currentPage);
      }
    }, 100));
    
    // Hide header on scroll
    let lastScrollTop = 0;
    let headerHidden = false;
    
    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      
      if (scrollTop > lastScrollTop && scrollTop > 100 && !headerHidden) {
        // Scrolling down
        document.querySelector('header').style.transform = 'translateY(-100%)';
        headerHidden = true;
      } else if (scrollTop < lastScrollTop && headerHidden) {
        // Scrolling up
        document.querySelector('header').style.transform = 'translateY(0)';
        headerHidden = false;
      }
      
      lastScrollTop = scrollTop;
    });
  }

  // Load feed content based on tab

  // Fetch user memes
  async function getUserMemes(userId) {
    try {
      if (!userId) return [];
      
      const memesRef = db.collection('memes')
        .where('userId', '==', userId)
        .orderBy('createdAt', 'desc')
        .limit(10);
      
      const snapshot = await memesRef.get();
      return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    } catch (error) {
      console.error('Error fetching user memes:', error);
      return [];
    }
  }

  // Fetch external memes from APIs
  async function fetchExternalMemes(count) {
    const apis = [
      'https://meme-api.com/gimme',
      'https://meme-api.com/gimme/dankmemes',
      'https://meme-api.com/gimme/me_irl'
    ];
    
    const memes = [];
    const usedUrls = new Set();
    
    while (memes.length < count && apis.length > 0) {
      const randomApi = apis[Math.floor(Math.random() * apis.length)];
      try {
        const response = await fetch(randomApi);
        const data = await response.json();
        
        if (data.url && !usedUrls.has(data.url)) {
          usedUrls.add(data.url);
          memes.push({
            id: `external_${Date.now()}_${memes.length}`,
            url: data.url,
            title: data.title || 'Cringe Meme',
            ups: data.ups || Math.floor(Math.random() * 1000),
            subreddit: data.subreddit || 'unknown',
            author: data.author || 'anonymous',
            isExternal: true
          });
        }
      } catch (error) {
        console.warn(`Failed to fetch from ${randomApi}:`, error);
        apis.splice(apis.indexOf(randomApi), 1);
      }
    }
    
    return memes;
  }

      let query = db.collection('memes').orderBy('createdAt', 'desc');
      
      if (sortBy === 'hot') {
        query = db.collection('memes').orderBy('ups', 'desc');
      } else if (sortBy === 'crowned') {
        query = db.collection('memes').where('isCrowned', '==', true).orderBy('createdAt', 'desc');
      }
      
      query = query.limit(limit);
      const snapshot = await query.get();
      
      return snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
    } catch (error) {
      console.error('Error fetching database memes:', error);
      return [];
    }
  }

  // Setup image loading with Intersection Observer
  function setupImageLoading() {
    const images = document.querySelectorAll('.meme-image');
    const imageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.dataset.src;
          img.onload = () => {
            img.classList.add('loaded');
          };
          img.onerror = () => {
            img.src = 'image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIwIiBoZWlnaHQ9IjMyMCIgdmlld0JveD0iMCAwIDMyMCAzMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjMyMCIgaGVpZ2h0PSIzMjAiIGZpbGw9IiM2NjYiLz48dGV4dCB4PSIxNjAiIHk9IjE2MCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjE0IiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5FcnJvciBMb2FkaW5nIEltYWdlPC90ZXh0Pjwvc3ZnPg==';
          };
          imageObserver.unobserve(img);
        }
      });
    }, {
      rootMargin: '50px 0px',
      threshold: 0.01
    });
    
    images.forEach(img => {
      imageObserver.observe(img);
    });
  }

  // Add reaction to meme
  async function addReaction(memeId, emoji) {
    if (!currentUser) {
      showNotification("Login required", "Please log in to react to memes");
      return;
    }
    
    try {
      const memeRef = db.collection('memes').doc(memeId);
      const memeDoc = await memeRef.get();
      
      if (!memeDoc.exists) {
        showNotification("Error", "Meme not found", true);
        return;
      }
      
      const memeData = memeDoc.data();
      const reactions = memeData.reactions || {};
      
      // Update reactions count
      reactions[emoji] = (reactions[emoji] || 0) + 1;
      
      // Update meme document
      await memeRef.update({
        reactions: reactions,
        ups: (memeData.ups || 0) + 1
      });
      
      // Update user coins
      await updateCringeCoin(1);
      
      // Update UI
      const reactionCount = document.querySelector(`.meme-card[data-id="${memeId}"] .reaction-item:nth-child(${getEmojiIndex(emoji)}) .reaction-count`);
      if (reactionCount) {
        reactionCount.textContent = reactions[emoji];
        reactionCount.classList.add('animated');
        setTimeout(() => {
          reactionCount.classList.remove('animated');
        }, 300);
      }
      
      // Update hot score if needed
      await updateHotScore(memeId);
      
      showNotification("Reaction added!", "+1 CringeCoin earned");
      
    } catch (error) {
      console.error('Error adding reaction:', error);
      showNotification("Error", "Failed to add reaction", true);
    }
  }

  // Get emoji index for UI updates
  function getEmojiIndex(emoji) {
    const emojis = ['😂', '💀', '🔥', '❤️'];
    return emojis.indexOf(emoji) + 1;
  }

  // Tip meme creator
  async function tipMeme(memeId, amount) {
    if (!currentUser) {
      showNotification("Login required", "Please log in to tip creators");
      return;
    }
    
    if (cringeCoin < amount) {
      showNotification("Insufficient funds", `You need at least ${amount} CringeCoins to tip`);
      return;
    }
    
    try {
      const memeRef = db.collection('memes').doc(memeId);
      const memeDoc = await memeRef.get();
      
      if (!memeDoc.exists) {
        showNotification("Error", "Meme not found", true);
        return;
      }
      
      const memeData = memeDoc.data();
      const creatorId = memeData.userId;
      
      if (!creatorId) {
        showNotification("Error", "This meme doesn't have a creator to tip", true);
        return;
      }
      
      // Start transaction
      await db.runTransaction(async (transaction) => {
        const userRef = db.collection('users').doc(currentUser.uid);
        const creatorRef = db.collection('users').doc(creatorId);
        
        const userDoc = await transaction.get(userRef);
        const creatorDoc = await transaction.get(creatorRef);
        
        if (!userDoc.exists || !creatorDoc.exists) {
          throw new Error("User not found");
        }
        
        const userData = userDoc.data();
        const creatorData = creatorDoc.data();
        
        if (userData.cringeCoin < amount) {
          throw new Error("Insufficient coins");
        }
        
        // Update balances
        transaction.update(userRef, {
          cringeCoin: userData.cringeCoin - amount
        });
        
        transaction.update(creatorRef, {
          cringeCoin: (creatorData.cringeCoin || 0) + amount
        });
        
        // Record transaction
        transaction.set(db.collection('transactions').doc(), {
          from: currentUser.uid,
          to: creatorId,
          amount: amount,
          memeId: memeId,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
      
      // Update local coin count
      cringeCoin -= amount;
      updateProfileUI();
      
      // Show notification
      showNotification("Tip sent!", `You tipped ${amount} CringeCoins to the creator!`);
      
      // Visual feedback
      const card = document.querySelector(`.meme-card[data-id="${memeId}"]`);
      if (card) {
        const tipAnimation = document.createElement('div');
        tipAnimation.style.cssText = `
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(166, 227, 161, 0.9);
          color: #0f172a;
          padding: 8px 16px;
          border-radius: 20px;
          font-weight: 700;
          font-size: 18px;
          z-index: 10;
          animation: tipAnimation 1.5s forwards;
        `;
        tipAnimation.innerHTML = `+${amount} CC!`;
        card.appendChild(tipAnimation);
        
        setTimeout(() => {
          tipAnimation.remove();
        }, 1500);
      }
      
    } catch (error) {
      console.error('Error tipping meme:', error);
      showNotification("Error", "Failed to send tip", true);
    }
  }

  // Add meme to collection
  async function addToCollection(memeId, collectionName) {
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      
      await db.runTransaction(async (transaction) => {
        const userDoc = await transaction.get(userRef);
        
        if (!userDoc.exists) {
          throw new Error("User not found");
        }
        
        const userData = userDoc.data();
        const collections = userData.collections || {};
        
        if (!collections[collectionName]) {
          collections[collectionName] = [];
        }
        
        if (!collections[collectionName].includes(memeId)) {
          collections[collectionName].push(memeId);
          transaction.update(userRef, { collections });
        }
      });
      
      showNotification("Saved!", `Added to "${collectionName}" collection`);
      
    } catch (error) {
      console.error('Error adding to collection:', error);
      showNotification("Error", "Failed to add to collection", true);
    }
  }

  // Create new collection
  async function createCollection(memeId = null) {
    const collectionName = prompt("Enter collection name:");
    if (!collectionName || collectionName.trim() === '') return;
    
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      
      await db.runTransaction(async (transaction) => {
        const userDoc = await transaction.get(userRef);
        
        if (!userDoc.exists) {
          throw new Error("User not found");
        }
        
        const userData = userDoc.data();
        const collections = userData.collections || {};
        
        if (collections[collectionName]) {
          throw new Error("Collection already exists");
        }
        
        collections[collectionName] = memeId ? [memeId] : [];
        transaction.update(userRef, { collections });
      });
      
      if (memeId) {
        showNotification("Created & Saved!", `New collection "${collectionName}" created and meme added`);
      } else {
        showNotification("Collection created!", `New collection "${collectionName}" created`);
      }
      
      // Refresh collections panel if open
      if (document.getElementById('collectionsPanel').classList.contains('open')) {
        loadCollections();
      }
      
    } catch (error) {
      console.error('Error creating collection:', error);
      showNotification("Error", error.message || "Failed to create collection", true);
    }
  }

  // Initialize Fabric.js editor
  function initFabricEditor(imageUrl = null, title = '') {
    const canvasEl = document.getElementById('canvas');
    if (!canvasEl) return;
    
    // Clear canvas
    if (fabricCanvas) {
      fabricCanvas.clear();
      fabricCanvas.dispose();
    }
    
    // Initialize canvas
    fabricCanvas = new fabric.Canvas('canvas', {
      width: 600,
      height: 400,
      backgroundColor: '#0a0a15',
      selection: true,
      preserveObjectStacking: true
    });
    
    // Load image if provided
    if (imageUrl) {
      fabric.Image.fromURL(imageUrl, (img) => {
        // Scale image to fit canvas
        const scale = Math.min(580 / img.width, 380 / img.height);
        img.scaleX = scale;
        img.scaleY = scale;
        
        // Center image
        img.left = (600 - img.width * scale) / 2;
        img.top = (400 - img.height * scale) / 2;
        
        fabricCanvas.add(img);
        fabricCanvas.sendToBack(img);
      }, {
        crossOrigin: 'anonymous'
      });
    }
    
    // Add text if title provided
    if (title) {
      const text = new fabric.IText(title, {
        left: 300,
        top: 30,
        fontSize: 36,
        fontWeight: 'bold',
        fill: '#ffffff',
        stroke: '#000000',
        strokeWidth: 2,
        originX: 'center',
        originY: 'top',
        textAlign: 'center',
        fontFamily: 'Impact'
      });
      fabricCanvas.add(text);
    }
    
    // Setup event listeners
    setupEditorEvents();
  }

  // Setup editor event listeners
  function setupEditorEvents() {
    // Text input panel
    document.getElementById('add-text-btn').addEventListener('click', () => {
      document.getElementById('text-input-panel').style.display = 'block';
    });
    
    document.getElementById('apply-text-btn').addEventListener('click', () => {
      const textValue = document.getElementById('text-value').value.trim();
      if (textValue) {
        addTextToCanvas(textValue);
      }
      document.getElementById('text-input-panel').style.display = 'none';
    });
    
    // Font family change
    document.getElementById('font-family').addEventListener('change', (e) => {
      const activeObject = fabricCanvas.getActiveObject();
      if (activeObject && activeObject.type === 'i-text') {
        activeObject.set('fontFamily', e.target.value);
        fabricCanvas.renderAll();
      }
    });
    
    // Color change
    document.getElementById('text-color').addEventListener('change', (e) => {
      const activeObject = fabricCanvas.getActiveObject();
      if (activeObject && activeObject.type === 'i-text') {
        activeObject.set('fill', e.target.value);
        fabricCanvas.renderAll();
      }
    });
    
    // Image upload
    document.getElementById('image-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          fabric.Image.fromURL(event.target.result, (img) => {
            // Scale image to fit canvas
            const scale = Math.min(580 / img.width, 380 / img.height);
            img.scaleX = scale;
            img.scaleY = scale;
            
            // Center image
            img.left = (600 - img.width * scale) / 2;
            img.top = (400 - img.height * scale) / 2;
            
            // Clear canvas and add image
            fabricCanvas.getObjects().forEach(obj => {
              if (obj.type !== 'i-text') {
                fabricCanvas.remove(obj);
              }
            });
            
            fabricCanvas.add(img);
            fabricCanvas.sendToBack(img);
          }, {
            crossOrigin: 'anonymous'
          });
        };
        reader.readAsDataURL(file);
      }
    });
    
    // Template buttons
    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const imgUrl = btn.dataset.url;
        fabric.Image.fromURL(imgUrl, (img) => {
          // Scale image to fit canvas
          const scale = Math.min(580 / img.width, 380 / img.height);
          img.scaleX = scale;
          img.scaleY = scale;
          
          // Center image
          img.left = (600 - img.width * scale) / 2;
          img.top = (400 - img.height * scale) / 2;
          
          // Clear canvas and add image
          fabricCanvas.getObjects().forEach(obj => {
            if (obj.type !== 'i-text') {
              fabricCanvas.remove(obj);
            }
          });
          
          fabricCanvas.add(img);
          fabricCanvas.sendToBack(img);
        }, {
          crossOrigin: 'anonymous'
        });
      });
    });
    
    // Post meme button
    document.getElementById('post-meme-btn').addEventListener('click', async () => {
      if (!currentUser) {
        showNotification("Login required", "Please log in to post memes");
        return;
      }
      
      try {
        // Generate image data URL
        const dataUrl = fabricCanvas.toDataURL({
          format: 'png',
          quality: 1
        });
        
        // Create meme
        await createMeme(
          '',
          '',
          dataUrl,
          document.getElementById('anonymousMode').checked
        );
        
        // Close editor
        document.getElementById('memeEditor').style.display = 'none';
        
        // Show notification
        showNotification("Meme created!", "Your meme has been posted to the feed");
        
        // Refresh feed
        loadFeed('mymemes');
        
      } catch (error) {
        console.error('Error posting meme:', error);
        showNotification("Error", "Failed to post meme", true);
      }
    });
    
    // Cancel button
    document.getElementById('cancel-editor-btn').addEventListener('click', () => {
      document.getElementById('memeEditor').style.display = 'none';
    });
  }

  // Add text to canvas
  function addTextToCanvas(text) {
    const textObj = new fabric.IText(text, {
      left: 300,
      top: 200,
      fontSize: 36,
      fontWeight: 'bold',
      fill: document.getElementById('text-color').value || '#ffffff',
      stroke: '#000000',
      strokeWidth: 2,
      originX: 'center',
      originY: 'middle',
      fontFamily: document.getElementById('font-family').value || 'Impact'
    });
    
    fabricCanvas.add(textObj);
    fabricCanvas.setActiveObject(textObj);
  }

  // Create meme in database
  async function createMeme(topText, bottomText, imageUrl, isAnonymous) {
    if (!currentUser) {
      throw new Error("User not logged in");
    }
    
    try {
      const memeId = `meme_${Date.now()}`;
      const username = isAnonymous ? `anon_${Math.random().toString(36).substr(2, 6)}` : currentUser.username;
      
      const memeData = {
        id: memeId,
        url: imageUrl,
        title: (topText + ' ' + bottomText).trim() || 'My Cringe Creation',
        ups: 0,
        reactions: {},
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        isUserGenerated: true,
        createdBy: username,
        userId: currentUser.uid,
        isAnonymous: isAnonymous
      };
      
      // Add to database
      await db.collection('memes').doc(memeId).set(memeData);
      
      // Award coins for posting
      if (!isAnonymous) {
        await updateCringeCoin(20);
      }
      
      return memeData;
      
    } catch (error) {
      console.error('Error creating meme:', error);
      throw error;
    }
  }

  // Load leaderboard
  async function loadLeaderboard() {
    const leaderboardList = document.getElementById('leaderboardList');
    if (!leaderboardList) return;
    
    leaderboardList.innerHTML = `
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading cringe lords...</p>
      </div>
    `;
    
    try {
      const usersRef = db.collection('users')
        .orderBy('cringeCoin', 'desc')
        .limit(10);
      
      const snapshot = await usersRef.get();
      
      if (snapshot.empty) {
        leaderboardList.innerHTML = '<p>No users found</p>';
        return;
      }
      
      leaderboardList.innerHTML = '';
      
      snapshot.docs.forEach((doc, index) => {
        const userData = doc.data();
        const isCurrentUser = currentUser && doc.id === currentUser.uid;
        
        const leaderItem = document.createElement('div');
        leaderItem.className = `leaderboard-item ${isCurrentUser ? 'current-user' : ''}`;
        leaderItem.innerHTML = `
          <div class="leaderboard-rank">#${index + 1}</div>
          <div class="leaderboard-user">
            <div class="user-avatar">${userData.username.charAt(0)}</div>
            <div class="user-info">
              <div class="username">${userData.username}</div>
              <div class="user-stats">
                <span class="cringe-coins">${userData.cringeCoin.toLocaleString()} CC</span>
                <span class="streak">🔥 ${userData.streak || 0} day streak</span>
              </div>
            </div>
          </div>
          ${isCurrentUser ? '<div class="current-badge">YOU</div>' : ''}
        `;
        
        leaderboardList.appendChild(leaderItem);
      });
      
    } catch (error) {
      console.error('Error loading leaderboard:', error);
      leaderboardList.innerHTML = `
        <div class="error-message">
          <p>Failed to load leaderboard</p>
          <button class="action-button save" onclick="loadLeaderboard()">Retry</button>
        </div>
      `;
    }
  }

  // Load user collections
  async function loadCollections() {
    const collectionsGrid = document.getElementById('collectionsGrid');
    if (!collectionsGrid) return;
    
    collectionsGrid.innerHTML = `
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading your collections...</p>
      </div>
    `;
    
    if (!currentUser) {
      collectionsGrid.innerHTML = `
        <div style="text-align: center; padding: 40px;">
          <p>Please log in to view your collections</p>
          <button class="action-button save" onclick="showAuthModal()">Log In</button>
        </div>
      `;
      return;
    }
    
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      const userDoc = await userRef.get();
      
      if (!userDoc.exists) {
        collectionsGrid.innerHTML = '<p>User not found</p>';
        return;
      }
      
      const userData = userDoc.data();
      const collections = userData.collections || {};
      const collectionNames = Object.keys(collections);
      
      if (collectionNames.length === 0) {
        collectionsGrid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 40px;">
            <p>You don't have any collections yet</p>
            <button class="action-button save" onclick="createCollection()">Create Collection</button>
          </div>
        `;
        return;
      }
      
      collectionsGrid.innerHTML = '';
      
      collectionNames.forEach(name => {
        const collectionCard = document.createElement('div');
        collectionCard.className = 'collection-card';
        collectionCard.innerHTML = `
          <div class="collection-title">${escapeHTML(name)}</div>
          <div class="collection-count">${collections[name].length} memes</div>
          <div class="collection-preview">
            ${collections[name].slice(0, 3).map(id => `
              <div class="preview-item" data-id="${id}"></div>
            `).join('')}
          </div>
        `;
        
        // Add click handler
        collectionCard.addEventListener('click', () => {
          showCollectionDetail(name, collections[name]);
        });
        
        collectionsGrid.appendChild(collectionCard);
      });
      
      // Load preview images
      loadCollectionPreviews();
      
    } catch (error) {
      console.error('Error loading collections:', error);
      collectionsGrid.innerHTML = `
        <div class="error-message">
          <p>Failed to load collections</p>
          <button class="action-button save" onclick="loadCollections()">Retry</button>
        </div>
      `;
    }
  }

  // Load collection previews
  async function loadCollectionPreviews() {
    const previewItems = document.querySelectorAll('.preview-item');
    const memeIds = Array.from(previewItems).map(item => item.dataset.id);
    
    if (memeIds.length === 0) return;
    
    try {
      const memesRef = db.collection('memes').where(firebase.firestore.FieldPath.documentId(), 'in', memeIds);
      const snapshot = await memesRef.get();
      
      const memesMap = {};
      snapshot.docs.forEach(doc => {
        memesMap[doc.id] = doc.data();
      });
      
      previewItems.forEach(item => {
        const memeId = item.dataset.id;
        const memeData = memesMap[memeId];
        
        if (memeData && memeData.url) {
          item.style.backgroundImage = `url(${memeData.url})`;
          item.style.backgroundSize = 'cover';
          item.style.backgroundPosition = 'center';
        } else {
          item.style.backgroundColor = 'var(--card-bg)';
          item.innerHTML = '<span>?</span>';
        }
      });
      
    } catch (error) {
      console.error('Error loading collection previews:', error);
    }
  }

  // Show collection detail
  async function showCollectionDetail(collectionName, memeIds) {
    const collectionDetailModal = document.getElementById('collectionDetailModal');
    const collectionTitle = document.getElementById('collectionTitle');
    const collectionMemesGrid = document.getElementById('collectionMemesGrid');
    
    if (!collectionDetailModal || !collectionTitle || !collectionMemesGrid) return;
    
    collectionTitle.textContent = collectionName;
    collectionMemesGrid.innerHTML = `
      <div class="loading-spinner">
        <div class="spinner"></div>
        <p>Loading memes...</p>
      </div>
    `;
    
    collectionDetailModal.classList.add('open');
    
    try {
      if (memeIds.length === 0) {
        collectionMemesGrid.innerHTML = '<p>This collection is empty</p>';
        return;
      }
      
      // Get memes in batches of 10
      const batches = [];
      for (let i = 0; i < memeIds.length; i += 10) {
        batches.push(memeIds.slice(i, i + 10));
      }
      
      const memes = [];
      
      for (const batch of batches) {
        const memesRef = db.collection('memes').where(firebase.firestore.FieldPath.documentId(), 'in', batch);
        const snapshot = await memesRef.get();
        
        snapshot.docs.forEach(doc => {
          memes.push({
            id: doc.id,
            ...doc.data()
          });
        });
      }
      
      // Render memes
      collectionMemesGrid.innerHTML = '';
      
      memes.forEach(meme => {
        const memeItem = document.createElement('div');
        memeItem.className = 'collection-meme-item';
        memeItem.innerHTML = `
          <div class="meme-preview" style="background-image: url('${meme.url}')"></div>
          <div class="meme-title">${escapeHTML(meme.title)}</div>
          <div class="meme-stats">
            <span>${meme.ups || 0} upvotes</span>
            <button class="action-button save small" onclick="removeFromCollection('${collectionName}', '${meme.id}')">Remove</button>
          </div>
        `;
        
        collectionMemesGrid.appendChild(memeItem);
      });
      
    } catch (error) {
      console.error('Error loading collection detail:', error);
      collectionMemesGrid.innerHTML = `
        <div class="error-message">
          <p>Failed to load collection details</p>
        </div>
      `;
    }
  }

  // Remove meme from collection
  async function removeFromCollection(collectionName, memeId) {
    if (!currentUser) {
      showNotification("Login required", "Please log in to modify collections");
      return;
    }
    
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      
      await db.runTransaction(async (transaction) => {
        const userDoc = await transaction.get(userRef);
        
        if (!userDoc.exists) {
          throw new Error("User not found");
        }
        
        const userData = userDoc.data();
        const collections = userData.collections || {};
        
        if (collections[collectionName]) {
          collections[collectionName] = collections[collectionName].filter(id => id !== memeId);
          transaction.update(userRef, { collections });
        }
      });
      
      showNotification("Removed", `Meme removed from "${collectionName}"`);
      
      // Refresh collection detail if open
      if (document.getElementById('collectionDetailModal').classList.contains('open')) {
        const collectionTitle = document.getElementById('collectionTitle').textContent;
        showCollectionDetail(collectionTitle, document.querySelectorAll('.collection-meme-item').map(el => el.dataset.id));
      }
      
    } catch (error) {
      console.error('Error removing from collection:', error);
      showNotification("Error", "Failed to remove from collection", true);
    }
  }

  // Check daily crown
  async function checkDailyCrown() {
    try {
      const today = new Date().toISOString().split('T')[0];
      const crownRef = db.collection('dailyCrowns').doc(today);
      const crownDoc = await crownRef.get();
      
      if (crownDoc.exists) {
        dailyCrown = crownDoc.data();
      }
      
    } catch (error) {
      console.error('Error checking daily crown:', error);
    }
  }

  // Check user streak
  async function checkStreak() {
    if (!currentUser) return;
    
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      const userDoc = await userRef.get();
      
      if (userDoc.exists) {
        const userData = userDoc.data();
        streak = userData.streak || 0;
        
        // Update streak badge
        const streakBadge = document.querySelector('.streak-badge');
        if (streakBadge) {
          streakBadge.innerHTML = `🔥 ${streak}d`;
        }
      }
      
    } catch (error) {
      console.error('Error checking streak:', error);
    }
  }

  // Update user's CringeCoin balance
  async function updateCringeCoin(amount) {
    if (!currentUser || amount <= 0) return;
    
    try {
      const userRef = db.collection('users').doc(currentUser.uid);
      
      await db.runTransaction(async (transaction) => {
        const userDoc = await transaction.get(userRef);
        
        if (!userDoc.exists) {
          throw new Error("User not found");
        }
        
        const userData = userDoc.data();
        const newBalance = (userData.cringeCoin || 0) + amount;
        
        transaction.update(userRef, {
          cringeCoin: newBalance
        });
      });
      
      // Update local balance
      cringeCoin += amount;
      
      // Update UI
      updateProfileUI();
      
      return true;
      
    } catch (error) {
      console.error('Error updating CringeCoin:', error);
      return false;
    }
  }

  // Update profile UI
  function updateProfileUI() {
    // Update coin balance in profile
    const coinElements = document.querySelectorAll('.stat-value');
    coinElements.forEach(el => {
      if (el.textContent.includes(',')) {
        el.textContent = cringeCoin.toLocaleString();
      }
    });
    
    // Update streak
    const streakBadge = document.querySelector('.streak-badge');
    if (streakBadge) {
      streakBadge.innerHTML = `🔥 ${streak}d`;
    }
  }

  // Setup PWA
  function setupPWA() {
    if (!window.matchMedia('(display-mode: standalone)').matches) {
      const installPrompt = document.getElementById('installPrompt');
      if (installPrompt && !localStorage.getItem('installPromptSeen')) {
        setTimeout(() => {
          installPrompt.style.display = 'block';
          
          document.getElementById('installBtn').addEventListener('click', () => {
            installPrompt.style.display = 'none';
            localStorage.setItem('installPromptSeen', 'true');
            showNotification("Install instructions", "Tap the share button and select 'Add to Home Screen'");
          });
          
          document.getElementById('dismissBtn').addEventListener('click', () => {
            installPrompt.style.display = 'none';
            localStorage.setItem('installPromptSeen', 'true');
          });
        }, 5000);
      }
    }
  }

  // Utility functions
  function formatTimeAgo(timestamp) {
    if (!timestamp) return 'just now';
    
    const now = new Date().getTime();
    let time;
    
    if (timestamp.seconds) {
      // Firebase timestamp
      time = timestamp.seconds * 1000;
    } else if (timestamp.toDate) {
      // Firestore Timestamp object
      time = timestamp.toDate().getTime();
    } else if (typeof timestamp === 'string') {
      // ISO string
      time = new Date(timestamp).getTime();
    } else {
      // Assume milliseconds
      time = timestamp;
    }
    
    const diff = now - time;
    
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 604800000) return Math.floor(diff / 86400000) + 'd ago';
    
    const date = new Date(time);
    return date.toLocaleDateString();
  }

  function escapeHTML(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;',
      '<': '<',
      '>': '>',
      '"': '&quot;',
      "'": '&#039;'
    }[m]));
  }

  function debounce(func, wait) {
    let timeout;
    return function() {
      const context = this;
      const args = arguments;
      clearTimeout(timeout);
      timeout = setTimeout(() => {
        func.apply(context, args);
      }, wait);
    };
  }

  // Initialize app
  window.addEventListener('load', () => {
    // Handle service worker registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('ServiceWorker registered with scope:', registration.scope);
        })
        .catch(error => {
          console.error('ServiceWorker registration failed:', error);
        });
    }
    
    // Setup manifest dynamically
    const manifest = {
      name: 'CringeScroll',
      short_name: 'CringeScroll',
      start_url: '/',
      display: 'standalone',
      background_color: '#0f0f1a',
      theme_color: '#0f0f1a',
      icons: [{
        src: '/icon-192x192.png',
        sizes: '192x192',
        type: 'image/png'
      }, {
        src: '/icon-512x512.png',
        sizes: '512x512',
        type: 'image/png'
      }]
    };
    
    const manifestElement = document.createElement('link');
    manifestElement.rel = 'manifest';
    manifestElement.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    document.head.appendChild(manifestElement);
  });
</script>
