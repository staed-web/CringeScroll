  <style>
    :root {
      --bg: #0a0a15;
      --card-bg: rgba(25, 25, 45, 0.7);
      --accent-1: #6F86D6;
      --accent-2: #4A55A2;
      --accent-3: #A566FF;
      --text: #f0f0ff;
      --border: rgba(107, 134, 214, 0.15);
      --success: #4CAF50;
      --warning: #FFA726;
      --error: #EF5350;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(107, 134, 214, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(165, 102, 255, 0.05) 0%, transparent 20%);
      background-attachment: fixed;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: hidden;
      perspective: 1000px;
      transform-style: preserve-3d;
    }
    header {
      padding: 16px 20px;
      background: rgba(15, 15, 30, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--accent-1);
      transition: var(--transition);
      transform: translateZ(10px);
      box-shadow: var(--shadow);
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    .logo-container:hover {
      transform: translateY(-2px) scale(1.02);
    }
    .cringe-logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(107, 134, 214, 0.4);
      position: relative;
      transform-style: preserve-3d;
      transition: var(--transition);
    }
    .cringe-logo:hover {
      transform: rotateY(15deg) rotateX(5deg) scale(1.05);
    }
    .cringe-logo::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, var(--accent-1), var(--accent-3), var(--accent-1));
      border-radius: 16px;
      z-index: -1;
      animation: rotateGradient 8s linear infinite;
    }
    @keyframes rotateGradient {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .cringe-logo::after {
      content: "💀";
      font-size: 24px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }
    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      position: relative;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: var(--transition);
    }
    .hamburger-menu {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      padding: 8px;
      border-radius: 10px;
      transition: var(--transition);
      background: rgba(107, 134, 214, 0.1);
    }
    .hamburger-menu:hover {
      background: rgba(107, 134, 214, 0.2);
      transform: translateY(-50%) scale(1.1);
    }
    .hamburger-line {
      display: block;
      width: 24px;
      height: 3px;
      margin: 4px 0;
      border-radius: 3px;
      background: linear-gradient(to right, var(--accent-1), var(--accent-3));
      transition: var(--transition);
    }
    #contentPanel {
      position: fixed;
      left: -320px;
      top: 0;
      width: 300px;
      height: 100dvh;
      background: rgba(15, 15, 35, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--accent-1);
      z-index: 200;
      transition: var(--transition);
      box-shadow: 8px 0 24px rgba(0, 0, 0, 0.4);
      padding: 20px 0;
      transform: translateZ(20px);
    }
    #contentPanel.open {
      left: 0;
    }
    .panel-close {
      position: absolute;
      right: 16px;
      top: 16px;
      background: none;
      border: none;
      color: var(--accent-1);
      font-size: 24px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .panel-close:hover {
      background: rgba(107, 134, 214, 0.15);
      transform: rotate(90deg);
    }
    .content-title {
      padding: 0 24px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .content-title svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: var(--accent-1);
      stroke-width: 2;
    }
    .content-list {
      padding: 0 12px;
    }
    .content-item {
      padding: 12px 16px;
      border-radius: 12px;
      margin: 6px 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .content-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(107, 134, 214, 0.1), transparent);
      opacity: 0;
      transition: var(--transition);
      z-index: -1;
    }
    .content-item:hover::before {
      opacity: 1;
    }
    .content-item:hover {
      transform: translateX(4px);
      background: rgba(107, 134, 214, 0.08);
    }
    .content-item.active {
      background: rgba(107, 134, 214, 0.15);
      border-left: 3px solid var(--accent-1);
    }
    .content-icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(107, 134, 214, 0.2);
      border-radius: 8px;
      color: var(--accent-1);
      font-size: 16px;
      flex-shrink: 0;
    }
    .content-text {
      font-weight: 500;
      flex: 1;
    }
    .content-badge {
      background: var(--accent-1);
      color: white;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .user-section {
      padding: 0 24px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .user-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(107, 134, 214, 0.1);
      cursor: pointer;
      transition: var(--transition);
    }
    .user-card:hover {
      transform: translateX(4px);
      background: rgba(107, 134, 214, 0.2);
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 16px;
    }
    .user-info {
      flex: 1;
    }
    .user-name {
      font-weight: 600;
      color: var(--accent-1);
    }
    .user-stats {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text);
      opacity: 0.8;
    }
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      padding-top: env(safe-area-inset-top);
    }
    #main-content.shifted {
      transform: translateX(300px);
    }
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: rgba(15, 15, 30, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      bottom: 0;
      z-index: 90;
      transform: translateZ(5px);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
    }
    .control-btn {
      background: rgba(107, 134, 214, 0.15);
      border: 1px solid var(--accent-1);
      color: var(--accent-1);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      font-size: 20px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .control-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(107, 134, 214, 0.3) 0%, transparent 70%);
      opacity: 0;
      transition: var(--transition);
    }
    .control-btn:hover::before {
      opacity: 1;
    }
    .control-btn:hover {
      background: rgba(107, 134, 214, 0.25);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 15px rgba(107, 134, 214, 0.3);
    }
    .control-btn:active {
      transform: translateY(1px) scale(0.95);
    }
    .control-btn.active {
      background: var(--accent-1);
      color: white;
      box-shadow: 0 0 15px rgba(107, 134, 214, 0.5);
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: max(80px, env(safe-area-inset-bottom));
      position: relative;
    }
    .meme-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: var(--transition);
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      perspective: 1000px;
    }
    .meme-card:hover {
      transform: translateY(-8px) rotateX(2deg) rotateY(2deg);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }
    .meme-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(45deg, var(--accent-1), var(--accent-3), var(--accent-1));
      border-radius: 21px;
      z-index: -1;
      opacity: 0;
      transition: var(--transition);
    }
    .meme-card:hover::before {
      opacity: 1;
      animation: pulseBorder 2s infinite;
    }
    @keyframes pulseBorder {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    .meme-header {
      padding: 16px 20px 0;
      position: relative;
      z-index: 2;
    }
    .meme-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--accent-1);
      word-break: break-word;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badge-container {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }
    .reaction-badge {
      background: rgba(107, 134, 214, 0.2);
      color: var(--accent-1);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .user-badge {
      background: rgba(165, 102, 255, 0.2);
      color: var(--accent-3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .meme-image-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #0c0c1a;
      transform-style: preserve-3d;
    }
    .meme-image {
      width: 100%;
      height: auto;
      display: block;
      max-height: 70vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .meme-image.loaded {
      opacity: 1;
    }
    .meme-actions {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }
    .reactions {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 8px 0;
    }
    .reaction-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .reaction-btn {
      font-size: 22px;
      cursor: pointer;
      transition: var(--transition);
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.3));
    }
    .reaction-btn:hover {
      transform: scale(1.2) rotate(5deg);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
    }
    .reaction-btn:active {
      transform: scale(0.9);
    }
    .reaction-count {
      font-size: 14px;
      color: var(--accent-1);
      font-weight: bold;
      min-width: 20px;
      text-align: center;
      background: rgba(107, 134, 214, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      transition: var(--transition);
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .action-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 100px;
      max-width: 140px;
    }
    .tip-btn { background: rgba(239, 83, 80, 0.15); color: #EF5350; }
    .claim-btn { background: rgba(165, 102, 255, 0.15); color: var(--accent-3); }
    .save-btn { background: rgba(76, 175, 80, 0.15); color: #4CAF50; }
    .remix-btn { background: rgba(107, 134, 214, 0.15); color: var(--accent-1); }
    .action-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    .action-btn:active {
      transform: translateY(1px);
    }
    .claimed-by {
      font-size: 13px;
      color: var(--accent-1);
      margin-top: 8px;
      display: block;
      text-align: center;
      font-weight: 500;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      transition: var(--transition);
      opacity: 0;
      pointer-events: none;
    }
    .modal.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-content {
      background: rgba(25, 25, 45, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 24px;
      border-radius: 24px;
      width: 95%;
      max-width: 500px;
      border: 1px solid var(--accent-1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      transform: translateY(20px) scale(0.95);
      transition: var(--transition);
      position: relative;
      overflow: hidden;

    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };
    const createPlaceholder = (width, height) => {
      const svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#19192D"/>
        <text x="50%" y="50%" fill="#6F86D6" font-size="10" text-anchor="middle" dominant-baseline="middle">Loading...</text>
      </svg>`;
      return `image/svg+xml;base64,${btoa(svg)}`;
    };

    const showToast = (message, type = 'success', duration = 3000) => {
      const toast = document.getElementById('toastNotification');
      const messageEl = document.getElementById('toastMessage');
      const icon = toast.querySelector('svg');
      messageEl.textContent = message;
      toast.className = `toast ${type} show`;
      if (type === 'success') {
        icon.innerHTML = '<path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        toast.style.borderColor = '#4CAF50';
        toast.style.color = '#4CAF50';
      } else if (type === 'error') {
        icon.innerHTML = '<path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
        toast.style.borderColor = '#EF5350';
        toast.style.color = '#EF5350';
      }
      setTimeout(() => toast.classList.remove('show'), duration);
    };

    // ===== STUB FUNCTIONS (to prevent crashes) =====

        });

    const loadImageToCanvas = (url) => {
      fabric.Image.fromURL(url, (img) => {
        if (!img) return showToast("Failed to load image", "error");
        fabricCanvas.clear();
        const maxWidth = 780, maxHeight = 480;
        let scale = 1;
        if (img.width > maxWidth || img.height > maxHeight) {
          scale = Math.min(maxWidth / img.width, maxHeight / img.height);
        }
        img.set({ scaleX: scale, scaleY: scale });
        img.set({ left: (800 - img.width * scale) / 2, top: (500 - img.height * scale) / 2 });
        fabricCanvas.add(img);
        fabricCanvas.renderAll();
      }, { crossOrigin: 'anonymous' });
    };

        cornerColor: '#6F86D6',

              email: user.email,
              username: `user${Math.floor(1000 + Math.random() * 9000)}`,
              cringeCoin: 0,

              lastActive: new Date(),

      e.preventDefault();

      if (!email || !password || (!isLoginMode && !username)) {

      if (!isLoginMode && !/^[a-zA-Z0-9]{3,15}$/.test(username)) {

      try {
        if (isLoginMode) {
          await auth.signInWithEmailAndPassword(email, password);

        } else {
          const q = await db.collection('users').where('username', '==', username).limit(1).get();
          if (!q.empty) {
            showToast("Username taken!", "error");
            return;

          const cred = await auth.createUserWithEmailAndPassword(email, password);

    // ===== FEED & MEMES =====
    const fetchHotMemes = async (limit = 3) => {
      const proxy = 'https://api.allorigins.win/raw?url=';
      const shuffled = [...MEME_SOURCES].sort(() => 0.5 - Math.random());
      const memes = [];
      for (let i = 0; i < shuffled.length && memes.length < limit; i++) {
        try {
          const url = proxy + encodeURIComponent(`${shuffled[i]}?_=${Date.now()}`);
          const res = await fetch(url, { mode: 'cors' });
          if (!res.ok) continue;
          const data = await res.json();
          if (!data?.url || seenUrls.has(data.url)) continue;
          if (!data.url.match(/\.(jpg|jpeg|png|gif)$/i)) continue;
          memes.push({
            id: `reddit_${Date.now()}_${i}`,
            title: data.title || 'Hot Meme',
            url: data.url,
            ups: data.ups || Math.floor(Math.random() * 5000) + 1000,
            isUserGenerated: false,
            createdAt: new Date()
          });
        } catch (e) { /* silent fail */ }
      }
      return memes;
    };

            title: d.title || 'My Meme',
            url: d.url,
            ups: d.ups || 0,
            isUserGenerated: true,
            userId: d.userId,
            claimedBy: d.claimedBy || null,
            createdAt: d.createdAt?.toDate() || new Date()
          });
        });
        return memes;

        console.error("User memes fetch error:", e);
        return [];
      }
    };

      badgeContainer.appendChild(reactionBadge);

      img.dataset.src = meme.url;
      img.loading = index < 2 ? 'eager' : 'lazy';

      if ('IntersectionObserver' in window) {
        const obs = new IntersectionObserver(entries => {
          if (entries[0].isIntersecting) {
            img.src = img.dataset.src;
            img.onload = () => img.classList.add('loaded');
            img.onerror = () => img.src = createPlaceholder(300, 300);
            obs.disconnect();
          }
        }, { threshold: 0.1 });
        obs.observe(img);
      } else {
        setTimeout(() => { img.src = img.dataset.src; img.onload = () => img.classList.add('loaded'); }, 100 * index);

        const ref = db.collection('memes').doc(memeId);
        const doc = await ref.get();
        if (!doc.exists) return showToast("Meme not found", "error");
        await ref.update({ ups: firebase.firestore.FieldValue.increment(1) });
        cringeCoin += 1;
        await db.collection('users').doc(currentUser.uid).update({ cringeCoin });
        updateUserSection();
        showToast(`Reacted with ${emoji}! +1 CC`);

        showToast("Reaction failed", "error");

          from: currentUser.uid,
          to: memeId,
          amount,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()

        await db.collection('users').doc(currentUser.uid).update({ cringeCoin });
        updateUserSection();
        showToast(`Tipped ${amount} CC!`);

      document.getElementById('chatBtn').onclick = showChat;
      document.getElementById('collectionsBtn').onclick = showCollections;
      document.getElementById('profileBtn').onclick = () => {
        if (currentUser) showProfile(); else showAuthModal();
      };

      // Logo
      document.getElementById('logoLink').onclick = () => {
        currentTab = 'hot';
        document.querySelectorAll('.content-item').forEach(i => i.classList.remove('active'));
        document.querySelector('.content-item[data-tab="hot"]').classList.add('active');
        loadFeed(true);
      };

      // Auth
      document.getElementById('closeAuth').onclick = closeAuthModal;
      document.getElementById('toggleAuthMode').onclick = toggleAuthMode;
      document.getElementById('authSubmit').onclick = handleAuth;

      // Editor
      document.getElementById('closeEditor').onclick = closeEditor;
      document.getElementById('post-meme-btn').onclick = postMeme;

      // Collections
      document.getElementById('closeCollections').onclick = closeCollectionsModal;
      document.getElementById('createCollectionBtn').onclick = createCollection;
    };

    // ===== INIT =====
    const initApp = async () => {
      feed = document.getElementById('feed');
      await initFirebase();
      attachButtonListeners();
      setupInfiniteScroll();
      loadFeed();
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
