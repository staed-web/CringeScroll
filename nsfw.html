    :root {

      --accent-cyan: #00FFFF;

      --border: rgba(255, 42, 109, 0.12);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    #app {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow: hidden;
    }
    header {
      padding: 16px 20px;
      background: rgba(13, 13, 26, 0.92);

      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--accent-pink);
    }
    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .logo-container:hover {
      transform: scale(1.03);
    }
    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(255, 42, 109, 0.5);
    }
    .logo::before {
      content: "🔞";
      font-size: 24px;
    }
    .logo-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .hamburger-menu {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .hamburger-menu:hover {
      background: rgba(0, 255, 255, 0.1);
    }
    .ui-bar {
      display: flex;
      flex-direction: column;
      background: rgba(13, 13, 26, 0.7);
      border-bottom: 1px solid rgba(255, 42, 109, 0.3);
      z-index: 99;
    }
    .tab-bar {
      display: flex;
      justify-content: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 42, 109, 0.1);
      gap: 2px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
      border-radius: 8px;
    }
    .tab-btn.active {
      color: var(--accent-cyan);
      background: rgba(0, 255, 255, 0.1);
    }
    .tab-btn:hover:not(.active) {
      background: rgba(255, 42, 109, 0.1);
    }
    .control-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid rgba(255, 42, 109, 0.1);
    }
    .control-btn {
      background: transparent;
      border: 2px solid var(--accent-pink);
      color: var(--accent-pink);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .control-btn:hover {
      background: rgba(255, 42, 109, 0.2);
      transform: scale(1.1);
    }
    #feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 12px 100px;
      scroll-behavior: auto;
      min-height: 0;
      padding-bottom: max(100px, env(safe-area-inset-bottom));

    .content-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      margin: 16px 10px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      transition: transform 0.2s;
      position: relative;
    }
    .content-card:hover {
      transform: translateY(-3px);
    }
    .badge-container {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .reaction-badge {
      background: var(--accent-cyan);
      color: var(--bg);
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 14px;
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);

    .content-title {
      padding: 18px 20px 14px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      color: var(--accent-cyan);
      word-break: break-word;
      padding-top: 36px;

    .content-image {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.3s ease;
    }
    .content-image.loaded {
      opacity: 1;
    }
    .reactions {
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 12px 0 10px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255, 42, 109, 0.1);
    }
    .reaction-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .reaction-btn {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.2s, filter 0.2s;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.5));
    }
    .reaction-btn:active {
      transform: scale(1.3);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
    }
    .reaction-count {
      font-size: 14px;
      color: var(--accent-cyan);
      font-weight: bold;
      min-width: 20px;
      text-align: center;
      background: rgba(0, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 10px;
      transition: all 0.2s;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 0 0 20px;
    }
    .like-btn, .save-btn, .share-btn {
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .like-btn {
      background: var(--accent-pink);
      color: white;
    }
    .save-btn {
      background: var(--accent-purple);
      color: white;
    }
    .share-btn {
      background: var(--accent-cyan);
      color: var(--bg);
    }
    .user-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent-purple);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .loading-spinner {

      padding: 20px;
      color: var(--accent-cyan);
      font-size: 16px;
    }
    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(0, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--accent-cyan);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .skeleton-card {
      background: var(--card-bg);
      border-radius: 20px;
      margin: 16px 10px;
      height: 400px;
      animation: pulseSkeleton 1.5s infinite ease-in-out;
    }
    @keyframes pulseSkeleton {
      0% { opacity: 0.6; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 42, 109, 0.3);
      margin-bottom: 10px;
    }
    .panel-title {
      font-size: 20px;
      color: var(--accent-cyan);
    }
    .close-panel {
      background: none;
      border: none;
      color: var(--accent-cyan);
      font-size: 24px;
      cursor: pointer;
    }
    .user-stats {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 255, 255, 0.1);
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-cyan);
    }
    .stat-label {
      font-size: 12px;
      color: var(--text);
    }
    #leaderboardList, #chatMessages, #collectionsGrid {
      flex: 1;
      overflow-y: auto;
    }
    .leaderboard-item {
      background: var(--card-bg);
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
    .leaderboard-rank {
      background: var(--accent-purple);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }
    .menu-item {
      padding: 12px 0;
      color: var(--text);
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 42, 109, 0.1);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .menu-item:hover {
      color: var(--accent-pink);
      background: rgba(255, 42, 109, 0.1);
      border-radius: 8px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      border: 2px solid var(--accent-pink);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .modal-title {
      color: var(--accent-pink);
      margin: 0;
      font-size: 20px;
    }
    .close-modal {
      background: none;
      border: none;
      color: var(--accent-cyan);
      font-size: 24px;
      cursor: pointer;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--accent-pink);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(255, 42, 109, 0.5);
      transform: translateX(350px);
      transition: transform 0.3s ease;
    }
    .notification.show {
      transform: translateX(0);
    }
    @media (max-width: 768px) {
      .tab-bar {
        flex-wrap: wrap;
      }
      .tab-btn {
        margin: 2px;
      }
    }
  </style>
</head>

    </a>
  </div>
  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">🔐 Access</h2>
        <button class="close-modal" id="closeAuth">✕</button>
      </div>
      <form id="authForm">
        <input type="email" id="emailInput" placeholder="Email" required style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid var(--accent-cyan); background:rgba(0,0,0,0.3); color:var(--text);">
        <input type="password" id="passwordInput" placeholder="Password" required style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid var(--accent-cyan); background:rgba(0,0,0,0.3); color:var(--text);">
        <button type="submit" style="width:100%; padding:10px; margin-top:10px; background:var(--accent-cyan); color:var(--bg); border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Login</button>
      </form>
    </div>
  </div>
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">📤 Upload Content</h2>
        <button class="close-modal" id="closeUpload">✕</button>
      </div>
      <div>
        <input type="file" id="imageUpload" accept="image/*" style="margin:10px 0; width:100%;">
        <input type="text" id="contentTitle" placeholder="Title" style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid var(--accent-cyan); background:rgba(0,0,0,0.3); color:var(--text);">
        <select id="contentCategory" style="width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid var(--accent-cyan); background:rgba(0,0,0,0.3); color:var(--text);">
          <option value="cosplay">Cosplay</option>
          <option value="asian">Asian</option>
          <option value="other">Other</option>
        </select>
        <button id="submitUpload" style="width:100%; padding:10px; margin-top:10px; background:var(--accent-cyan); color:var(--bg); border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Upload</button>
      </div>
    </div>
  </div>
  <div id="notificationToast" class="notification">Default message</div>
  <script>
    let feed;
    const seenUrls = new Set();
    let isLoading = false;
    let loadCount = 0;
    let currentTab = 'hot';
    let db = null;
    let auth = null;
    let currentUser = null;
    let tokens = 0;
    let streak = 0;
    
    const CONTENT_SOURCES = [
      // Cosplay sources
      'https://api.imgur.com/3/gallery/t/cosplay/top/all/0',
      'https://api.imgur.com/3/gallery/t/maid_cafe/top/all/0',
      'https://api.imgur.com/3/gallery/t/school_uniform/top/all/0',
      'https://api.imgur.com/3/gallery/t/japanese_schoolgirl/top/all/0',
      // Asian sources
      'https://api.imgur.com/3/gallery/t/asian/top/all/0',
      'https://api.imgur.com/3/gallery/t/japanese/top/all/0',
      'https://api.imgur.com/3/gallery/t/korean/top/all/0',
      'https://api.imgur.com/3/gallery/t/chinese/top/all/0',
      // General adult sources
      'https://api.imgur.com/3/gallery/t/lingerie/top/all/0',
      'https://api.imgur.com/3/gallery/t/swimsuit/top/all/0'
    ];
    
    const showNotification = (message) => {
      const notification = document.getElementById('notificationToast');
      notification.textContent = message;
      notification.classList.add('show');
      setTimeout(() => notification.classList.remove('show'), 3000);
    };
    
    const escapeHtml = (str) => 
      str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'<','>':'>','"':'&quot;',"'":'&#039;'}[m]));
    
    const formatNumber = (num) => {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num;
    };
    
    const createPlaceholder = (width, height) => {
      const svg = `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
        <rect width="100%" height="100%" fill="#161625"/>
        <text x="50%" y="50%" fill="#00FFFF" font-size="10" text-anchor="middle" dominant-baseline="middle">Loading...</text>
      </svg>`;
      return `image/svg+xml;base64,${btoa(svg)}`;
    };
    
    const initFirebase = async () => {
      try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
        auth.onAuthStateChanged(async (user) => {
          if (user) {
            currentUser = {
              uid: user.uid,
              email: user.email
            };
            const userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) {
              tokens = userDoc.data().tokens || 0;
              streak = userDoc.data().streak || 0;
            } else {
              await db.collection('users').doc(user.uid).set({
                email: user.email,
                tokens: 0,
                streak: 0,
                lastActive: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
            document.getElementById('userStats').style.display = 'flex';
            document.getElementById('coinCount').textContent = tokens;
            document.getElementById('streakValue').textContent = streak;
          } else {
            currentUser = null;
            tokens = 0;
            streak = 0;
            document.getElementById('userStats').style.display = 'none';
          }
        });
      } catch (error) {
        showNotification("Firebase initialization failed");
      }
    };
    
    const renderContent = (content, index) => {
      const card = document.createElement('div');
      card.className = 'content-card';
      card.dataset.id = content.id;
      
      const badgeContainer = document.createElement('div');
      badgeContainer.className = 'badge-container';
      const reactionBadge = document.createElement('div');
      reactionBadge.className = 'reaction-badge';
      reactionBadge.innerHTML = `🔥 ${formatNumber(content.ups)}`;
      badgeContainer.appendChild(reactionBadge);
      
      const reactionsDiv = document.createElement('div');
      reactionsDiv.className = 'reactions';
      const emojis = ['❤️', '🔥', '😍', '✨'];
      emojis.forEach(emoji => {
        const item = document.createElement('div');
        item.className = 'reaction-item';
        const btn = document.createElement('div');
        btn.className = 'reaction-btn';
        btn.textContent = emoji;
        btn.onclick = () => {
          showNotification(`Reacted with ${emoji}!`);
        };
        const countDisplay = document.createElement('div');
        countDisplay.className = 'reaction-count';
        countDisplay.textContent = Math.floor(Math.random() * 100);
        item.appendChild(btn);
        item.appendChild(countDisplay);
        reactionsDiv.appendChild(item);
      });
      
      const actionDiv = document.createElement('div');
      actionDiv.className = 'action-buttons';
      const likeBtn = document.createElement('button');
      likeBtn.className = 'like-btn';
      likeBtn.innerHTML = '❤️ Like';
      likeBtn.onclick = () => {
        showNotification("Liked!");
      };
      actionDiv.appendChild(likeBtn);
      
      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.innerHTML = '💾 Save';
      saveBtn.onclick = () => {
        showNotification("Saved to favorites!");
      };
      actionDiv.appendChild(saveBtn);
      
      const shareBtn = document.createElement('button');
      shareBtn.className = 'share-btn';
      shareBtn.innerHTML = '🔗 Share';
      shareBtn.onclick = () => {
        navigator.share({ title: content.title, url: content.url })
          .catch(() => showNotification("Share failed"));
      };
      actionDiv.appendChild(shareBtn);
      
      card.innerHTML = `
        <div class="content-title">${escapeHtml(content.title)}</div>
        <img 
          class="content-image" 
          src="${createPlaceholder(300, 300)}" 
          data-src="${content.url}"
          loading="${index === 0 ? 'eager' : 'lazy'}"
          alt="adult content"
        >
      `;
      
      card.insertBefore(badgeContainer, card.firstChild);
      card.appendChild(reactionsDiv);
      card.appendChild(actionDiv);
      feed.appendChild(card);
      
      const img = card.querySelector('img');
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) {
            img.src = img.dataset.src;
            img.onload = () => img.classList.add('loaded');
            observer.disconnect();
          }
        });
        observer.observe(img);
      } else {
        img.src = img.dataset.src;
        img.onload = () => img.classList.add('loaded');
      }
    };
    
    const fetchContent = async () => {
      try {
        // Simulate fetching from adult sources
        const sources = {
          hot: [
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/01/12345678_p0.jpg', title: 'Hot Cosplay', ups: 12500},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/02/12345679_p0.jpg', title: 'Sexy Costume', ups: 9800},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/03/12345680_p0.jpg', title: 'Anime Girl', ups: 8700}
          ],
          asian: [
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/04/12345681_p0.jpg', title: 'Japanese Model', ups: 15000},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/05/12345682_p0.jpg', title: 'Korean Beauty', ups: 13200},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/06/12345683_p0.jpg', title: 'Chinese Idol', ups: 11500}
          ],
          cosplay: [
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/07/12345684_p0.jpg', title: 'Maid Outfit', ups: 14200},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/08/12345685_p0.jpg', title: 'School Uniform', ups: 12800},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/09/12345686_p0.jpg', title: 'Anime Character', ups: 10900}
          ],
          favorites: [
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/10/12345687_p0.jpg', title: 'Favorite 1', ups: 8800},
            {url: 'https://i.pximg.net/img-original/img/2023/04/05/00/00/11/12345688_p0.jpg', title: 'Favorite 2', ups: 7600}
          ]
        };
        
        const selectedSource = sources[currentTab] || sources.hot;
        const randomIndex = Math.floor(Math.random() * selectedSource.length);
        return selectedSource[randomIndex];
      } catch (e) {
        console.warn("Fetch failed:", e);
        return null;
      }
    };
    
    const loadFeed = async (clear = false) => {
      if (isLoading) return;
      isLoading = true;
      if (clear) {
        feed.innerHTML = '';
        loadCount = 0;
        seenUrls.clear();
      }
      
      if (loadCount === 0) {
        feed.innerHTML = '';
        for (let i = 0; i < 3; i++) {
          const skeleton = document.createElement('div');
          skeleton.className = 'skeleton-card';
          feed.appendChild(skeleton);
        }
      }
      
      const content = await fetchContent();
      if (content && !seenUrls.has(content.url)) {
        seenUrls.add(content.url);
        renderContent(content, loadCount);
        loadCount++;
      }
      
      if (loadCount > 0) {
        document.querySelectorAll('.skeleton-card').forEach(el => el.remove());
      }
      
      isLoading = false;
    };
    
    const switchTab = (tab) => {
      if (currentTab === tab) return;
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      seenUrls.clear();
      loadCount = 0;
      loadFeed(true);
    };
    
    const attachButtonListeners = () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
      });
      
      document.getElementById('rouletteBtn').onclick = () => {
        const tabs = ['hot', 'asian', 'cosplay'];
        const randomTab = tabs[Math.floor(Math.random() * tabs.length)];
        switchTab(randomTab);
      };
      
      document.getElementById('glowBtn').onclick = () => {
        document.body.style.background = 'linear-gradient(120deg, #0d0d1a, #1a0d1a, #0d1a1a)';
        document.body.style.animation = 'glowPulse 4s infinite alternate';
      };
      
      document.getElementById('chatBtn').onclick = () => {
        document.getElementById('chatPanel').classList.add('open');
      };
      
      document.getElementById('closeChat').onclick = () => {
        document.getElementById('chatPanel').classList.remove('open');
      };
      
      document.getElementById('createBtn').onclick = () => {
        if (!currentUser) {
          document.getElementById('authModal').style.display = 'flex';
          return;
        }
        document.getElementById('uploadModal').style.display = 'flex';
      };
      
      document.getElementById('leaderboardBtn').onclick = () => {
        document.getElementById('leaderboardPanel').classList.add('open');
      };
      
      document.getElementById('closeLeaderboard').onclick = () => {
        document.getElementById('leaderboardPanel').classList.remove('open');
      };
      
      document.getElementById('hamburgerBtn').onclick = () => {
        document.getElementById('hamburgerPanel').classList.add('open');
      };
      
      document.getElementById('closeHamburger').onclick = () => {
        document.getElementById('hamburgerPanel').classList.remove('open');
      };
      
      document.getElementById('closeAuth').onclick = () => {
        document.getElementById('authModal').style.display = 'none';
      };
      
      document.getElementById('closeUpload').onclick = () => {
        document.getElementById('uploadModal').style.display = 'none';
      };
      
      document.getElementById('authForm').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('emailInput').value;
        const password = document.getElementById('passwordInput').value;
        try {
          await auth.signInWithEmailAndPassword(email, password);
          document.getElementById('authModal').style.display = 'none';
          showNotification("Logged in successfully!");
        } catch (error) {
          showNotification("Login failed: " + error.message);
        }
      };
    };
    
    const initApp = async () => {
      feed = document.getElementById('feed');
      await initFirebase();
      attachButtonListeners();
      
      await loadFeed();
      
      let scrollTimer;
      feed.addEventListener('scroll', () => {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          const { scrollTop, scrollHeight, clientHeight } = feed;
          if (scrollHeight - scrollTop <= clientHeight + 300 && !isLoading) {
            loadFeed();
          }
        }, 100);
      }, { passive: true });
    };
    
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
